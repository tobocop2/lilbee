# cargo-about settings for a Rust engine pack.
# A crate that carries a licence outside this list stops the build. GPL, LGPL, AGPL and other
# strong copyleft terms are not on it.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
# Only the crates that the binary links are listed: not the tests and not the build scripts.
ignore-dev-dependencies = true
ignore-build-dependencies = true
