# A small two-GPU NVIDIA box, just long enough to answer what a laptop cannot:
# does the engine's buffer report exist on a CUDA build at the verbosity lilbee
# asks for, are its device labels the ones lilbee joins on, does a tensor split
# report per-device figures, and are the cgroup files there.
#
#   sky launch -c gpuverify tools/wf/verify-gpu.sky.yaml --env LILBEE_REF=<branch>
#   sky down gpuverify        <- do this; the pod bills until you do
name: gpuverify

resources:
  cloud: runpod
  accelerators: {A40:2, RTX4090:2, A5000:2, L40S:2}
  disk_size: 80
  # No region pin: nothing here mounts a network volume, so any datacentre with
  # a spare pair will do, and pinning only narrows capacity.

envs:
  # The branch under test, and the branch these scripts live on. They are
  # separate so the harness never has to ride along in the PR it verifies.
  LILBEE_REF: fix/ctx-slots-from-placed-device
  HARNESS_REF: tools/gpu-verification-harness
  # A small model keeps the load fast; the buffer report is the same shape at
  # any size, and this runs once per case.
  MODEL_REPO: bartowski/SmolLM2-135M-Instruct-GGUF
  MODEL_FILE: SmolLM2-135M-Instruct-Q4_K_M.gguf

setup: |
  set -euo pipefail
  # The RunPod image defaults to 3.10 and lilbee needs 3.11+, so pick the newest
  # interpreter the image actually ships rather than whatever python3 points at.
  PY=$(for v in 3.13 3.12 3.11; do command -v python$v && break; done)
  echo "interpreter: $PY ($($PY --version))"
  echo "$PY" > /workspace/py
  $PY -m venv /workspace/venv
  VPY=/workspace/venv/bin/python
  # Prebuilt engine only: compiling llama.cpp on a pod wastes 10+ minutes and
  # produces a single-arch binary.
  $VPY -m pip install --quiet --upgrade pip
  $VPY -m pip install --quiet --pre lilbee --extra-index-url https://lilbee.sh/cu124/
  # Overlay the branch under test without disturbing the engine wheel.
  $VPY -m pip install --quiet --no-deps --force-reinstall \
      "git+https://github.com/tobocop2/lilbee@${LILBEE_REF}"
  $VPY -c "import lilbee_engine, os; p=lilbee_engine.get_llama_server_path(); assert os.access(p, os.X_OK), p; print('engine ok:', p)"
  $VPY -m pip install --quiet huggingface_hub
  $VPY - <<'PYEOF'
  import os
  from huggingface_hub import hf_hub_download
  path = hf_hub_download(os.environ["MODEL_REPO"], os.environ["MODEL_FILE"])
  os.makedirs("/workspace", exist_ok=True)
  with open("/workspace/model-path", "w") as fh:
      fh.write(path)
  print("model:", path)
  PYEOF

run: |
  set -uo pipefail
  curl -fsSL "https://raw.githubusercontent.com/tobocop2/lilbee/${HARNESS_REF}/tools/wf/verify_gpu_readback.sh" \
      -o /workspace/verify.sh
  chmod +x /workspace/verify.sh
  PATH=/workspace/venv/bin:$PATH MODEL="$(cat /workspace/model-path)" \
      OUT=/workspace/verify-out /workspace/verify.sh
  curl -fsSL "https://raw.githubusercontent.com/tobocop2/lilbee/${HARNESS_REF}/tools/wf/verify_driver_accounting.sh" \
      -o /workspace/driver.sh
  chmod +x /workspace/driver.sh
  PATH=/workspace/venv/bin:$PATH MODEL="$(cat /workspace/model-path)" \
      OUT=/workspace/driver-out /workspace/driver.sh
