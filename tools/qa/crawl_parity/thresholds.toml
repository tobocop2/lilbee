# Every limit the verdict uses. Each value is PROPOSED: the owner sets them.
# The evidence for each proposal is the crawl audit of 2026-10-08 (crawlberg 1.10.2 against crawl4ai 0.9.2).

[parity]
# PROPOSED 0. Pages the oracle saved and the candidate did not. The audit lost 12 of 69 real
# pages to one defect; the owner's goal is that no page is lost.
pages_lost_max = 0
# PROPOSED 0. Pages only the candidate saved that a reader would not get (an error answer, a
# body that is not a page). A page only the candidate saved that a reader does get never counts.
pages_extra_unreadable_max = 0
# PROPOSED 0. Word tokens of the oracle's markdown missing from the candidate's, for one page.
# The audit counted 163 distinct lost words on 62 real pages and every one was a defect class.
words_lost_per_page_max = 0
# PROPOSED 0. Word tokens only the candidate has that the page does not show. The audit counted
# 233 on 62 pages (joined words, the words "SVG Image"), all filed as defects.
words_added_per_page_max = 0
# PROPOSED false. Whether a lost word that the rendered page does not show counts as lost.
# The audit classed dropped hidden text as blocking (issue html-to-markdown 753); a reader never
# sees that text, so the proposal is to report it and not fail on it.
invisible_text_lost_counts = false
# PROPOSED 0. Symbol tokens (punctuation runs) lost or added for one page. The audit's noise
# classes (task brackets, a formula comment, an empty link target) are symbols, not words.
symbols_changed_per_page_max = 0
# PROPOSED 0. Structure elements (headings, links, code blocks, tables, list items) whose
# descriptions differ, for one page. The audit found nested tables and nested link blocks changed.
structure_changed_per_page_max = 0

[truth]
# PROPOSED 0.95. With no oracle, the least share of a page's visible words the markdown must
# hold. With an oracle the parity limits above decide and this value is not used.
visible_recall_min = 0.95
# PROPOSED 0. With no oracle, the most words per page that the markdown holds and the page
# neither shows nor carries as hidden or attribute text.
unexplained_words_per_page_max = 0

[left_behind]
# PROPOSED 0. Processes of a run alive after it ended. The audit: one Chrome with two helpers
# for every browser crawl (issue crawlberg 594).
processes_max = 0
# PROPOSED 0. Entries a run leaves in its own temp directory. The audit: one profile directory
# of about 120 KiB for every browser crawl.
temp_entries_max = 0
# PROPOSED 0. Python threads alive in the driver after the crawl closed that were not alive before it.
threads_max = 0

[speed]
# PROPOSED 3. Runs per side and mode. The audit's three runs agreed within 3 percent.
repeats = 3
# PROPOSED 1.0. One-minute load average for each processor above which no comparison is printed.
# The audit ran at 0.5 to 2.2 and could only report ratios.
load_max = 1.0
# PROPOSED 0.10. The candidate's median pages per second may be this share below the oracle's.
# The audit measured a browser-mode candidate at 0.21 of the oracle (issue crawlberg 595).
slowdown_max = 0.10
# PROPOSED 0.5. Seconds the candidate's median first page may come after the oracle's.
# The audit measured 4.8 s in browser mode.
first_page_delay_max = 0.5

[retrieval]
# PROPOSED 5. A question is answered when its page is among this many results.
top_k = 5
# PROPOSED 60. Sentences sampled as questions. The slow yardstick; raise it for a release run.
sample_size = 60
# PROPOSED 0.02. Recall at k of the candidate may be this much below the oracle's.
# The audit did not measure retrieval; this value is one question in fifty.
recall_drop_max = 0.02
