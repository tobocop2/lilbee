[pytest]
addopts = -ra --strict-markers --tb=short
testpaths = .
asyncio_mode = auto

# --timeout-method=thread is mandatory on Windows (signal method doesn't work there)
timeout = 120
timeout_method = thread

markers =
    smoke: T0 smoke; gates publish promotion
    cli: T1 CLI walk; gates publish promotion
    http: T2 HTTP walk; gates publish promotion
    mcp: T3 MCP walk; visibility-only
    tui: T4 TUI walk; visibility-only
    wiki: T5 wiki cross-surface; visibility-only
    catalog: T6 catalog/pull; one-cell-only on Linux
    resilience: T7 resilience; visibility-only
    crawl: T8 crawl; opt-in via workflow_dispatch
    vision: T9 vision OCR; opt-in via workflow_dispatch
    writer: serializes via xdist_group("writers"); mutates LanceDB
    flaky_network: tagged tests get pytest-rerunfailures retries
