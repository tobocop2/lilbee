# QA matrix model list. Local-only; not pulled in by CI.
#
# Each entry is one cell. The smoke tier (S1+S2+S3) runs on every model.
# Set ``skip = true`` to keep an entry around but skip it on the next run.

[[model]]
family = "qwen3"
ref = "Qwen/Qwen3-4B-GGUF/Qwen3-4B-Q4_K_M.gguf"
size_gb = 2.5

[[model]]
family = "gemma4"
ref = "unsloth/gemma-4-E2B-it-GGUF/gemma-4-E2B-it-Q4_K_M.gguf"
