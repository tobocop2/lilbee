# QA matrix model list. Local-only; not pulled in by CI.
#
# Each entry is one cell. The smoke tier (S1+S2+S3) runs on every model.
# Order is disk-efficient: smallest cells first (the harness deletes the
# cell's GGUF blob after each cell to keep ~33 GB total disk pressure flat
# even when the bench drives 70+ GB of cumulative pulls). Set ``skip = true``
# to keep an entry around but skip it on the next run.

