ref = "bartowski/Hermes-3-Llama-3.1-8B-GGUF/Hermes-3-Llama-3.1-8B-Q4_K_M.gguf"
size_gb = 4.9
# Re-enabled: chat_format_override now swaps the stripped embedded template
# for chatml-function-calling, so the model sees tools again.

