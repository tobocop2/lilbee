# Run the same lint, format, and type checks CI enforces, before each commit.
# Hooks call the project's existing tools so there's no second config to keep in sync.
# Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src/lilbee/
        language: system
        types: [python]
        pass_filenames: false
