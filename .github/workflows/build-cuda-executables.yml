name: Build CUDA executables

# CUDA-flavored standalone executables for an already-published release tag.
# Runs on workflow_dispatch only. Each cell builds independently; failures
# do not block the rest. Attaches successful builds to the release named
# by the tag input.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach CUDA executables to (e.g. v0.6.66b476)."
        required: true
      skip_tests:
        description: "Build even if the smoke step fails (re-run past a known-flaky cell)."
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # fanout-cuda dispatches publish-cuda-packages.yml

concurrency:
  group: build-cuda-executables-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      ref: ${{ steps.info.outputs.ref }}
    steps:
      - name: Resolve tag and ref
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sha=$(gh api "repos/${REPO}/git/refs/tags/${TAG}" --jq .object.sha)
          [ -n "$sha" ] || { echo "tag ${TAG} not found"; exit 1; }
          {
            echo "version=$version"
            echo "ref=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [resolve]
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux CUDA cells run on ubuntu-22.04, not the manylinux container: install_gpu_toolkit.sh is apt-based, and glibc 2.35 stays above the README's 2.28 floor.
          - os: ubuntu-22.04
            backend: cu121
            cuda: "12.1.0"
            asset_name: lilbee-linux-x86_64-cu121
          - os: ubuntu-22.04
            backend: cu124
            cuda: "12.4.0"
            asset_name: lilbee-linux-x86_64-cu124
          - os: ubuntu-22.04
            backend: cu125
            cuda: "12.5.0"
            asset_name: lilbee-linux-x86_64-cu125
          # Windows cu121 dropped: MSVC 14.44 on windows-2022 requires CUDA 12.4+.
          - os: windows-2022
            backend: cu124
            cuda: "12.4.0"
            asset_name: lilbee-windows-x86_64-cu124.exe
          - os: windows-2022
            backend: cu125
            cuda: "12.5.0"
            asset_name: lilbee-windows-x86_64-cu125.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Compute version
        # NUITKA_VERSION: int-tuple form Nuitka --product-version accepts.
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          NUITKA_VERSION=$(echo "$VERSION" | tr -cs '0-9' ' ' | awk '{ printf "%s.%s.%s.%s", $1, $2, $3, $4 }')
          echo "LILBEE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LILBEE_NUITKA_VERSION=$NUITKA_VERSION" >> "$GITHUB_ENV"

      - name: Install CUDA Toolkit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust","visual_studio_integration"]'

      - name: Set up ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: nuitka-${{ matrix.os }}-${{ matrix.backend }}
          max-size: '2G'

      - name: Install dependencies
        # `pip` is required by build_llama_cpp.sh's `pip wheel` invocation.
        run: uv sync --extra release && uv pip install 'nuitka[onefile]>=4.0,<5' pip

      - name: Build llama-cpp-python from source (CUDA + AVX baseline)
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          LLAMA_BUILD_DIR: "/tmp/llama-build"
        run: bash tools/wheel-build/build_llama_cpp.sh

      - name: Install the freshly-built llama-cpp-python into the venv
        shell: bash
        run: |
          set -euxo pipefail
          uv pip install --reinstall --no-deps /tmp/llama-build/llama_cpp_python-*.whl

      - name: Verify extras installed in build venv
        shell: bash
        # --no-sync is load-bearing: re-syncing reinstalls python-multipart and shadows the shim.
        run: uv run --no-sync python -c "import crawl4ai, litellm, spacy, graspologic_native; print('extras OK')"

      - name: Build executable
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          PRODUCT_VERSION: ${{ env.LILBEE_NUITKA_VERSION }}
        run: bash tools/wheel-build/build_lilbee_binary.sh

      - name: Smoke test
        # CUDA binaries on no-GPU runners fall back to CPU because GGML_CPU stays on by default.
        if: inputs.skip_tests != true
        shell: bash
        run: |
          set -euxo pipefail
          EXE="./dist/${{ matrix.asset_name }}"
          EXPECTED=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)

          STDERR=$(mktemp)
          ACTUAL=$("$EXE" --version 2>"$STDERR")
          echo "Expected: lilbee ${EXPECTED}"
          echo "Actual:   ${ACTUAL}"
          cat "$STDERR"
          test "${ACTUAL}" = "lilbee ${EXPECTED}"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --version produced typer/runtime errors on stderr"
            exit 1
          fi

          "$EXE" --help > /dev/null 2>"$STDERR"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --help produced typer/runtime errors on stderr"
            cat "$STDERR"
            exit 1
          fi

          echo "CUDA smoke test passed (--version, --help)"

      - name: Upload binary as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Attach binary to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/${{ matrix.asset_name }}
          fail_on_unmatched_files: true

  # Runs in parallel with the build matrix. Polls the release for the cu125
  # Linux asset (the only one publish-cuda-packages.yml consumes) and dispatches
  # it as soon as that asset attaches, without waiting for Windows cu125 to
  # finish its ~3-4h build. Fails loudly if cu125 Linux never attaches.
  fanout-cuda:
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait for cu125 Linux asset and dispatch publish-cuda-packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 14000 ))
          while true; do
            names=$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || echo "")
            case " ${names} " in
              *" lilbee-linux-x86_64-cu125 "*)
                echo "cu125 Linux attached; dispatching publish-cuda-packages"
                gh workflow run publish-cuda-packages.yml --repo "${REPO}" -f tag="${TAG}"
                exit 0
                ;;
            esac
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::cu125 Linux never attached to ${TAG} within 4h; skipping publish-cuda-packages dispatch"
              exit 1
            fi
            sleep 60
          done
