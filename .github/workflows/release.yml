name: Release Executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for artifact uploads (use a -nuitka.N suffix for dry-runs).'
        required: true

permissions:
  contents: write

env:
  LLAMA_CPP_VERSION: "0.3.20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync
      - run: make lint
      - run: make format-check
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync
      - run: make test-ci
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee

  build:
    needs: [lint, test]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
            asset_name: lilbee-linux-x86_64
            backend: vulkan
          - os: macos-latest
            asset_name: lilbee-macos-arm64
            backend: metal
          - os: macos-13
            asset_name: lilbee-macos-x86_64
            backend: metal
          - os: windows-latest
            asset_name: lilbee-windows-x86_64.exe
            backend: vulkan

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Compute version
        # NUITKA_VERSION strips PEP 440 modifiers (b, rc, .dev) to a plain
        # int-tuple Nuitka --product-version accepts (0.6.66.456 vs 0.6.66b456).
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          NUITKA_VERSION=$(echo "$VERSION" | tr -cs '0-9' ' ' | awk '{ printf "%s.%s.%s.%s", $1, $2, $3, $4 }')
          echo "LILBEE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LILBEE_NUITKA_VERSION=$NUITKA_VERSION" >> "$GITHUB_ENV"

      # manylinux_2_34 container (AlmaLinux 9, glibc 2.34) is dnf-based;
      # apt-based install_gpu_toolkit.sh skips it and we install the Vulkan
      # SDK from LunarG instead.
      - name: Install Vulkan SDK (manylinux container)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euxo pipefail
          dnf install -y libxkbcommon-devel libX11-devel libXrandr-devel libXcursor-devel libXi-devel libXinerama-devel mesa-libGL-devel
          VULKAN_VERSION="1.3.296.0"
          curl -L -o /tmp/vulkan-sdk.tar.xz \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          mkdir -p /opt/vulkan
          tar -xf /tmp/vulkan-sdk.tar.xz -C /opt/vulkan --strip-components=1
          {
            echo "VULKAN_SDK=/opt/vulkan/x86_64"
            echo "LD_LIBRARY_PATH=/opt/vulkan/x86_64/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          echo "/opt/vulkan/x86_64/bin" >> "$GITHUB_PATH"

      # GPU build SDK on macOS / Windows runners. Linux is handled by the
      # LunarG step above. Compile flags live in tools/wheel-build/cmake_args.sh.
      - name: Install GPU build toolkit
        if: matrix.container == '' && matrix.backend != 'metal'
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Set up ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: nuitka-${{ matrix.os }}-${{ matrix.backend }}
          max-size: '2G'

      - name: Install dependencies
        # `pip` is added explicitly: uv-managed Python ships without it,
        # but build_llama_cpp.sh shells out to `pip wheel` to build
        # llama-cpp-python from source.
        run: uv sync --extra release && uv pip install 'nuitka[onefile]>=4.0,<5' pip

      # Build llama-cpp-python from source via the same script the wheel
      # job uses. uv pip install --reinstall hit uv's package cache by
      # version key (0.3.20) and reused a previously-built (AVX2-tuned)
      # wheel regardless of CMAKE_ARGS, so the exe shipped with whatever
      # the first cached build had baked in. Going through pip wheel +
      # local-wheel install bypasses uv's cache entirely.
      - name: Build llama-cpp-python from source (GPU + AVX baseline)
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          LLAMA_BUILD_DIR: "/tmp/llama-build"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: bash tools/wheel-build/build_llama_cpp.sh

      - name: Install the freshly-built llama-cpp-python into the venv
        shell: bash
        run: |
          set -euxo pipefail
          uv pip install --reinstall --no-deps /tmp/llama-build/llama_cpp_python-*.whl

      - name: Verify extras installed in build venv
        shell: bash
        # --no-sync is load-bearing: a plain `uv run` re-syncs the venv
        # against the lockfile, which reinstalls python-multipart after
        # the explicit uninstall in "Install dependencies" and reproduces
        # the multipart-shim shadowing failure at frozen-binary startup.
        run: uv run --no-sync python -c "import crawl4ai, litellm, spacy, graspologic_native; print('extras OK')"

      - name: Build executable
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          PRODUCT_VERSION: ${{ env.LILBEE_NUITKA_VERSION }}
        run: bash tools/wheel-build/build_lilbee_binary.sh

      - name: Smoke test
        # Prove the frozen binary actually works, not just that it starts.
        # --version must match pyproject.toml; --help must succeed;
        # the server must come up and /api/health must report the same
        # version. This catches PyInstaller bundling regressions (missing
        # data files like featured_models.toml, shadowed modules like
        # python-multipart) that a bare --version would miss.
        run: |
          set -euxo pipefail
          EXE="./dist/${{ matrix.asset_name }}"
          EXPECTED=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)

          # --version matches pyproject.toml. Capture stderr too: a flood
          # of "No such option: -B" means the frozen binary is looping on
          # multiprocessing.resource_tracker spawn (sys.executable re-enters
          # typer). stdout can still carry the right version while the
          # process is actually broken, so stdout-only checks give false
          # green. Same for --help.
          STDERR=$(mktemp)
          ACTUAL=$("$EXE" --version 2>"$STDERR")
          echo "Expected: lilbee ${EXPECTED}"
          echo "Actual:   ${ACTUAL}"
          echo "Stderr:"
          cat "$STDERR"
          test "${ACTUAL}" = "lilbee ${EXPECTED}"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --version produced typer/runtime errors on stderr"
            exit 1
          fi

          # --help must be clean on stderr too.
          "$EXE" --help > /dev/null 2>"$STDERR"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --help produced typer/runtime errors on stderr"
            cat "$STDERR"
            exit 1
          fi

          # Server starts, /api/health reports matching version.
          # Capture server stderr to a log so we can scan it for the same
          # subprocess-spawn failure pattern.
          export LILBEE_DATA="${{ runner.temp }}/lilbee-smoke"
          mkdir -p "$LILBEE_DATA"
          SERVER_LOG=$(mktemp)
          "$EXE" serve --port 9123 >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; echo "=== server log ==="; cat "$SERVER_LOG" || true' EXIT

          for i in $(seq 1 30); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "server process died"
              cat "$SERVER_LOG"
              exit 1
            fi
            if curl -sf http://127.0.0.1:9123/api/health > /dev/null 2>&1; then
              echo "server responded on attempt $i"
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "server never responded after 30s"
              cat "$SERVER_LOG"
              exit 1
            fi
          done

          HEALTH=$(curl -sf http://127.0.0.1:9123/api/health)
          echo "Health payload: ${HEALTH}"
          SERVER_VERSION=$(uv run --no-sync python -c "import json, sys; print(json.loads(sys.argv[1])['version'])" "${HEALTH}")
          test "${SERVER_VERSION}" = "${EXPECTED}"

          if grep -qE "No such option|Type not yet supported" "$SERVER_LOG"; then
            echo "FAIL: server log contains subprocess/typer errors"
            exit 1
          fi

          # END-TO-END INFERENCE: the self-check command downloads SmolLM2
          # 135M (~90MB) and runs a tiny completion through the vendored
          # llama.cpp bundled in the exe. This catches the missing-shared-
          # library class of failures ("Shared library with base name 'llama'
          # not found") that the previous smoke couldn't see because it
          # never loaded a model. Passing proves llama_cpp + ggml .so/.dylib/
          # .dll got bundled into the frozen binary AND that inference runs
          # on this OS.
          SELF_CHECK_LOG=$(mktemp)
          SELF_CHECK_RC=0
          "$EXE" --json self-check > "$SELF_CHECK_LOG" 2>&1 || SELF_CHECK_RC=$?
          echo "=== self-check output (exit=${SELF_CHECK_RC}) ==="
          cat "$SELF_CHECK_LOG"
          if [ "${SELF_CHECK_RC}" != "0" ]; then
            echo "FAIL: self-check exited ${SELF_CHECK_RC}"
            exit 1
          fi
          uv run --no-sync python tools/wheel-build/parse_self_check.py "$SELF_CHECK_LOG"

          # Confirm the optional extras were bundled. Their runtime guards
          # keep them off the cold-start import path, so self-check above
          # wouldn't notice if Nuitka dropped them. Replaces the byte-grep
          # over the binary that worked under PyInstaller: Nuitka compiles
          # to C and the literal package-name strings may not appear in the
          # binary even when the modules are correctly bundled.
          EXTRAS_LOG=$(mktemp)
          EXTRAS_RC=0
          "$EXE" --json self-check-extras > "$EXTRAS_LOG" 2>&1 || EXTRAS_RC=$?
          echo "=== self-check-extras output (exit=${EXTRAS_RC}) ==="
          cat "$EXTRAS_LOG"
          if [ "${EXTRAS_RC}" != "0" ]; then
            echo "FAIL: self-check-extras exited ${EXTRAS_RC}"
            exit 1
          fi

          echo "SMOKE TEST PASSED: --version, --help, server, /api/health, self-check inference, extras-import all green"
        shell: bash

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset_name }}

      - name: Upload artifact (workflow_dispatch dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
