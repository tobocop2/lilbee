name: Release Executables

# Builds the standalone executables and uploads them as run artifacts. It never
# attaches anything to a release -- callers (release-candidate.yml, publish.yml,
# emergency-publish.yml) collect the artifacts and decide.
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Build the executables even if the test job fails (re-run past a known-flaky test)."
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the calling workflow's ref)."
        type: string
        default: ""
      skip_tests:
        description: "Build the executables even if the test job fails (re-run past a known-flaky test)."
        type: boolean
        default: false
      release_tag:
        description: "GH release tag to eagerly attach each built executable to (empty = artifacts only)."
        type: string
        default: ""

permissions:
  contents: write  # eager release_tag attach; otherwise read-only behavior is unchanged
  actions: read   # gate job: look up the CI workflow's conclusion for this commit

jobs:
  # Skip the lint + test re-run if the CI workflow already went green on this
  # exact commit (every main push runs it). Fail-soft: any uncertainty -> run them.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ci_passed: ${{ steps.check.outputs.ci_passed }}
    steps:
      - name: Did CI already pass on this commit?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          REF="${INPUT_REF:-$DEFAULT_REF}"
          REF="${REF#refs/tags/}"; REF="${REF#refs/heads/}"   # bare ref for the commits API
          SHA=$(gh api "repos/${REPO}/commits/${REF}" --jq .sha 2>/dev/null) || SHA=""
          if [ -z "$SHA" ]; then
            echo "couldn't resolve ${REF} -> SHA; will run lint + test"
            echo "ci_passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PASSED=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' 2>/dev/null) || PASSED=0
          echo "${REF} -> ${SHA}; successful CI runs = ${PASSED}"
          if [ "${PASSED:-0}" -gt 0 ]; then
            echo "ci_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci_passed=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: [gate]
    if: needs.gate.outputs.ci_passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync
        env:
          # AVX-baseline llama-cpp-python build; see the test job below.
          CMAKE_ARGS: >-
            -DGGML_METAL=OFF
            -DGGML_NATIVE=OFF
            -DGGML_BLAS=OFF
            -DGGML_CUDA=OFF
            -DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF
            -DGGML_BMI2=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX512=OFF
      - run: make lint
      - run: make format-check
      - run: make typecheck

  test:
    needs: [gate]
    if: needs.gate.outputs.ci_passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync
        env:
          # llama-cpp-python is sdist-only; an unflagged build compiles ggml
          # with -march=native, and the built wheel is shared across runners
          # with different CPUs via the setup-uv cache, SIGILLing the test
          # job. Cap at AVX baseline like ci.yml's test matrix.
          CMAKE_ARGS: >-
            -DGGML_METAL=OFF
            -DGGML_NATIVE=OFF
            -DGGML_BLAS=OFF
            -DGGML_CUDA=OFF
            -DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF
            -DGGML_BMI2=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX512=OFF
      - run: make test-ci
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee

  build:
    needs: [gate, lint, test]
    # Build if CI already passed on this commit (lint/test skipped), or lint+test
    # pass here, or skip_tests was set after eyeballing a flaky failure. lint
    # always gates -- a real lint failure isn't bypassable. always() so the if:
    # runs even when lint/test were skipped or test failed.
    if: |
      always()
      && needs.gate.result == 'success'
      && needs.lint.result != 'failure' && needs.lint.result != 'cancelled'
      && (needs.gate.outputs.ci_passed == 'true' || needs.test.result == 'success' || inputs.skip_tests)
    # Windows Nuitka has no ccache and was hitting 180m; 300m gives it room.
    timeout-minutes: 300
    # Only soft cells (the pre-Haswell compat build) may fail without failing the
    # release; every default binary stays hard-required.
    continue-on-error: ${{ matrix.soft == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
            asset_name: lilbee-linux-x86_64
            backend: vulkan
          # Pre-Haswell-safe Linux build: the same Vulkan binary with the stock
          # lancedb swapped for the +compat wheel and the launcher held to an
          # x86-64-v2 baseline, so it runs on Sandy Bridge / Bulldozer CPUs. Soft and
          # self-contained -- no pyproject/uv.lock footprint, and a failure (until the
          # wheel index is live) never blocks the release. This is the binary the CPU
          # package channels (AUR/snap/flatpak/nix/homebrew) would carry as a -compat.
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
            asset_name: lilbee-compat-linux-x86_64
            backend: vulkan
            compat: true
            soft: true
            march: x86-64-v2
          - os: macos-latest
            asset_name: lilbee-macos-arm64
            backend: metal
          # Intel Mac dropped: macos-13 hosted runners stay queued; pip wheel covers them.
          - os: windows-latest
            asset_name: lilbee-windows-x86_64.exe
            backend: vulkan
          # Pre-Haswell-safe Windows build for the scoop lilbee-compat manifest.
          # Same soft, self-contained model as the Linux compat cell; MSVC's default
          # baseline is already conservative, so no -march override is needed here.
          - os: windows-latest
            asset_name: lilbee-compat-windows-x86_64.exe
            backend: vulkan
            compat: true
            soft: true

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Compute version
        # NUITKA_VERSION: int-tuple form Nuitka --product-version accepts.
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          NUITKA_VERSION=$(echo "$VERSION" | tr -cs '0-9' ' ' | awk '{ printf "%s.%s.%s.%s", $1, $2, $3, $4 }')
          echo "LILBEE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LILBEE_NUITKA_VERSION=$NUITKA_VERSION" >> "$GITHUB_ENV"

      # manylinux_2_34 (AlmaLinux 9) is dnf-based; install Vulkan SDK from LunarG.
      - name: Install Vulkan SDK (manylinux container)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euxo pipefail
          dnf install -y libxkbcommon-devel libX11-devel libXrandr-devel libXcursor-devel libXi-devel libXinerama-devel mesa-libGL-devel
          VULKAN_VERSION="1.3.296.0"
          curl -L -o /tmp/vulkan-sdk.tar.xz \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          mkdir -p /opt/vulkan
          tar -xf /tmp/vulkan-sdk.tar.xz -C /opt/vulkan --strip-components=1
          {
            echo "VULKAN_SDK=/opt/vulkan/x86_64"
            echo "LD_LIBRARY_PATH=/opt/vulkan/x86_64/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          echo "/opt/vulkan/x86_64/bin" >> "$GITHUB_PATH"

      # GPU build SDK on macOS/Windows; Linux uses the LunarG step above.
      - name: Install GPU build toolkit
        if: matrix.container == '' && matrix.backend != 'metal'
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Set up ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: nuitka-${{ matrix.os }}-${{ matrix.backend }}
          max-size: '2G'
          # Tag-scoped cache saves are unrestorable by future runs; don't evict useful ones.
          save: ${{ github.ref_type != 'tag' }}

      - name: Install dependencies
        # `pip` is required by build_llama_cpp.sh's `pip wheel` invocation.
        run: uv sync --extra release && uv pip install 'nuitka[onefile]>=4.0,<5' pip

      # uv's package cache reuses by version key, so build via pip wheel + local-wheel install bypasses it.
      - name: Build llama-cpp-python from source (GPU + AVX baseline)
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          LLAMA_BUILD_DIR: "/tmp/llama-build"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: bash tools/wheel-build/build_llama_cpp.sh

      - name: Install the freshly-built llama-cpp-python into the venv
        shell: bash
        run: |
          set -euxo pipefail
          uv pip install --reinstall --no-deps /tmp/llama-build/llama_cpp_python-*.whl

      - name: Verify extras installed in build venv
        shell: bash
        # --no-sync is load-bearing: re-syncing reinstalls python-multipart and shadows the shim.
        run: uv run --no-sync python -c "import crawl4ai, litellm, spacy, graspologic_native; print('extras OK')"

      # compat cell only: swap the synced stock lancedb for the pre-Haswell build.
      # --no-deps leaves the rest of the venv intact, so nothing leaves this cell.
      # Pinned to the latest stable lancedb for Python (0.33), served by the fork as
      # +compat; lilbee's own stock pin can lag. Bump when the fork moves.
      - name: Swap in the pre-Haswell lancedb
        if: matrix.compat
        shell: bash
        run: |
          uv pip install --reinstall --no-deps \
            --extra-index-url https://lilbee.sh/compat/ \
            lancedb==0.33.0+compat

      - name: Build executable
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          PRODUCT_VERSION: ${{ env.LILBEE_NUITKA_VERSION }}
          # compat cell only: hold Nuitka's C output to the pre-Haswell baseline so
          # the launcher layer (not just lancedb) runs on old silicon. Empty elsewhere.
          CFLAGS: ${{ matrix.march && format('-march={0}', matrix.march) || '' }}
          CXXFLAGS: ${{ matrix.march && format('-march={0}', matrix.march) || '' }}
        run: bash tools/wheel-build/build_lilbee_binary.sh

      - name: Smoke test
        # End-to-end: --version, --help, server boot, /api/health version match, self-check inference, extras-import.
        run: |
          set -euxo pipefail
          EXE="./dist/${{ matrix.asset_name }}"
          EXPECTED=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)

          # Capture stderr: stdout-only checks miss the multiprocessing spawn loop ("No such option: -B").
          STDERR=$(mktemp)
          ACTUAL=$("$EXE" --version 2>"$STDERR")
          echo "Expected: lilbee ${EXPECTED}"
          echo "Actual:   ${ACTUAL}"
          echo "Stderr:"
          cat "$STDERR"
          test "${ACTUAL}" = "lilbee ${EXPECTED}"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --version produced typer/runtime errors on stderr"
            exit 1
          fi

          # --help must be clean on stderr too.
          "$EXE" --help > /dev/null 2>"$STDERR"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --help produced typer/runtime errors on stderr"
            cat "$STDERR"
            exit 1
          fi

          # Frozen multiprocessing reinvocations must be intercepted before typer.
          # Two real reinvocation shapes the running binary spawns into itself:
          #   1. the splash subprocess: [exe, -m, lilbee.runtime._splash_runner, <fd>]
          #   2. the resource tracker:  [exe, -c, "from multiprocessing... main(<fd>)"]
          # Nuitka never sets sys.frozen, so a build that mis-detects frozen state
          # leaks these into typer ("No such command '<fd>'", "No such option: -c"),
          # which is what users see on TUI exit. Drive both shapes directly; fd 999
          # is unopened so the splash runner sees a dead pipe and exits immediately.
          MP=$(mktemp)
          "$EXE" -m lilbee.runtime._splash_runner 999 > "$MP" 2>&1 || true
          if grep -qE "No such command|No such option" "$MP"; then
            echo "FAIL: splash -m reinvocation leaked into typer (frozen detection broken)"
            cat "$MP"
            exit 1
          fi
          # The runner ships only via --include-module; catch a missing module here too.
          if grep -qE "No module named|ModuleNotFoundError" "$MP"; then
            echo "FAIL: splash runner module is not bundled in the frozen binary"
            cat "$MP"
            exit 1
          fi
          # Any traceback means the dispatch crashed running the module. runpy.run_module
          # raised AttributeError ("nuitka_module_loader has no attribute 'get_code'") in
          # the onefile binary; fd 999 is dead, so the runner must exit silently.
          if grep -qE "Traceback|Error:|get_code" "$MP"; then
            echo "FAIL: splash -m reinvocation raised an exception in the frozen binary"
            cat "$MP"
            exit 1
          fi
          "$EXE" -c "import multiprocessing" > "$MP" 2>&1 || true
          if grep -qE "No such command|No such option" "$MP"; then
            echo "FAIL: resource-tracker -c reinvocation leaked into typer (frozen detection broken)"
            cat "$MP"
            exit 1
          fi
          if grep -qE "Traceback|Error:|get_code" "$MP"; then
            echo "FAIL: resource-tracker -c reinvocation raised an exception in the frozen binary"
            cat "$MP"
            exit 1
          fi

          # Boot server, scan stderr for the spawn-loop pattern, verify /api/health version.
          export LILBEE_DATA="${{ runner.temp }}/lilbee-smoke"
          mkdir -p "$LILBEE_DATA"
          SERVER_LOG=$(mktemp)
          "$EXE" serve --port 9123 >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; echo "=== server log ==="; cat "$SERVER_LOG" || true' EXIT

          for i in $(seq 1 30); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "server process died"
              cat "$SERVER_LOG"
              exit 1
            fi
            if curl -sf http://127.0.0.1:9123/api/health > /dev/null 2>&1; then
              echo "server responded on attempt $i"
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "server never responded after 30s"
              cat "$SERVER_LOG"
              exit 1
            fi
          done

          HEALTH=$(curl -sf http://127.0.0.1:9123/api/health)
          echo "Health payload: ${HEALTH}"
          SERVER_VERSION=$(uv run --no-sync python -c "import json, sys; print(json.loads(sys.argv[1])['version'])" "${HEALTH}")
          test "${SERVER_VERSION}" = "${EXPECTED}"

          if grep -qE "No such option|Type not yet supported" "$SERVER_LOG"; then
            echo "FAIL: server log contains subprocess/typer errors"
            exit 1
          fi

          # End-to-end inference: self-check loads a tiny model through bundled llama.cpp and runs a completion.
          SELF_CHECK_LOG=$(mktemp)
          SELF_CHECK_RC=0
          "$EXE" --json self-check > "$SELF_CHECK_LOG" 2>&1 || SELF_CHECK_RC=$?
          echo "=== self-check output (exit=${SELF_CHECK_RC}) ==="
          cat "$SELF_CHECK_LOG"
          if [ "${SELF_CHECK_RC}" != "0" ]; then
            echo "FAIL: self-check exited ${SELF_CHECK_RC}"
            exit 1
          fi
          uv run --no-sync python tools/wheel-build/parse_self_check.py "$SELF_CHECK_LOG"

          # Confirm optional extras were bundled (runtime guards hide them from the cold-start import path).
          EXTRAS_LOG=$(mktemp)
          EXTRAS_RC=0
          "$EXE" --json self-check-extras > "$EXTRAS_LOG" 2>&1 || EXTRAS_RC=$?
          echo "=== self-check-extras output (exit=${EXTRAS_RC}) ==="
          cat "$EXTRAS_LOG"
          if [ "${EXTRAS_RC}" != "0" ]; then
            echo "FAIL: self-check-extras exited ${EXTRAS_RC}"
            exit 1
          fi

          echo "SMOKE TEST PASSED: --version, --help, server, /api/health, self-check inference, extras-import all green"
        shell: bash

      - name: Upload binary as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      # The Linux cell builds inside the manylinux container, which ships no gh
      # CLI, so the attach below fails with "gh: command not found" (exit 127)
      # every time, which silently strands the release fan-out. Install it here;
      # the windows/macOS host runners already have gh.
      - name: Install gh CLI in the build container
        if: inputs.release_tag != '' && matrix.container != ''
        shell: bash
        run: |
          if command -v gh >/dev/null 2>&1; then exit 0; fi
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh
          gh --version

      # Eager attach: release-candidate creates the pre-release shell before
      # calling, so the asset shows up as soon as this cell finishes.
      - name: Attach binary to the GH pre-release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO is load-bearing: without it gh resolves the repo from the
          # git remote, and inside the root-run manylinux container git refuses
          # the runner-owned checkout ("detected dubious ownership"), so the
          # Linux upload fails. Passing the repo explicitly skips git entirely.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" "dist/${{ matrix.asset_name }}" --clobber
