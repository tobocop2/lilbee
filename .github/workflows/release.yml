name: Release Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync
      - run: make lint
      - run: make format-check
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync
      - run: make test-ci
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee

  build:
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: lilbee-linux-x86_64
            pyinstaller: .venv/bin/pyinstaller
          - os: macos-latest
            asset_name: lilbee-macos-arm64
            pyinstaller: .venv/bin/pyinstaller
          - os: windows-latest
            asset_name: lilbee-windows-x86_64.exe
            pyinstaller: .venv/Scripts/pyinstaller.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # Vulkan SDK is needed at build time so the rebuild step below can
      # link llama.cpp against libvulkan with GGML_VULKAN=ON. macOS uses
      # Metal which ships with the system; Vulkan is for Linux/Windows
      # exes that bundle GPU-accelerated llama.cpp in the frozen binary.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libvulkan1 glslc

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Install dependencies
        run: |
          uv sync && uv pip install pyinstaller
          # python-multipart ships a multipart/ shim that shadows the real
          # multipart.py in PyInstaller builds. Remove it so litestar gets
          # the real module. We invoke pyinstaller via matrix.pyinstaller
          # (not `uv run`) so uv doesn't re-install it.
          uv pip uninstall python-multipart

      # The lockfile pulls a stock CPU-only llama-cpp-python from PyPI
      # (or whatever pip resolves), with no GPU acceleration. Rebuild it
      # in-place with the GPU flags so the frozen exe ships an accelerated
      # binary. Per-OS flags match build-wheels.yml exactly.
      - name: Rebuild llama-cpp-python with GPU acceleration (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF -DGGML_VULKAN=ON"
        run: uv pip install --reinstall --no-binary=llama-cpp-python --no-deps "llama-cpp-python==0.3.20"

      - name: Rebuild llama-cpp-python with GPU acceleration (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_BLAS=OFF"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: uv pip install --reinstall --no-binary=llama-cpp-python --no-deps "llama-cpp-python==0.3.20"

      - name: Rebuild llama-cpp-python with GPU acceleration (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=ON -DGGML_BLAS=OFF"
        run: uv pip install --reinstall --no-binary=llama-cpp-python --no-deps "llama-cpp-python==0.3.20"

      - name: Build executable
        run: >
          ${{ matrix.pyinstaller }}
          --onefile
          --name ${{ matrix.asset_name }}
          --copy-metadata lilbee
          --collect-data lilbee
          --collect-all lancedb
          --collect-all tree_sitter_language_pack
          --collect-all tiktoken_ext
          --collect-all pypdfium2
          --collect-all llama_cpp
          src/lilbee/__main__.py

      - name: Smoke test
        # Prove the frozen binary actually works, not just that it starts.
        # --version must match pyproject.toml; --help must succeed;
        # the server must come up and /api/health must report the same
        # version. This catches PyInstaller bundling regressions (missing
        # data files like featured_models.toml, shadowed modules like
        # python-multipart) that a bare --version would miss.
        run: |
          set -euxo pipefail
          EXE="./dist/${{ matrix.asset_name }}"
          EXPECTED=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")

          # --version matches pyproject.toml. Capture stderr too: a flood
          # of "No such option: -B" means the frozen binary is looping on
          # multiprocessing.resource_tracker spawn (sys.executable re-enters
          # typer). stdout can still carry the right version while the
          # process is actually broken, so stdout-only checks give false
          # green. Same for --help.
          STDERR=$(mktemp)
          ACTUAL=$("$EXE" --version 2>"$STDERR")
          echo "Expected: lilbee ${EXPECTED}"
          echo "Actual:   ${ACTUAL}"
          echo "Stderr:"
          cat "$STDERR"
          test "${ACTUAL}" = "lilbee ${EXPECTED}"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --version produced typer/runtime errors on stderr"
            exit 1
          fi

          # --help must be clean on stderr too.
          "$EXE" --help > /dev/null 2>"$STDERR"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --help produced typer/runtime errors on stderr"
            cat "$STDERR"
            exit 1
          fi

          # Server starts, /api/health reports matching version.
          # Capture server stderr to a log so we can scan it for the same
          # subprocess-spawn failure pattern.
          export LILBEE_DATA="${{ runner.temp }}/lilbee-smoke"
          mkdir -p "$LILBEE_DATA"
          SERVER_LOG=$(mktemp)
          "$EXE" serve --port 9123 >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; echo "=== server log ==="; cat "$SERVER_LOG" || true' EXIT

          for i in $(seq 1 30); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "server process died"
              cat "$SERVER_LOG"
              exit 1
            fi
            if curl -sf http://127.0.0.1:9123/api/health > /dev/null 2>&1; then
              echo "server responded on attempt $i"
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "server never responded after 30s"
              cat "$SERVER_LOG"
              exit 1
            fi
          done

          HEALTH=$(curl -sf http://127.0.0.1:9123/api/health)
          echo "Health payload: ${HEALTH}"
          SERVER_VERSION=$(python -c "import json, sys; print(json.loads(sys.argv[1])['version'])" "${HEALTH}")
          test "${SERVER_VERSION}" = "${EXPECTED}"

          if grep -qE "No such option|Type not yet supported" "$SERVER_LOG"; then
            echo "FAIL: server log contains subprocess/typer errors"
            exit 1
          fi

          # END-TO-END INFERENCE: the self-check command downloads SmolLM2
          # 135M (~90MB) and runs a tiny completion through the vendored
          # llama.cpp bundled in the exe. This catches the missing-shared-
          # library class of failures ("Shared library with base name 'llama'
          # not found") that the previous smoke couldn't see because it
          # never loaded a model. Passing proves llama_cpp + ggml .so/.dylib/
          # .dll got bundled into the frozen binary AND that inference runs
          # on this OS.
          SELF_CHECK_LOG=$(mktemp)
          SELF_CHECK_RC=0
          "$EXE" --json self-check > "$SELF_CHECK_LOG" 2>&1 || SELF_CHECK_RC=$?
          echo "=== self-check output (exit=${SELF_CHECK_RC}) ==="
          cat "$SELF_CHECK_LOG"
          if [ "${SELF_CHECK_RC}" != "0" ]; then
            echo "FAIL: self-check exited ${SELF_CHECK_RC}"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          # tolerate log noise before the JSON payload; the last non-empty
          # line is the self-check JSON line.
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'self-check failed: {data}'
          assert data.get('chat_response','').strip(), f'empty chat response: {data}'
          dims = data.get('embedding_dims')
          assert isinstance(dims, int) and dims > 0, f'missing embedding_dims: {data}'
          print(f'self-check chat={data[\"chat_response\"]!r} embedding_dims={dims}')
          " "$SELF_CHECK_LOG"

          echo "SMOKE TEST PASSED: --version, --help, server, /api/health, self-check inference all green"
        shell: bash

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
