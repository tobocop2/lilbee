name: Release Executables

# Builds the standalone executables and uploads them as run artifacts. It never
# attaches anything to a release -- callers (release-candidate.yml, publish.yml,
# emergency-publish.yml) collect the artifacts and decide.
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Build the executables even if the test job fails (re-run past a known-flaky test)."
        type: boolean
        default: false
      only_asset:
        description: "Build only the cell for this asset, e.g. lilbee-windows-x86_64.exe (empty = every cell)."
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the calling workflow's ref)."
        type: string
        default: ""
      skip_tests:
        description: "Build the executables even if the test job fails (re-run past a known-flaky test)."
        type: boolean
        default: false
      release_tag:
        description: "GH release tag to eagerly attach each built executable to (empty = artifacts only)."
        type: string
        default: ""
      only_asset:
        description: "Build only the cell for this asset, e.g. lilbee-linux-x86_64 (empty = every cell). A narrowed run is a check: it skips lint and test and publishes nothing."
        type: string
        default: ""

permissions:
  contents: write  # eager release_tag attach; otherwise read-only behavior is unchanged
  actions: read   # gate job: look up the CI workflow's conclusion for this commit

jobs:
  # Skip the lint + test re-run if CI already linted and tested this exact
  # commit. Fail-soft: any uncertainty -> run them.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ci_passed: ${{ steps.check.outputs.ci_passed }}
    steps:
      - uses: actions/checkout@v7
      - name: Did CI already pass on this commit?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: bash scripts/release_ci_passed.sh "${GITHUB_REPOSITORY}" "${REF}" >> "$GITHUB_OUTPUT"

  # Reads the build cells from .github/release-cells.yml. A caller that sets
  # only_asset gets that one cell, which is how a pull request builds a single
  # executable without copying this job.
  plan:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Select the build cells
        id: plan
        env:
          ONLY_ASSET: ${{ inputs.only_asset }}
        run: echo "cells=$(bash scripts/release_plan_cells.sh "${ONLY_ASSET}")" >> "$GITHUB_OUTPUT"

  lint:
    needs: [gate]
    if: needs.gate.outputs.ci_passed != 'true' && inputs.only_asset == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync
      - run: make lint
      - run: make format-check
      - run: make typecheck

  test:
    needs: [gate]
    if: needs.gate.outputs.ci_passed != 'true' && inputs.only_asset == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync
      - run: make test-ci
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee

  build:
    needs: [gate, plan, lint, test]
    # Build if CI already passed on this commit (lint/test skipped), or lint+test
    # pass here, or skip_tests was set after eyeballing a flaky failure. lint
    # always gates -- a real lint failure isn't bypassable. always() so the if:
    # runs even when lint/test were skipped or test failed.
    if: |
      always()
      && needs.gate.result == 'success'
      && needs.plan.result == 'success'
      && needs.lint.result != 'failure' && needs.lint.result != 'cancelled'
      && (needs.gate.outputs.ci_passed == 'true' || needs.test.result == 'success' || inputs.skip_tests || inputs.only_asset != '')
    # Windows Nuitka has no ccache and was hitting 180m; 300m gives it room.
    timeout-minutes: 300
    # Only soft cells (the pre-Haswell compat builds) may fail without failing the
    # release; every default binary stays hard-required. `soft` is the one
    # definition of that, set in .github/release-cells.yml and read by
    # scripts/release_required_assets.sh, so a cell cannot be droppable for one
    # gate and required by another.
    continue-on-error: ${{ matrix.soft == true }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Compute version
        # NUITKA_VERSION: int-tuple form Nuitka --product-version accepts.
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          NUITKA_VERSION=$(echo "$VERSION" | tr -cs '0-9' ' ' | awk '{ printf "%s.%s.%s.%s", $1, $2, $3, $4 }')
          echo "LILBEE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LILBEE_NUITKA_VERSION=$NUITKA_VERSION" >> "$GITHUB_ENV"

      # manylinux_2_34 (AlmaLinux 9) is dnf-based; install Vulkan SDK from LunarG.
      - name: Install Vulkan SDK (manylinux container)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euxo pipefail
          dnf install -y libxkbcommon-devel libX11-devel libXrandr-devel libXcursor-devel libXi-devel libXinerama-devel mesa-libGL-devel
          # Pinned in engine-versions.env so the SDK cannot drift from the
          # one install_gpu_toolkit.sh uses.
          source engine-versions.env
          VULKAN_VERSION="${ENGINE_VULKAN_SDK_VERSION:?}"
          curl -L -o /tmp/vulkan-sdk.tar.xz \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          mkdir -p /opt/vulkan
          tar -xf /tmp/vulkan-sdk.tar.xz -C /opt/vulkan --strip-components=1
          {
            echo "VULKAN_SDK=/opt/vulkan/x86_64"
            echo "LD_LIBRARY_PATH=/opt/vulkan/x86_64/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          echo "/opt/vulkan/x86_64/bin" >> "$GITHUB_PATH"

      # GPU build SDK on macOS/Windows; Linux uses the LunarG step above.
      - name: Install GPU build toolkit
        if: matrix.container == '' && matrix.backend != 'metal'
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Set up ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1
        with:
          # The compat cell compiles at -march=x86-64-v2; without it in the key it
          # shares an entry with the stock cell and each poisons the other.
          key: nuitka-${{ matrix.os }}-${{ matrix.backend }}${{ matrix.march && format('-{0}', matrix.march) || '' }}
          max-size: '2G'
          # Tag-scoped cache saves are unrestorable by future runs; don't evict useful ones.
          # warm-executables-cache.yml runs this workflow on main so these saves happen.
          save: ${{ github.ref_type != 'tag' }}

      # ccache-action only writes a config file, and Nuitka overrides that with its
      # own CCACHE_DIR unless one is already exported (nuitka/build/SconsCaching.py),
      # so none of its C objects ever reached the cached directory. Env beats config.
      - name: Point ccache at the cached directory
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_ENV"

      # Windows has no ccache; Nuitka's own cache (MSVC object caching plus its
      # dependency-analysis caches) is what cuts the ~4h cold compile. Restored
      # from main-saved caches (warm-executables-cache.yml) -- tag-scoped saves
      # are unrestorable, same story as ccache above.
      # One namespace per Windows runner image, not per backend or asset. Every
      # Windows cell compiles the same C: MSVC takes no baseline override here, the
      # CUDA difference is bundled DLLs, and the compat difference is a lancedb
      # .pyd. Splitting them gave four ~1-3 GB object caches that evicted each
      # other out of the 10 GiB cap every run, which is why clcache never once hit.
      # Sharing is safe by construction: clcache keys each entry on the
      # preprocessed source plus flags, so a mismatched entry misses, never lies.
      # The asset name stays in the primary key only so concurrent cells do not
      # save the same key; restore-keys is what shares them.
      # The mirror is readable from a tag ref, unlike the Actions cache, so a
      # release starts warm from whatever the last build contributed, and can
      # contribute its own compile back.
      # The key hashes the lock without lilbee's own version line, so it moves
      # when a dependency moves and stays put across a release bump.
      # The mirror key names the cell, unlike the Actions-cache namespace above.
      # The mirror holds release assets, not cache entries, so the 10 GiB cap
      # that made per-cell Actions caches evict each other does not apply here,
      # and the first publish for a key wins: with one key per runner image the
      # stock cell always wins and the slow compat cell -- the one that timed
      # out -- never owns an entry of its own.
      - name: Normalize the lock the object-cache key hashes
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/strip_own_version.sh uv.lock uv-deps.lock

      - name: Restore the Nuitka cache from the mirror
        id: nuitka-mirror
        if: runner.os == 'Windows'
        uses: ./.github/actions/nuitka-object-cache
        with:
          phase: restore
          key: nuitka-objects-${{ matrix.os }}-${{ matrix.asset_name }}-${{ hashFiles('uv-deps.lock') }}

      - name: Restore Nuitka cache (Windows)
        if: runner.os == 'Windows' && steps.nuitka-mirror.outputs.restored != 'true'
        uses: actions/cache/restore@v6
        with:
          path: nuitka-cache
          key: nuitka-${{ matrix.os }}-${{ matrix.asset_name }}-${{ github.run_id }}
          restore-keys: nuitka-${{ matrix.os }}-

      - name: Point Nuitka at the cache dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "NUITKA_CACHE_DIR=${GITHUB_WORKSPACE}/nuitka-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: matrix.os != 'macos-15-intel'
        run: uv sync --extra release && uv pip install 'nuitka[onefile]==4.3.1' pip

      # Intel Mac: `uv sync` can't run here -- stock lancedb 0.39.0 ships no
      # macosx_x86_64 wheel. One install resolves the whole cell: lancedb comes
      # from the +compat index (PEP 440 drop-in) and every other package is held
      # to uv.lock through a constraints file that `uv export` writes from the
      # lock, so this cell installs what every other cell installs. Resolving
      # lancedb in a step of its own leaves its closure (numpy, pyarrow,
      # pydantic, tqdm and five more) free to install at whatever PyPI serves
      # that day, which is the drift the constraints exist to stop.
      #
      # lancedb is the one package left out of the constraints, because the
      # locked version is the one with no wheel here. nuitka and pip are build
      # tools, unpinned on every cell. lilbee-engine leaves the export as well,
      # for a different reason: it is a local path, and uv rejects an unnamed
      # requirement as a constraint.
      #
      # --python-platform resolves wheels for the x86_64 target instead of the
      # runner. Without it uv picks the newest wheel the macOS 15 image accepts
      # (numpy/scipy macosx_14_0) and bundles a binary that dies on macOS 12-13,
      # even though both ship older-built wheels that run just as well here.
      - name: Install dependencies (Intel Mac)
        if: matrix.os == 'macos-15-intel'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_floor }}
        run: |
          set -euxo pipefail
          uv venv
          uv export --frozen --extra release --no-hashes \
            --no-emit-project --no-emit-package lilbee-engine \
            --no-emit-package lancedb \
            --format requirements-txt -o intel-constraints.txt
          uv pip install --python-platform x86_64-apple-darwin \
            --constraint intel-constraints.txt \
            --extra-index-url https://lilbee.sh/compat/ \
            lancedb==0.39.0+compat '.[release]' 'nuitka[onefile]==4.3.1' pip

      - name: Verify extras installed in build venv
        shell: bash
        # --no-sync is load-bearing: re-syncing reinstalls python-multipart and shadows the shim.
        run: uv run --no-sync python -c "import crawlberg, ada_url, litellm, spacy, graspologic_native; print('extras OK')"

      # compat cell only: swap the synced stock lancedb for the pre-Haswell build.
      # --no-deps leaves the rest of the venv intact, so nothing leaves this cell.
      # Pinned to the latest stable lancedb for Python (0.39), served by the fork as
      # +compat; lilbee's own stock pin can lag. Bump when the fork moves.
      - name: Swap in the pre-Haswell lancedb
        if: matrix.compat
        shell: bash
        run: |
          uv pip install --reinstall --no-deps \
            --extra-index-url https://lilbee.sh/compat/ \
            lancedb==0.39.0+compat

      # Build the self-contained llama-server (binary + ggml/llama/mtmd libs with a
      # baked rpath) and install lilbee_engine so Nuitka bundles the whole
      # engine into this executable.
      - name: Bundle llama-server
        uses: ./.github/actions/bundle-llama-server
        with:
          backend: ${{ matrix.backend }}
          # Containerized cells build against the container's glibc; keep their
          # engine cache separate from bare-runner builds.
          cache-env: ${{ matrix.container || matrix.os }}
          # A narrowed run is a check. An empty tag makes the action skip the
          # engine mirror, so the run cannot create or write the release.
          asset-release-tag: ${{ inputs.only_asset == '' && 'engine-binaries' || '' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_floor }}

      # Nuitka bundles these dylibs, and dyld enforces each one's minos separately
      # from the launcher's, so one dep built on a newer runner silently ships a
      # binary that dies at load. Fail here rather than on the user's Mac. Runs
      # after the engine bundle and the compat lancedb swap so the engine's
      # dlopen'd modules and the swapped wheel are scanned too, including engines
      # restored from cache or mirror.
      - name: Verify macOS floor
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_floor }}
        run: bash tools/wheel-build/check_macos_floor.sh

      - name: Build executable
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          PRODUCT_VERSION: ${{ env.LILBEE_NUITKA_VERSION }}
          # Pin Nuitka's clang output to this asset's floor. Unset, clang defaults the
          # deployment target to the build host (macOS 15), which would stamp the
          # launcher minos=15 and refuse to launch below it. This only pins the
          # launcher; the bundled dylibs carry their own minos, which is what the
          # "Verify macOS floor" step above checks. No-op off macOS.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_floor }}
          # compat cell only: hold Nuitka's C output to the pre-Haswell baseline so
          # the launcher layer (not just lancedb) runs on old silicon. Empty elsewhere.
          CFLAGS: ${{ matrix.march && format('-march={0}', matrix.march) || '' }}
          CXXFLAGS: ${{ matrix.march && format('-march={0}', matrix.march) || '' }}
        run: bash tools/wheel-build/build_lilbee_binary.sh

      # Save even when the build's smoke test later fails -- the objects are
      # still valid and make the retry fast. Non-tag only, like ccache.
      - name: Save Nuitka cache (Windows)
        if: runner.os == 'Windows' && github.ref_type != 'tag'
        uses: actions/cache/save@v6
        with:
          path: nuitka-cache
          key: nuitka-${{ matrix.os }}-${{ matrix.asset_name }}-${{ github.run_id }}

      # Any ref, including tags. See the action for why this cannot be an
      # actions/cache save.
      # success() is explicit rather than load-bearing: steps already carry an
      # implicit success(), so a failed compile would not reach this anyway. It
      # is spelled out because first-publish-wins makes a partial cache permanent
      # for the key, and that guarantee should not rest on an implicit default.
      #
      # continue-on-error because this is a pure optimisation sitting between a
      # finished compile and the artifact upload. ci_mirror.sh soft-fails on its
      # own errors, but mktemp and wc run under set -euo pipefail and can still
      # hard-exit; on a soft cell that would go green with the asset missing.
      - name: Publish the Nuitka cache to the mirror
        if: success() && runner.os == 'Windows' && steps.nuitka-mirror.outputs.restored != 'true' && inputs.only_asset == ''
        continue-on-error: true
        uses: ./.github/actions/nuitka-object-cache
        with:
          phase: publish
          key: nuitka-objects-${{ matrix.os }}-${{ matrix.asset_name }}-${{ hashFiles('uv-deps.lock') }}
          token: ${{ github.token }}


      # The manylinux container ships no gh CLI; the model-mirror restore below
      # and the release attach at the end both need it.
      - name: Install gh CLI in the build container
        if: matrix.container != ''
        shell: bash
        run: |
          if command -v gh >/dev/null 2>&1; then exit 0; fi
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh
          gh --version

      # The onefile build leaves multi-GB intermediates beside the final binary,
      # and a runner has died of a full disk while restoring the smoke models
      # after a SUCCESSFUL build. Drop them before the models come down; runs
      # after the Windows Nuitka cache save so nothing cache-worthy is lost.
      # ccache stays: its post-job hook still has to save it.
      - name: Reclaim build-intermediate disk before the smoke models
        shell: bash
        run: |
          df -h . 2>/dev/null || true
          rm -rf dist/*.build dist/*.dist dist/*.onefile-build nuitka-cache
          df -h . 2>/dev/null || true

      - name: Restore CI models (inference smoke)
        uses: ./.github/actions/restore-ci-models

      - name: Smoke test
        id: smoke
        # End-to-end: --version, --help, server boot, /api/health version match,
        # then the core-functionality sweep (engine inference, ingest, search,
        # ask, crawl) via tools/qa/artifact_smoke.sh.
        run: |
          set -euxo pipefail
          EXE="./dist/${{ matrix.asset_name }}"
          EXPECTED=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)

          bash scripts/assert_launcher_boots.sh "$EXPECTED" "$EXE"

          # Frozen multiprocessing reinvocations must be intercepted before typer.
          # Two real reinvocation shapes the running binary spawns into itself:
          #   1. the splash subprocess: [exe, -m, lilbee.runtime._splash_runner, <fd>]
          #   2. the resource tracker:  [exe, -c, "from multiprocessing... main(<fd>)"]
          # Nuitka never sets sys.frozen, so a build that mis-detects frozen state
          # leaks these into typer ("No such command '<fd>'", "No such option: -c"),
          # which is what users see on TUI exit. Drive both shapes directly; fd 999
          # is unopened so the splash runner sees a dead pipe and exits immediately.
          MP=$(mktemp)
          "$EXE" -m lilbee.runtime._splash_runner 999 > "$MP" 2>&1 || true
          if grep -qE "No such command|No such option" "$MP"; then
            echo "FAIL: splash -m reinvocation leaked into typer (frozen detection broken)"
            cat "$MP"
            exit 1
          fi
          # The runner ships only via --include-module; catch a missing module here too.
          if grep -qE "No module named|ModuleNotFoundError" "$MP"; then
            echo "FAIL: splash runner module is not bundled in the frozen binary"
            cat "$MP"
            exit 1
          fi

          #   2. the GPU probe subprocess: [exe, -m, lilbee.providers.fleet.vulkan_probe]
          # Exit 2 means "loader has no opinion", which is a correct answer on a
          # runner with no Vulkan ICD. A missing module is not.
          VP=$(mktemp)
          "$EXE" -m lilbee.providers.fleet.vulkan_probe > "$VP" 2>&1 || true
          if grep -qE "No such command|No such option" "$VP"; then
            echo "FAIL: vulkan probe -m reinvocation leaked into typer"
            cat "$VP"
            exit 1
          fi
          if grep -qE "No module named|ModuleNotFoundError" "$VP"; then
            echo "FAIL: vulkan probe module is not bundled in the frozen binary"
            cat "$VP"
            exit 1
          fi
          # Any traceback means the dispatch crashed running the module. runpy.run_module
          # raised AttributeError ("nuitka_module_loader has no attribute 'get_code'") in
          # the onefile binary; fd 999 is dead, so the runner must exit silently.
          if grep -qE "Traceback|Error:|get_code" "$MP"; then
            echo "FAIL: splash -m reinvocation raised an exception in the frozen binary"
            cat "$MP"
            exit 1
          fi
          "$EXE" -c "import multiprocessing" > "$MP" 2>&1 || true
          if grep -qE "No such command|No such option" "$MP"; then
            echo "FAIL: resource-tracker -c reinvocation leaked into typer (frozen detection broken)"
            cat "$MP"
            exit 1
          fi
          if grep -qE "Traceback|Error:|get_code" "$MP"; then
            echo "FAIL: resource-tracker -c reinvocation raised an exception in the frozen binary"
            cat "$MP"
            exit 1
          fi

          # The download-size estimate reads ggml's block sizes from gguf.constants,
          # imported inside a function so no CLI invocation pays numpy + yaml. Nuitka
          # follows a function-local import, but the size a user sees before a pull
          # depends on it, so prove the frozen binary really resolves it. The payload
          # names multiprocessing because the frozen child dispatch requires that
          # before it execs a -c payload at all.
          QS=$(mktemp)
          "$EXE" -c "import multiprocessing; from lilbee.catalog.refs import ggml_bytes_per_param; print(ggml_bytes_per_param('Q4_K'))" > "$QS" 2>&1 || true
          if grep -qE "No module named|ModuleNotFoundError|Traceback" "$QS"; then
            echo "FAIL: the ggml quant table is not reachable in the frozen binary"
            cat "$QS"
            exit 1
          fi
          # Q4_K packs a 256-weight block into 144 bytes.
          if ! grep -q "0.5625" "$QS"; then
            echo "FAIL: the frozen binary prices Q4_K wrong"
            cat "$QS"
            exit 1
          fi

          # Boot server, scan stderr for the spawn-loop pattern, verify /api/health version.
          export LILBEE_DATA="${{ runner.temp }}/lilbee-smoke"
          mkdir -p "$LILBEE_DATA"
          SERVER_LOG=$(mktemp)
          "$EXE" serve --port 9123 >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; echo "=== server log ==="; cat "$SERVER_LOG" || true' EXIT

          # /api/health needs the session token like every other route, so read
          # the token the server persists on boot and authenticate each probe.
          TOKEN=""
          for i in $(seq 1 30); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "server process died"
              cat "$SERVER_LOG"
              exit 1
            fi
            if [ -z "$TOKEN" ]; then
              SERVER_JSON=$(find "$LILBEE_DATA" -name server.json 2>/dev/null | head -1 || true)
              if [ -n "$SERVER_JSON" ]; then
                TOKEN=$(uv run --no-sync python -c "import json, sys; print(json.load(open(sys.argv[1]))['token'])" "$SERVER_JSON" 2>/dev/null || true)
              fi
            fi
            if [ -n "$TOKEN" ] && curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:9123/api/health > /dev/null 2>&1; then
              echo "server responded on attempt $i"
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "server never responded after 30s"
              cat "$SERVER_LOG"
              exit 1
            fi
          done

          HEALTH=$(curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:9123/api/health)
          echo "Health payload: ${HEALTH}"
          SERVER_VERSION=$(uv run --no-sync python -c "import json, sys; print(json.loads(sys.argv[1])['version'])" "${HEALTH}")
          test "${SERVER_VERSION}" = "${EXPECTED}"

          if grep -qE "No such option|Type not yet supported" "$SERVER_LOG"; then
            echo "FAIL: server log contains subprocess/typer errors"
            exit 1
          fi

          echo "SMOKE TEST PASSED: --version, --help, server, /api/health all green"

          # Core-functionality sweep: real engine inference (chat + embedding),
          # ingest, search, RAG ask, and an http-mode crawl. This is what keeps
          # a binary whose bundled engine cannot start from ever attaching.
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          trap - EXIT
          LILBEE_EXE="$EXE" bash tools/qa/artifact_smoke.sh
        shell: bash

      # A binary that fails its smoke test dies with the runner, so the failure
      # cannot be reproduced anywhere. Keep it as a run artifact on that failure
      # only. The name must not match attach-release-artifacts' `lilbee-*`
      # pattern, so a failed binary can never reach a release.
      - name: Upload the failed binary for local debugging
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          compression-level: 0
          retention-days: 7

      - name: Upload binary as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          # The onefile payload is already zstd-compressed; deflating it again buys nothing.
          compression-level: 0


      # Eager attach: release-candidate creates the pre-release shell before
      # calling, so the asset shows up as soon as this cell finishes.
      - name: Attach binary to the GH pre-release
        if: inputs.release_tag != '' && inputs.only_asset == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO is load-bearing: without it gh resolves the repo from the
          # git remote, and inside the root-run manylinux container git refuses
          # the runner-owned checkout ("detected dubious ownership"), so the
          # Linux upload fails. Passing the repo explicitly skips git entirely.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" "dist/${{ matrix.asset_name }}" --clobber
