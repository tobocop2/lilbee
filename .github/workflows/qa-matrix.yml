name: QA matrix

# Runs the QA matrix against the published PyInstaller binary across the
# native runners (ubuntu, macos, windows) and a curated set of Linux distros
# (arch, fedora) that exercise the glibc / library-layout / package-manager
# differences our Ubuntu runner doesn't.
#
# Triggers on push to the qa-matrix branch so the foundation PR can demonstrate
# the matrix in action; the production trigger (tag-driven release pipeline)
# arrives in a follow-up PR.

on:
  push:
    branches: [qa-matrix]
    paths:
      - 'tools/qa/**'
      - '.github/workflows/qa-matrix.yml'
  workflow_dispatch:
    inputs:
      lilbee_version:
        description: "GH release tag to pull binaries from (e.g. v0.6.66b455)"
        required: false
        default: "latest"

permissions:
  contents: read

concurrency:
  group: qa-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: ubuntu,  asset: lilbee-linux-x86_64,        chmod: true  }
          - { os: macos-latest,   label: macos,   asset: lilbee-macos-arm64,         chmod: true  }
          - { os: windows-latest, label: windows, asset: lilbee-windows-x86_64.exe,  chmod: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install QA harness deps
        run: python -m pip install -r tools/qa/requirements.txt

      - name: Download lilbee binary from GH release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.lilbee_version || 'latest' }}
        shell: bash
        run: |
          mkdir -p _bin
          if [ "$TAG" = "latest" ]; then
            gh release download --repo ${{ github.repository }} --pattern "${{ matrix.asset }}" --dir _bin
          else
            gh release download "$TAG" --repo ${{ github.repository }} --pattern "${{ matrix.asset }}" --dir _bin
          fi
          ls -la _bin

      - name: Make binary executable (POSIX)
        if: matrix.chmod
        run: chmod +x "_bin/${{ matrix.asset }}"

      - name: Run QA matrix
        env:
          LILBEE_QA_LANE: l2-binary
          LILBEE_QA_BIN: ${{ github.workspace }}/_bin/${{ matrix.asset }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          python -m pytest tools/qa/ -v --tb=short \
            --junitxml=qa-${{ matrix.label }}.xml

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.label }}
          path: |
            qa-*.xml
            _bin/
            tools/qa/.pytest_cache/
          retention-days: 7

  # Linux distros that ship a different glibc / fontconfig / lib layout than
  # ubuntu-latest. Same lilbee-linux-x86_64 binary; the runtime is the variable.
  linux-distros:
    name: linux-distros (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: arch,    container: archlinux:latest, install: arch    }
          - { label: fedora,  container: fedora:latest,    install: fedora  }
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 20
    steps:
      - name: Install Arch base toolchain
        if: matrix.install == 'arch'
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed python python-pip git github-cli ca-certificates

      - name: Install Fedora base toolchain
        if: matrix.install == 'fedora'
        run: |
          dnf -y update
          dnf -y install python3 python3-pip git gh ca-certificates

      - uses: actions/checkout@v6

      - name: Install QA harness deps
        run: python3 -m pip install --break-system-packages -r tools/qa/requirements.txt

      - name: Download lilbee binary from GH release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.lilbee_version || 'latest' }}
        run: |
          mkdir -p _bin
          if [ "$TAG" = "latest" ]; then
            gh release download --repo ${{ github.repository }} --pattern "lilbee-linux-x86_64" --dir _bin
          else
            gh release download "$TAG" --repo ${{ github.repository }} --pattern "lilbee-linux-x86_64" --dir _bin
          fi
          chmod +x _bin/lilbee-linux-x86_64
          ls -la _bin

      - name: Run QA matrix
        env:
          LILBEE_QA_LANE: l2-binary
          LILBEE_QA_BIN: ${{ github.workspace }}/_bin/lilbee-linux-x86_64
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -m pytest tools/qa/ -v --tb=short --junitxml=qa-${{ matrix.label }}.xml

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.label }}
          path: |
            qa-*.xml
            _bin/
            tools/qa/.pytest_cache/
          retention-days: 7
