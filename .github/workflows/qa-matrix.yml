name: QA matrix

# Runs the QA matrix against the published lilbee artifact in two lanes:
#
#   pypi   - `pip install lilbee==<v>` from PyPI; same path real users take
#   binary - download lilbee-<os>-<arch> from the GH release; the standalone
#            executable for users who don't want a Python install
#
# Across the native runners (ubuntu, macos, windows) and a curated set of
# Linux distros (arch, fedora) that exercise the glibc / library-layout /
# package-manager differences our Ubuntu runner doesn't.
#
# Triggers on push to the qa-matrix branch so the foundation PR can demonstrate
# the matrix in action; the production trigger (tag-driven release pipeline)
# arrives in a follow-up PR.

on:
  push:
    branches: [qa-matrix]
    paths:
      - 'tools/qa/**'
      - '.github/workflows/qa-matrix.yml'
  workflow_dispatch:
    inputs:
      lilbee_version:
        description: "lilbee version to QA (defaults to latest published)"
        required: false
        default: "latest"
  # Reusable trigger for release-candidate.yml / emergency-publish.yml.
  # When wheel_run_id / binary_run_id are set, the matrix consumes those
  # workflow artifacts directly instead of fetching from PyPI / GH release.
  workflow_call:
    inputs:
      wheel_run_id:
        description: "Workflow run ID containing wheel-default-* artifacts (RC lane)."
        type: string
        default: ""
      binary_run_id:
        description: "Workflow run ID containing lilbee-<os>-<arch> artifacts (RC lane)."
        type: string
        default: ""
      version:
        description: "lilbee version string for the artifacts (e.g. 0.6.66b458)."
        type: string
        default: ""

permissions:
  contents: read
  actions: read   # download-artifact with run-id (workflow_call RC mode)

concurrency:
  group: qa-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.label }}, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: ubuntu,  lane: pypi   }
          - { os: macos-latest,   label: macos,   lane: pypi   }
          - { os: windows-latest, label: windows, lane: pypi   }
          - { os: ubuntu-latest,  label: ubuntu,  lane: binary, asset: lilbee-linux-x86_64,        chmod: true  }
          - { os: macos-latest,   label: macos,   lane: binary, asset: lilbee-macos-arm64,         chmod: true  }
          - { os: windows-latest, label: windows, lane: binary, asset: lilbee-windows-x86_64.exe,  chmod: false }
    runs-on: ${{ matrix.os }}
    # 90-min cap covers Windows binary cold-starts cumulated across ~95 subprocess invocations.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install QA harness deps
        run: python -m pip install --root-user-action=ignore -r tools/qa/requirements.txt

      - name: Resolve target lilbee version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.lilbee_version || 'latest' }}
          RC_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [ -n "${RC_VERSION}" ]; then
            RESOLVED_TAG="v${RC_VERSION}"
            RESOLVED_VERSION="${RC_VERSION}"
          else
            if [ "$TAG" = "latest" ]; then
              TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
            fi
            RESOLVED_TAG="$TAG"
            # Strip leading 'v' for PyPI version
            RESOLVED_VERSION="${TAG#v}"
          fi
          {
            echo "tag=${RESOLVED_TAG}"
            echo "version=${RESOLVED_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore QA models cache
        id: models-cache
        uses: actions/cache@v4
        with:
          path: ~/.lilbee-qa-models
          key: lilbee-qa-models-v2-qwen3-0.6b-nomic-embed-v1.5-bge-rerank-v2-m3

      - name: Download wheel artifacts from sibling run (lane=pypi, RC mode)
        if: matrix.lane == 'pypi' && inputs.wheel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-default-*
          path: ./_wheels
          run-id: ${{ inputs.wheel_run_id }}
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Install lilbee from local wheels (lane=pypi, RC mode)
        if: matrix.lane == 'pypi' && inputs.wheel_run_id != ''
        shell: bash
        # --find-links lets pip pick the OS/arch/Python-matching wheel from
        # the directory; transitive deps still resolve via the default index.
        # --pre matches today's PyPI install behavior for beta versions.
        run: |
          python -m pip install --find-links ./_wheels --pre "lilbee==${{ steps.ver.outputs.version }}"
          echo "LILBEE_QA_BIN=$(command -v lilbee)" >> "$GITHUB_ENV"
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cp tools/qa/scripts/sitecustomize_loopback.py "${SITE_PACKAGES}/sitecustomize.py"

      - name: Install lilbee from PyPI (lane=pypi)
        if: matrix.lane == 'pypi' && inputs.wheel_run_id == ''
        shell: bash
        # Plain `lilbee` without extras; [crawler] / [litellm] live in the dedicated cells.
        run: |
          python -m pip install "lilbee==${{ steps.ver.outputs.version }}"
          echo "LILBEE_QA_BIN=$(command -v lilbee)" >> "$GITHUB_ENV"
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cp tools/qa/scripts/sitecustomize_loopback.py "${SITE_PACKAGES}/sitecustomize.py"

      - name: Download lilbee binary from sibling run (lane=binary, RC mode)
        if: matrix.lane == 'binary' && inputs.binary_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ./_bin
          run-id: ${{ inputs.binary_run_id }}
          github-token: ${{ github.token }}

      - name: Make binary executable + set LILBEE_QA_BIN (lane=binary, RC mode)
        if: matrix.lane == 'binary' && inputs.binary_run_id != ''
        shell: bash
        run: |
          ls -la _bin
          if [ "${{ matrix.chmod }}" = "true" ]; then chmod +x "_bin/${{ matrix.asset }}"; fi
          echo "LILBEE_QA_BIN=${{ github.workspace }}/_bin/${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Download lilbee binary from GH release (lane=binary)
        if: matrix.lane == 'binary' && inputs.binary_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p _bin
          gh release download "${{ steps.ver.outputs.tag }}" --repo ${{ github.repository }} --pattern "${{ matrix.asset }}" --dir _bin
          ls -la _bin
          if [ "${{ matrix.chmod }}" = "true" ]; then chmod +x "_bin/${{ matrix.asset }}"; fi
          echo "LILBEE_QA_BIN=${{ github.workspace }}/_bin/${{ matrix.asset }}" >> "$GITHUB_ENV"

      - name: Install Ollama daemon + pull tiny model (Linux binary lane)
        # The release binary bundles litellm so the ollama-backed test
        # tier should run on Linux binary. ollama install is straightforward
        # on ubuntu-latest; macOS/Windows ollama setup is gnarlier so those
        # lanes still skip via 'daemon not reachable'. Tests are xfail-gated
        # on bb-m234 (segfault in the b455 binary's ollama path) so a
        # successful run (post-fix) becomes an xpass automatically.
        if: matrix.lane == 'binary' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=127.0.0.1:11434 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          ollama pull qwen3:0.6b
          {
            echo "LILBEE_QA_OLLAMA_HOST=127.0.0.1"
            echo "LILBEE_QA_OLLAMA_PORT=11434"
            echo "LILBEE_QA_OLLAMA_MODEL=qwen3:0.6b"
          } >> "$GITHUB_ENV"

      - name: Run QA matrix
        env:
          LILBEE_QA_LANE: ${{ matrix.lane == 'pypi' && 'l1-pypi' || 'l2-binary' }}
          LILBEE_QA_MODELS_DIR: ${{ github.workspace }}/.lilbee-qa-models
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          echo "Lane: $LILBEE_QA_LANE"
          echo "Binary: $LILBEE_QA_BIN"
          # Mirror the cached path into the workspace so per-test envs find it.
          mkdir -p "$LILBEE_QA_MODELS_DIR"
          if [ -d "$HOME/.lilbee-qa-models" ]; then
            cp -R "$HOME/.lilbee-qa-models/." "$LILBEE_QA_MODELS_DIR/" 2>/dev/null || true
          fi
          python -m pytest tools/qa/ -v --tb=short \
            --junitxml=qa-${{ matrix.label }}-${{ matrix.lane }}.xml
          # Persist any newly-pulled models back to the cache location.
          mkdir -p "$HOME/.lilbee-qa-models"
          cp -R "$LILBEE_QA_MODELS_DIR/." "$HOME/.lilbee-qa-models/" 2>/dev/null || true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.label }}-${{ matrix.lane }}
          path: |
            qa-*.xml
            _bin/
            tools/qa/.pytest_cache/
          retention-days: 7

  # Linux distros: same lanes, but the runtime is the distro container.
  # pypi lane on Arch / Fedora is the high-value one. That's where most
  # Linux users hit install failures; binary lane is the fallback path.
  linux-distros:
    name: linux-distros (${{ matrix.label }}, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: arch,    container: archlinux:latest, install: arch,   lane: pypi   }
          - { label: arch,    container: archlinux:latest, install: arch,   lane: binary }
          - { label: fedora,  container: fedora:latest,    install: fedora, lane: pypi   }
          - { label: fedora,  container: fedora:latest,    install: fedora, lane: binary }
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 60
    steps:
      - name: Install Arch base toolchain
        if: matrix.install == 'arch'
        # vulkan-icd-loader provides libvulkan.so.1, which the lilbee Linux
        # wheel hard-depends on at module-import time. Without it the runtime
        # fails with 'libvulkan.so.1: cannot open shared object file' on
        # every model load. Tracked separately as a lilbee bug; install it
        # here so the rest of the matrix can validate the surface that
        # users-with-vulkan see. Users hitting this without vulkan installed
        # is the bug the QA matrix exposed.
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed python python-pip git github-cli ca-certificates base-devel vulkan-icd-loader

      - name: Install Fedora base toolchain
        if: matrix.install == 'fedora'
        # vulkan-loader is the Fedora equivalent of vulkan-icd-loader; same
        # rationale (see Arch step above).
        run: |
          dnf -y update
          dnf -y install python3 python3-pip git gh ca-certificates gcc gcc-c++ make vulkan-loader

      - uses: actions/checkout@v6

      - name: Install QA harness deps
        run: python3 -m pip install --break-system-packages --root-user-action=ignore -r tools/qa/requirements.txt

      - name: Resolve target lilbee version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.lilbee_version || 'latest' }}
          RC_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${RC_VERSION}" ]; then
            RESOLVED_TAG="v${RC_VERSION}"
            RESOLVED_VERSION="${RC_VERSION}"
          else
            if [ "$TAG" = "latest" ]; then
              TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
            fi
            RESOLVED_TAG="$TAG"
            RESOLVED_VERSION="${TAG#v}"
          fi
          {
            echo "tag=${RESOLVED_TAG}"
            echo "version=${RESOLVED_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Download wheel artifacts from sibling run (lane=pypi, RC mode)
        if: matrix.lane == 'pypi' && inputs.wheel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-default-*
          path: ./_wheels
          run-id: ${{ inputs.wheel_run_id }}
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Install lilbee from local wheels (lane=pypi, RC mode)
        if: matrix.lane == 'pypi' && inputs.wheel_run_id != ''
        run: |
          python3 -m pip install --break-system-packages --root-user-action=ignore --find-links ./_wheels --pre "lilbee==${{ steps.ver.outputs.version }}"
          echo "LILBEE_QA_BIN=$(command -v lilbee)" >> "$GITHUB_ENV"

      - name: Install lilbee from PyPI (lane=pypi)
        if: matrix.lane == 'pypi' && inputs.wheel_run_id == ''
        run: |
          python3 -m pip install --break-system-packages --root-user-action=ignore "lilbee==${{ steps.ver.outputs.version }}"
          echo "LILBEE_QA_BIN=$(command -v lilbee)" >> "$GITHUB_ENV"

      - name: Download lilbee binary from sibling run (lane=binary, RC mode)
        if: matrix.lane == 'binary' && inputs.binary_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: lilbee-linux-x86_64
          path: ./_bin
          run-id: ${{ inputs.binary_run_id }}
          github-token: ${{ github.token }}

      - name: Make binary executable + set LILBEE_QA_BIN (lane=binary, RC mode)
        if: matrix.lane == 'binary' && inputs.binary_run_id != ''
        run: |
          chmod +x _bin/lilbee-linux-x86_64
          echo "LILBEE_QA_BIN=${{ github.workspace }}/_bin/lilbee-linux-x86_64" >> "$GITHUB_ENV"

      - name: Download lilbee binary from GH release (lane=binary)
        if: matrix.lane == 'binary' && inputs.binary_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _bin
          gh release download "${{ steps.ver.outputs.tag }}" --repo ${{ github.repository }} --pattern "lilbee-linux-x86_64" --dir _bin
          chmod +x _bin/lilbee-linux-x86_64
          echo "LILBEE_QA_BIN=${{ github.workspace }}/_bin/lilbee-linux-x86_64" >> "$GITHUB_ENV"

      - name: Install Ollama daemon + pull tiny model (binary lane)
        if: matrix.lane == 'binary'
        # Bundled binary ships with litellm; this lane should exercise the
        # ollama-backed tier. Tests are xfail-gated on bb-m234 (binary
        # segfault) so a successful run becomes an xpass.
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=127.0.0.1:11434 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          ollama pull qwen3:0.6b
          {
            echo "LILBEE_QA_OLLAMA_HOST=127.0.0.1"
            echo "LILBEE_QA_OLLAMA_PORT=11434"
            echo "LILBEE_QA_OLLAMA_MODEL=qwen3:0.6b"
          } >> "$GITHUB_ENV"

      - name: Run QA matrix
        env:
          LILBEE_QA_LANE: ${{ matrix.lane == 'pypi' && 'l1-pypi' || 'l2-binary' }}
          LILBEE_QA_MODELS_DIR: ${{ github.workspace }}/.lilbee-qa-models
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Lane: $LILBEE_QA_LANE"
          echo "Binary: $LILBEE_QA_BIN"
          mkdir -p "$LILBEE_QA_MODELS_DIR"
          python3 -m pytest tools/qa/ -v --tb=short \
            --junitxml=qa-${{ matrix.label }}-${{ matrix.lane }}.xml

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.label }}-${{ matrix.lane }}
          path: |
            qa-*.xml
            _bin/
            tools/qa/.pytest_cache/
          retention-days: 7

  # Dedicated Ollama lane: install [crawler,litellm], stand up an ollama
  # daemon with qwen3:0.6b, run only the litellm-backed ollama tests. We
  # isolate this from the main matrix because the [litellm] SDK adds 30-60s
  # per `lilbee` invocation on macOS arm64 and Linux native runners, which
  # blows the 60-min budget when applied to the full suite. Scoped to one
  # cell on ubuntu-latest where ollama install is straightforward.
  ollama-pypi:
    name: ollama-pypi (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install QA harness deps
        run: python -m pip install --root-user-action=ignore -r tools/qa/requirements.txt

      - name: Resolve target lilbee version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          RC_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${RC_VERSION}" ]; then
            RESOLVED_TAG="v${RC_VERSION}"
            RESOLVED_VERSION="${RC_VERSION}"
          else
            TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
            RESOLVED_TAG="${TAG}"
            RESOLVED_VERSION="${TAG#v}"
          fi
          {
            echo "tag=${RESOLVED_TAG}"
            echo "version=${RESOLVED_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore QA models cache
        uses: actions/cache@v4
        with:
          path: ~/.lilbee-qa-models
          key: lilbee-qa-models-v2-qwen3-0.6b-nomic-embed-v1.5-bge-rerank-v2-m3

      - name: Download wheel artifacts from sibling run (RC mode)
        if: inputs.wheel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-default-*
          path: ./_wheels
          run-id: ${{ inputs.wheel_run_id }}
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Install lilbee from local wheels with crawler + litellm extras (RC mode)
        if: inputs.wheel_run_id != ''
        run: |
          python -m pip install --find-links ./_wheels --pre "lilbee[crawler,litellm]==${{ steps.ver.outputs.version }}"
          echo "LILBEE_QA_BIN=$(command -v lilbee)" >> "$GITHUB_ENV"

      - name: Install lilbee from PyPI with crawler + litellm extras
        if: inputs.wheel_run_id == ''
        run: |
          python -m pip install "lilbee[crawler,litellm]==${{ steps.ver.outputs.version }}"
          echo "LILBEE_QA_BIN=$(command -v lilbee)" >> "$GITHUB_ENV"

      - name: Install Ollama daemon + pull tiny model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=127.0.0.1:11434 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          ollama pull qwen3:0.6b
          {
            echo "LILBEE_QA_OLLAMA_HOST=127.0.0.1"
            echo "LILBEE_QA_OLLAMA_PORT=11434"
            echo "LILBEE_QA_OLLAMA_MODEL=qwen3:0.6b"
          } >> "$GITHUB_ENV"

      - name: Run ollama tests only
        env:
          LILBEE_QA_LANE: l1-pypi
          LILBEE_QA_MODELS_DIR: ${{ github.workspace }}/.lilbee-qa-models
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$LILBEE_QA_MODELS_DIR"
          if [ -d "$HOME/.lilbee-qa-models" ]; then
            cp -R "$HOME/.lilbee-qa-models/." "$LILBEE_QA_MODELS_DIR/" 2>/dev/null || true
          fi
          python -m pytest tools/qa/test_e2e_litellm_ollama.py -v --tb=short \
            --junitxml=qa-ollama-pypi.xml

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ollama-pypi
          path: |
            qa-*.xml
            tools/qa/.pytest_cache/
          retention-days: 7

  # Dedicated [crawler] lane on a single ubuntu cell; isolation rationale matches ollama-pypi.
  crawler-pypi:
    name: crawler-pypi (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install QA harness deps
        run: python -m pip install --root-user-action=ignore -r tools/qa/requirements.txt

      - name: Resolve target lilbee version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          RC_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${RC_VERSION}" ]; then
            RESOLVED_TAG="v${RC_VERSION}"
            RESOLVED_VERSION="${RC_VERSION}"
          else
            TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
            RESOLVED_TAG="${TAG}"
            RESOLVED_VERSION="${TAG#v}"
          fi
          {
            echo "tag=${RESOLVED_TAG}"
            echo "version=${RESOLVED_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore QA models cache
        uses: actions/cache@v4
        with:
          path: ~/.lilbee-qa-models
          key: lilbee-qa-models-v2-qwen3-0.6b-nomic-embed-v1.5-bge-rerank-v2-m3

      - name: Download wheel artifacts from sibling run (RC mode)
        if: inputs.wheel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-default-*
          path: ./_wheels
          run-id: ${{ inputs.wheel_run_id }}
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Install lilbee from local wheels with crawler extra (RC mode)
        if: inputs.wheel_run_id != ''
        run: |
          python -m pip install --find-links ./_wheels --pre "lilbee[crawler]==${{ steps.ver.outputs.version }}"
          echo "LILBEE_QA_BIN=$(command -v lilbee)" >> "$GITHUB_ENV"

      - name: Install lilbee from PyPI with crawler extra
        if: inputs.wheel_run_id == ''
        run: |
          python -m pip install "lilbee[crawler]==${{ steps.ver.outputs.version }}"
          echo "LILBEE_QA_BIN=$(command -v lilbee)" >> "$GITHUB_ENV"

      - name: Run crawler tests only
        env:
          LILBEE_QA_LANE: l1-pypi
          LILBEE_QA_MODELS_DIR: ${{ github.workspace }}/.lilbee-qa-models
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$LILBEE_QA_MODELS_DIR"
          if [ -d "$HOME/.lilbee-qa-models" ]; then
            cp -R "$HOME/.lilbee-qa-models/." "$LILBEE_QA_MODELS_DIR/" 2>/dev/null || true
          fi
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cp tools/qa/scripts/sitecustomize_loopback.py "${SITE_PACKAGES}/sitecustomize.py"
          python -m pytest tools/qa/test_e2e_crawl.py -v --tb=short \
            --junitxml=qa-crawler-pypi.xml

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-crawler-pypi
          path: |
            qa-*.xml
            tools/qa/.pytest_cache/
          retention-days: 7
