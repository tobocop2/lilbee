name: Release artifacts

# Slow lane, fired by publish-pypi.yml once the PyPI upload lands (or run
# manually). Builds everything a PyPI publish doesn't need and the packaging
# workflows do: the Nuitka standalone executables (re-attached to the tag's GH
# release in place), the CUDA + Intel-Mac CPU extra wheels (for the per-backend
# PEP 503 index pages.yml builds), then dispatches Docker / Homebrew / AUR / Nix
# -- those consume the GH-release executable, so they wait on attach-binaries.
# None of this gates the PyPI upload.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build release artifacts for (e.g. v0.6.66b469)."
        required: true

permissions:
  contents: write   # re-attach binaries to the GH release
  actions: write    # dispatch publish-docker.yml / publish-packages.yml

concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      # Implicit existence check: fails loudly if the tag does not exist.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Parse version from pyproject.toml
        id: parse
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Default + CUDA/Intel-Mac extra wheels -> run artifacts -> pages.yml's PEP 503 index.
  build-wheels:
    needs: [guard]
    uses: ./.github/workflows/build-wheels.yml
    with:
      build_extras: true
      ref: ${{ inputs.tag }}
    secrets: inherit

  # The canonical release executables, built fresh from the tagged commit.
  build-binaries:
    needs: [guard]
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ inputs.tag }}
    secrets: inherit

  attach-binaries:
    needs: [guard, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/attach-prerelease
        with:
          tag: ${{ inputs.tag }}
          version: ${{ needs.guard.outputs.version }}

  # Docker / Homebrew / AUR / Nix all consume the GH-release executable -> wait
  # on attach-binaries.
  fanout-packaging:
    needs: [attach-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/fanout-packaging
        with:
          tag: ${{ inputs.tag }}
