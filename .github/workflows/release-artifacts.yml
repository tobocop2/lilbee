name: Release artifacts

# Slow lane, dispatched by publish-pypi.yml after the PyPI upload (or run by
# hand): rebuild the standalone executables -> re-attach to the tag's GH
# release, build the CUDA + Intel-Mac CPU extra wheels for the PEP 503 index,
# then fan out to Docker/Homebrew/AUR/Nix. None of this gates the PyPI upload.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build release artifacts for (e.g. v0.6.66b469)."
        required: true

permissions:
  contents: write   # re-attach binaries to the GH release
  actions: write    # dispatch publish-docker.yml / publish-packages.yml

concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v6   # also the implicit tag-exists check
        with:
          ref: ${{ inputs.tag }}
      - name: Check tag matches pyproject version
        id: parse
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-wheels:
    needs: [guard]
    uses: ./.github/workflows/build-wheels.yml
    with:
      build_extras: true   # default + CUDA/Intel-Mac wheels -> pages.yml's PEP 503 index
      ref: ${{ inputs.tag }}
    secrets: inherit

  build-binaries:
    needs: [guard]
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ inputs.tag }}
    secrets: inherit

  attach-binaries:
    needs: [guard, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/attach-prerelease
        with:
          tag: ${{ inputs.tag }}
          version: ${{ needs.guard.outputs.version }}

  # Docker/Homebrew/AUR/Nix consume the GH-release executable -> wait on attach-binaries.
  fanout-packaging:
    needs: [attach-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/fanout-packaging
        with:
          tag: ${{ inputs.tag }}
