# TEMPORARY: branch-only dry run of the new flatpak/snap publish jobs against
# an existing release, minus GPG signing, the pages push, and the release
# upload (secrets not provisioned yet). Delete before merging to main.
name: Scratch flatpak+snap validate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to validate against (e.g. v0.6.66b495)."
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      sha_linux: ${{ steps.info.outputs.sha_linux }}
      size_linux: ${{ steps.info.outputs.size_linux }}
    steps:
      - name: Resolve tag and asset digests
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${tag#v}"
          gh api "/repos/${REPO}/releases/tags/${tag}" \
            --jq '.assets[] | "\(.name)\t\(.digest|sub("sha256:"; ""))\t\(.size)"' > /tmp/assets.tsv

          get_sha() {
            awk -F'\t' -v name="$1" '$1 == name { print $2 }' /tmp/assets.tsv
          }
          get_size() {
            awk -F'\t' -v name="$1" '$1 == name { print $3 }' /tmp/assets.tsv
          }
          sha_linux=$(get_sha lilbee-linux-x86_64)
          size_linux=$(get_size lilbee-linux-x86_64)
          [ -n "$sha_linux" ] || { echo "lilbee-linux-x86_64 missing from release ${tag}"; exit 1; }

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha_linux=$sha_linux"
            echo "size_linux=$size_linux"
          } >> "$GITHUB_OUTPUT"

  flatpak:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install flatpak-builder and runtimes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Render manifest and build (unsigned)
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA_LINUX: ${{ needs.resolve.outputs.sha_linux }}
          SIZE_LINUX: ${{ needs.resolve.outputs.size_linux }}
        run: |
          set -euo pipefail
          bash packaging/tools/render_flatpak_manifest.sh \
            packaging/flatpak/io.github.tobocop2.lilbee.yml "$VERSION" "$SHA_LINUX" "$SIZE_LINUX"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=/tmp/repo /tmp/flatpak-build packaging/flatpak/io.github.tobocop2.lilbee.yml
          flatpak build-update-repo --generate-static-deltas --prune --prune-depth=2 /tmp/repo
      - name: Smoke test from the local repo
        env:
          EXPECTED: lilbee ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          flatpak remote-add --user --no-gpg-verify lilbee-local file:///tmp/repo
          flatpak install --user -y --noninteractive lilbee-local io.github.tobocop2.lilbee
          ACTUAL=$(flatpak run io.github.tobocop2.lilbee --version)
          echo "flatpak: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Build the single-file bundle
        run: |
          set -euo pipefail
          flatpak build-bundle /tmp/repo /tmp/lilbee.flatpak io.github.tobocop2.lilbee \
            --repo-url=https://tobocop2.github.io/flatpak-lilbee/repo \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la /tmp/lilbee.flatpak

  snap:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify the release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha_linux }}
        run: |
          set -euo pipefail
          mkdir -p packaging/snap/payload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p lilbee-linux-x86_64 -O packaging/snap/payload/lilbee-linux-x86_64
          echo "$SHA  packaging/snap/payload/lilbee-linux-x86_64" | sha256sum -c -
          chmod +x packaging/snap/payload/lilbee-linux-x86_64
      - name: Render snapcraft.yaml
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash packaging/tools/render_snapcraft.sh packaging/snap/snapcraft.yaml "$VERSION"
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap
      - name: Smoke test
        env:
          EXPECTED: lilbee ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sudo snap install "${{ steps.build.outputs.snap }}" --dangerous --classic
          ACTUAL=$(/snap/bin/lilbee --version)
          echo "snap: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
