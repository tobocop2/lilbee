name: Publish to PyPI

# Pure publish step -- no builds. Finds the release-candidate.yml run for this
# tag, downloads its default wheels + sdist, uploads them to PyPI, then dispatches
# the packaging fan-out (Docker / Homebrew / AUR / Nix). PyPI publish only needs
# the default wheels + sdist (they finish ~25 min into the RC run), so this can
# run as soon as those artifacts are up. The fan-out needs the executables on the
# GH release; if they're not attached yet it waits up to 5 hours for the RC run
# to attach them (the Windows nuitka build alone has been observed at ~3h45m) and
# fails loudly past that. No second dispatch is needed even when the wheels land
# before the executables.
#
# Filename `publish.yml` + the `pypi` environment name are pinned by PyPI's
# trusted-publisher config -- don't rename.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.66b469)."
        required: true

permissions:
  contents: read
  id-token: write   # OIDC for Trusted Publishing
  actions: write    # cross-run artifact download (read) + dispatch publish-docker/packages

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      rc_run_id: ${{ steps.resolve.outputs.rc_run_id }}
    steps:
      - name: Refuse if tag already has a non-prerelease published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo ${{ github.repository }} --json isPrerelease -q .isPrerelease 2>/dev/null | grep -q false; then
            echo "tag ${{ inputs.tag }} already has a non-prerelease GH release; refusing to overwrite" >&2
            exit 1
          fi

      - uses: actions/checkout@v6   # also the implicit tag-exists check
        with:
          ref: ${{ inputs.tag }}

      - name: Check tag matches pyproject version
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi

      - name: Resolve the release-candidate run that built this tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_WHEELS: "10"   # build-default-wheels.yml matrix size; bump if it changes
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "${TAG} -> ${SHA}"
          # Most recent push-triggered RC run for this commit -- any status; we
          # only need its default wheels + sdist, which land well before the
          # executables / CUDA matrix / QA finish.
          RC_ID=$(gh api "repos/${REPO}/actions/workflows/release-candidate.yml/runs?head_sha=${SHA}&event=push&per_page=50" \
            --jq '.workflow_runs | sort_by(.run_started_at) | last | .id // empty')
          if [ -z "${RC_ID}" ]; then
            echo "no 'Release candidate' run for ${SHA}; push the tag first" >&2
            exit 1
          fi
          echo "release-candidate run = ${RC_ID}"
          ART=$(gh api "repos/${REPO}/actions/runs/${RC_ID}/artifacts?per_page=100")
          N_WHEELS=$(echo "${ART}" | jq '[.artifacts[] | select(.name | startswith("wheel-default-"))] | length')
          N_SDIST=$(echo "${ART}" | jq '[.artifacts[] | select(.name == "sdist")] | length')
          echo "run ${RC_ID}: wheel-default-* = ${N_WHEELS}/${EXPECTED_WHEELS}, sdist = ${N_SDIST}/1"
          if [ "${N_WHEELS}" -lt "${EXPECTED_WHEELS}" ] || [ "${N_SDIST}" -lt 1 ]; then
            echo "run ${RC_ID} hasn't finished building the default wheels + sdist; wait, re-run release-candidate.yml, or use emergency-publish.yml if a cell failed and you're shipping intentionally" >&2
            exit 1
          fi
          echo "rc_run_id=${RC_ID}" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: [guard]
    runs-on: ubuntu-latest
    environment: pypi
    # pypa/gh-action-pypi-publish is a Docker action; called from a local composite
    # it misreads GITHUB_ACTION_REPOSITORY and pulls the wrong image -- so the
    # download + upload steps live here directly, not in a wrapper action.
    steps:
      - name: Download wheel artifacts from the release-candidate run
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-default-*
          path: dist/
          merge-multiple: true
          run-id: ${{ needs.guard.outputs.rc_run_id }}
          github-token: ${{ github.token }}
      - name: Download sdist from the release-candidate run
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
          run-id: ${{ needs.guard.outputs.rc_run_id }}
          github-token: ${{ github.token }}
      - name: List wheels + sdist
        run: ls -lh dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # safe to re-run (e.g. to redo the fan-out once executables land)

  # Docker / Homebrew / AUR / Nix consume the executables on the GH release that
  # the RC run already attached -- they don't need a build, just the tag.
  dispatch-fanout:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/fanout-packaging
        with:
          tag: ${{ inputs.tag }}
