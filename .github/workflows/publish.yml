name: Publish to PyPI
run-name: Publish to PyPI ${{ inputs.tag }}

# Pure PyPI publish: finds the release-candidate.yml run for this tag, downloads
# its default wheels + sdist, uploads them to PyPI. Auto-dispatched by
# release-candidate.yml's dispatch-publish job as soon as the wheels are built;
# also available as workflow_dispatch for manual re-runs. The packaging fan-out
# (Docker / Homebrew / AUR / Nix / CUDA) is dispatched separately from
# release-candidate.yml -- this workflow no longer chains into it.
#
# Filename `publish.yml` + the `pypi` environment name are pinned by PyPI's
# trusted-publisher config -- don't rename.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.66b469)."
        required: true
      rc_run_id:
        description: "Release-candidate run id to publish from. Only needed when neither the tag nor the commit finds the right run."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write   # OIDC for Trusted Publishing
  actions: read     # cross-run artifact download

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      rc_run_id: ${{ steps.resolve.outputs.rc_run_id }}
    steps:
      - name: Refuse if tag already has a non-prerelease published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo ${{ github.repository }} --json isPrerelease -q .isPrerelease 2>/dev/null | grep -q false; then
            echo "tag ${{ inputs.tag }} already has a non-prerelease GH release; refusing to overwrite" >&2
            exit 1
          fi

      - uses: actions/checkout@v7   # also the implicit tag-exists check
        with:
          ref: ${{ inputs.tag }}

      - name: Check tag matches pyproject version
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi

      - name: Resolve the release-candidate run that built this tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "${TAG} -> ${SHA}"
          # Resolve by tag, which is what the run was triggered on and stays
          # correct even if the tag is later moved to another commit. head_sha
          # is the fallback, and an explicit run id overrides both. Any status
          # will do: we need the default wheels + sdist, which land well before
          # the executables / CUDA matrix / QA finish.
          runs_for () {
            gh api "repos/${REPO}/actions/workflows/release-candidate.yml/runs?$1&event=push&per_page=50" \
              --jq '.workflow_runs | sort_by(.run_started_at) | last | .id // empty'
          }
          RC_ID="${RC_RUN_ID}"
          [ -n "${RC_ID}" ] || RC_ID=$(runs_for "branch=${TAG}")
          [ -n "${RC_ID}" ] || RC_ID=$(runs_for "head_sha=${SHA}")
          if [ -z "${RC_ID}" ]; then
            echo "no 'Release candidate' run for tag ${TAG} or commit ${SHA}; push the tag first, or pass rc_run_id" >&2
            exit 1
          fi
          echo "release-candidate run = ${RC_ID}"
          ART=$(gh api "repos/${REPO}/actions/runs/${RC_ID}/artifacts?per_page=100")
          # lilbee is a pure-Python package: build-default-wheels produces one
          # universal wheel artifact named `wheel-default` (plus the sdist). The
          # per-backend engine wheels ship as `wheel-multigpu-*` and are not part
          # of the PyPI publish.
          N_WHEELS=$(echo "${ART}" | jq '[.artifacts[] | select(.name == "wheel-default")] | length')
          N_SDIST=$(echo "${ART}" | jq '[.artifacts[] | select(.name == "sdist")] | length')
          echo "run ${RC_ID}: wheel-default = ${N_WHEELS}/1, sdist = ${N_SDIST}/1"
          if [ "${N_WHEELS}" -lt 1 ] || [ "${N_SDIST}" -lt 1 ]; then
            echo "run ${RC_ID} hasn't finished building the default wheels + sdist; wait, re-run release-candidate.yml, or use emergency-publish.yml if a cell failed and you're shipping intentionally" >&2
            exit 1
          fi
          echo "rc_run_id=${RC_ID}" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: [guard]
    runs-on: ubuntu-latest
    environment: pypi
    # pypa/gh-action-pypi-publish is a Docker action; called from a local composite
    # it misreads GITHUB_ACTION_REPOSITORY and pulls the wrong image -- so the
    # download + upload steps live here directly, not in a wrapper action.
    steps:
      - name: Download the default wheel from the release-candidate run
        uses: actions/download-artifact@v8
        with:
          name: wheel-default
          path: dist/
          run-id: ${{ needs.guard.outputs.rc_run_id }}
          github-token: ${{ github.token }}
      - name: Download sdist from the release-candidate run
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/
          run-id: ${{ needs.guard.outputs.rc_run_id }}
          github-token: ${{ github.token }}
      - name: List wheels + sdist
        run: ls -lh dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # safe to re-run
