name: Publish to PyPI

run-name: Publish ${{ inputs.tag }} to PyPI

# Pure PyPI publish: downloads the tag's lilbee wheel + sdist from its GH
# release and uploads them to PyPI. Dispatched by promote.yml at STABLE
# promotion -- PyPI has no channel pointers, so the stable channel is the only
# one that publishes here; dev/beta users install the wheel from the GH release
# or a standalone executable. Re-runs are no-ops (PyPI versions are immutable
# and skip-existing is set), so promote.yml can be re-dispatched safely.
#
# The run-name carries the tag so promote.yml's dispatch-and-wait can find this
# run. Sourcing from release assets (not the release-candidate run's artifacts)
# is load-bearing: promotion can happen months after the build, long past the
# 90-day artifact retention.
#
# Filename `publish.yml` + the `pypi` environment name are pinned by PyPI's
# trusted-publisher config -- don't rename, and don't fold this into
# promote.yml as a reusable workflow (the OIDC claim would name the caller).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.91)."
        required: true

permissions:
  contents: read
  id-token: write   # OIDC for Trusted Publishing

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # also the implicit tag-exists check
        with:
          ref: ${{ inputs.tag }}

      - name: Check tag matches pyproject version
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi

      - name: Release has the wheel and sdist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name' > assets.txt
          grep -q '^lilbee-.*\.whl$' assets.txt || { echo "no lilbee wheel on release ${TAG}; re-run attach-release-artifacts.yml first" >&2; exit 1; }
          grep -q '^lilbee-.*\.tar\.gz$' assets.txt || { echo "no sdist on release ${TAG}; re-run attach-release-artifacts.yml first" >&2; exit 1; }

  publish-pypi:
    needs: [guard]
    runs-on: ubuntu-latest
    environment: pypi
    # pypa/gh-action-pypi-publish is a Docker action; called from a local composite
    # it misreads GITHUB_ACTION_REPOSITORY and pulls the wrong image -- so the
    # download + upload steps live here directly, not in a wrapper action.
    steps:
      # `lilbee-*.whl` / `lilbee-*.tar.gz` match only the pure package: the
      # engine wheels are `lilbee_engine-*` and the executables have no extension.
      - name: Download the wheel + sdist from the GH release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "${TAG}" --repo "${REPO}" \
            --pattern 'lilbee-*.whl' --pattern 'lilbee-*.tar.gz' --dir dist/
      - name: List wheels + sdist
        run: ls -lh dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # safe to re-run
