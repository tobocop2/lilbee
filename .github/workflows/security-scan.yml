name: Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  code-scan:
    name: Code scan (SAST + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended, not security-and-quality: the +quality queries are
          # code-style checks (import cycles, dead code), not security findings.
          queries: security-extended
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

      - name: Run Gitleaks
        if: always()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency CVEs (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras
        env:
          CMAKE_ARGS: "-DGGML_METAL=OFF -DGGML_NATIVE=OFF"

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .
          # Keep this list mirrored with osv-scanner.toml. Per-ID rationale:
          # - CVE-2025-69872: diskcache 5.6.3 uses pickle for serialization.
          #   Pulled in transitively by llama-cpp-python; no upstream fix.
          #   Exploitation requires write access to the user's own cache dir
          #   (post-compromise scenario). Revisit when llama-cpp-python drops
          #   or patches the diskcache dependency.
          # - PYSEC-2022-42969: ReDoS in the unmaintained `py` package 1.11.0
          #   (py.path.svnwc). Pulled in transitively by pytest-forked>=1.6.0.
          #   Not reachable from lilbee or pytest-forked. No upstream fix.
          # - GHSA-vfmq-68hx-4jfw: XXE in lxml <6.1 default iterparse config.
          #   Transitively pinned to 5.x by crawl4ai 0.8.6 (`lxml~=5.3`);
          #   only installed with the `crawler` extra. Revisit when crawl4ai
          #   allows lxml 6.x.
          # - GHSA-xqmj-j6mv-4862: SSTI in the LiteLLM Proxy server's
          #   `POST /prompts/test` endpoint. lilbee uses litellm only as an
          #   SDK (litellm.completion) and never runs the proxy, so the
          #   affected endpoint is not exposed. The patched 1.83.7 hard-pins
          #   click==8.1.8 while typer (a direct dep) requires click>=8.2.1,
          #   so the bump is blocked. Revisit when litellm loosens its click
          #   pin or typer relaxes its click floor.
          # - GHSA-r75f-5x8p-qvmc: SQL injection in the LiteLLM Proxy's
          #   API-key verification path. Reachable only via the proxy's HTTP
          #   endpoints; lilbee never starts the proxy. Same 1.83.7 click
          #   pin issue blocks the bump.
          # - GHSA-v4p8-mg3p-g94g: Authenticated command execution via the
          #   LiteLLM Proxy MCP stdio test endpoints. Requires a valid proxy
          #   API key and a running proxy; lilbee uses the SDK only. Same
          #   1.83.7 click pin issue blocks the bump.
          # - GHSA-wxxx-gvqv-xp7p: Sandbox escape in the LiteLLM Proxy's
          #   `POST /guardrails/test_custom_code` endpoint. Needs a proxy-admin
          #   credential and a running proxy; lilbee uses the SDK only. Patched
          #   in 1.83.10/1.83.11; same click pin issue blocks the bump.
          # - PYSEC-2025-183: DISPUTED weak-encryption finding in pyjwt
          #   (CVE-2025-45768). Upstream rejects: HMAC key length is the
          #   application's choice, not the library's; no fixed version. pyjwt
          #   is transitive via mcp; lilbee never imports it.
          # - PYSEC-2024-277: DISPUTED unpickling finding in joblib
          #   (CVE-2024-34997). NumpyArrayWrapper only reads joblib-produced
          #   cache files (trusted content). joblib is transitive via nltk via
          #   crawl4ai (`crawler` extra); lilbee never imports it.
          ignore-vulns: |
            CVE-2025-69872
            PYSEC-2022-42969
            GHSA-vfmq-68hx-4jfw
            GHSA-xqmj-j6mv-4862
            GHSA-r75f-5x8p-qvmc
            GHSA-v4p8-mg3p-g94g
            GHSA-wxxx-gvqv-xp7p
            PYSEC-2025-183
            PYSEC-2024-277

  osv-scan:
    name: OSV-Scanner (multi-ecosystem CVEs)
    # Complements pip-audit: OSV.dev aggregates advisories from GHSA, OSV,
    # Alpine SecDB, and others, catching CVEs that PyPI's advisory feed may
    # lag on. Suppressions live in osv-scanner.toml at the repo root.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
