name: Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  code-scan:
    name: Code scan (SAST + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: python
          # security-extended, not security-and-quality: the +quality queries are
          # code-style checks (import cycles, dead code), not security findings.
          queries: security-extended
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:python

      - name: Run Gitleaks
        if: always()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency CVEs (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Audit the locked third-party set; lilbee-engine is first-party vendored
      # binaries resolved from a local path, not a PyPI package.
      - name: Export locked requirements for audit
        run: >
          uv export --locked --all-extras --no-emit-project
          --no-emit-package lilbee-engine
          --format requirements-txt -o requirements-audit.txt

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-audit.txt
          # Audit the exported pins as written. With --disable-pip, pip-audit
          # does not install or re-resolve with pip, which ignores
          # [tool.uv] exclusions and can reject a pin for its own Python.
          require-hashes: true
          internal-be-careful-extra-flags: --disable-pip
          # Keep this list mirrored with osv-scanner.toml. Per-ID rationale:
          # - CVE-2025-69872: diskcache pickle serialization; exploiting it needs
          #   write access to the user's own cache dir. No upstream fix yet.
          # - PYSEC-2022-42969: ReDoS in the unmaintained `py` package 1.11.0
          #   (py.path.svnwc). Pulled in transitively by pytest-forked>=1.6.0.
          #   Not reachable from lilbee or pytest-forked. No upstream fix.
          # - PYSEC-2025-183: DISPUTED weak-encryption finding in pyjwt
          #   (CVE-2025-45768). Upstream rejects: HMAC key length is the
          #   application's choice, not the library's; no fixed version. pyjwt
          #   is transitive via mcp; lilbee never imports it.
          ignore-vulns: |
            CVE-2025-69872
            PYSEC-2022-42969
            PYSEC-2025-183

  osv-scan:
    name: OSV-Scanner (multi-ecosystem CVEs)
    # Complements pip-audit: OSV.dev aggregates advisories from GHSA, OSV,
    # Alpine SecDB, and others, catching CVEs that PyPI's advisory feed may
    # lag on. Suppressions live in osv-scanner.toml at the repo root.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
