name: Check upstream schemas

on:
  schedule:
    # Mondays 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --no-dev

      - name: Run retirement watcher
        id: watcher
        run: |
          set -euo pipefail
          uv run python tools/check_upstream_schemas.py > /tmp/report.md
          if grep -q "^## Ready to retire" /tmp/report.md; then
            echo "has_candidates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_candidates=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/report.md

      - name: Open retirement issue
        if: steps.watcher.outputs.has_candidates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          gh issue create \
            --title "Schema retirement candidates ($DATE)" \
            --body-file /tmp/report.md \
            --label "schema-retirement"
