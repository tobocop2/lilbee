name: Publish ROCm Packages

# Updates the Homebrew lilbee-rocm formula, AUR lilbee-rocm PKGBUILD, and the Nix
# flake ROCm entry to pin a tag's GH-release ROCm Linux binary, and builds the
# lilbee-rocm snap. Runs manually after build-gpu-executables.yml has attached the
# ROCm exe.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose ROCm executable is on the GH release (e.g. v0.6.66b476)."
        required: true

permissions:
  contents: read

concurrency:
  group: publish-rocm-packages-${{ inputs.tag }}
  cancel-in-progress: false

env:
  ROCM_ASSET: lilbee-linux-x86_64-rocm

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      sha_linux_rocm: ${{ steps.info.outputs.sha_linux_rocm }}
    steps:
      - name: Resolve tag and ROCm asset digest
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${tag#v}"
          gh api "/repos/${REPO}/releases/tags/${tag}" \
            --jq '.assets[] | "\(.name)\t\(.digest|sub("sha256:"; ""))\t\(.size)"' > /tmp/assets.tsv

          sha_linux_rocm=$(awk -F'\t' -v name="${ROCM_ASSET}" '$1 == name { print $2 }' /tmp/assets.tsv)
          [ -n "$sha_linux_rocm" ] || { echo "${ROCM_ASSET} missing from release ${tag}; run build-gpu-executables.yml first"; exit 1; }

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha_linux_rocm=$sha_linux_rocm"
          } >> "$GITHUB_OUTPUT"

  homebrew:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-homebrew-formula
        with:
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula-path: Formula/lilbee-rocm.rb
          render-args: --rocm --version ${{ needs.resolve.outputs.version }} --sha-linux-rocm ${{ needs.resolve.outputs.sha_linux_rocm }}
          commit-message: "lilbee-rocm ${{ needs.resolve.outputs.version }}"

  aur:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-aur-package
        with:
          pkgname: lilbee-rocm
          pkgbuild-dir: packaging/aur/lilbee-rocm
          version: ${{ needs.resolve.outputs.version }}
          sha-linux: ${{ needs.resolve.outputs.sha_linux_rocm }}
          aur-ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  nix-flake:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build systems JSON
        id: sys
        env:
          SHA_LINUX_ROCM: ${{ needs.resolve.outputs.sha_linux_rocm }}
        run: |
          systems=$(jq -nc \
            --arg sha "$SHA_LINUX_ROCM" \
            --arg asset "${ROCM_ASSET}" \
            '{ "x86_64-linux": { asset: $asset, sha256: $sha } }')
          echo "value=${systems}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-flake-sources
        with:
          target-file: sources-rocm.json
          version: ${{ needs.resolve.outputs.version }}
          systems-json: ${{ steps.sys.outputs.value }}
          commit-message: "lilbee-rocm ${{ needs.resolve.outputs.version }} (flake)"

  snap:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify the ROCm binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha_linux_rocm }}
        run: |
          set -euo pipefail
          mkdir -p packaging/snap-rocm/payload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p "${ROCM_ASSET}" -O "packaging/snap-rocm/payload/${ROCM_ASSET}"
          echo "$SHA  packaging/snap-rocm/payload/${ROCM_ASSET}" | sha256sum -c -
          chmod +x "packaging/snap-rocm/payload/${ROCM_ASSET}"
      - name: Render snapcraft.yaml
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash packaging/tools/render_snapcraft.sh packaging/snap-rocm/snapcraft.yaml "$VERSION"
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap-rocm
      - name: Smoke test
        env:
          EXPECTED: lilbee ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sudo snap install "${{ steps.build.outputs.snap }}" --dangerous --classic
          ACTUAL=$(/snap/bin/lilbee-rocm --version)
          echo "snap: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          cp "${{ steps.build.outputs.snap }}" "${ROCM_ASSET}.snap"
          gh release upload "$TAG" "${ROCM_ASSET}.snap" --repo "$GITHUB_REPOSITORY" --clobber
