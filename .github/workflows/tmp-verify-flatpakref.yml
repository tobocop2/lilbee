name: TEMP verify flatpakref

# Throwaway: proves the published .flatpakref installs an extra-data app on a real
# Linux runner. Deleted before merge.
on:
  push:
    branches: [fix/flatpak-bundle-extra-data]

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: The shipped bundle must still fail, so the new gate is not vacuous
        run: |
          set -uo pipefail
          curl -fsSL -o /tmp/old.flatpak \
            https://github.com/tobocop2/lilbee/releases/download/v0.6.90b420.dev730/lilbee.flatpak
          flatpak install --user -y --noninteractive --bundle /tmp/old.flatpak
          rc=$?
          echo "bundle install exit=${rc}"
          [ "${rc}" -ne 0 ] || { echo "::error::the bundle installed; the premise is wrong"; exit 1; }

      - name: Install from the published flatpakref
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/lilbee.flatpakref \
            https://github.com/tobocop2/lilbee/releases/download/v0.6.90b420.dev731/lilbee.flatpakref
          cat /tmp/lilbee.flatpakref | grep -v '^GPGKey='
          flatpak install --user -y --noninteractive --from /tmp/lilbee.flatpakref
          flatpak run io.github.tobocop2.lilbee --version
