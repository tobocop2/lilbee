name: Llama pack cells (trial)

# Builds the llama.cpp wheels for Windows x86_64 (CPU, CUDA, Vulkan), macOS arm64 (Metal) and
# Linux x86_64 (CUDA, Vulkan, ROCm), repairs them, starts llama-server from the installed wheel,
# and keeps each wheel with its sha256 as a run artifact. The Windows cells repack the upstream
# release assets. The Linux cells build from source in the manylinux_2_34 image, because the
# upstream Linux assets need glibc 2.38 or libstdc++ 3.4.30. It publishes nothing and makes no release.
# A workflow_dispatch trigger needs the file on the default branch, so this runs on a push
# to one branch instead.
on:
  push:
    branches: [ci/llama-pack-cells]

permissions:
  contents: read

env:
  UPSTREAM_TAG: b12032
  UPSTREAM_REPO: ggml-org/llama.cpp
  WHEEL_VERSION: 1.12032.1
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  cell:
    name: ${{ matrix.cell }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: windows-x86_64-cpu
            backend: cpu
            runner: windows-2022
            asset: llama-b12032-bin-win-cpu-x64.zip
            platform: win_amd64
            license: MIT AND Apache-2.0 WITH LLVM-exception
            timeout: 45
          - cell: windows-x86_64-cuda
            backend: cuda
            runner: windows-2022
            asset: llama-b12032-bin-win-cuda-12.4-x64.zip
            extra_asset: cudart-llama-bin-win-cuda-12.4-x64.zip
            platform: win_amd64
            license: MIT AND LicenseRef-NVIDIA-CUDA-EULA
            timeout: 60
          - cell: macos-arm64-metal
            backend: metal
            runner: macos-15
            asset: llama-b12032-bin-macos-arm64.tar.gz
            platform: macosx_14_0_arm64
            license: MIT
            timeout: 45
          - cell: linux-x86_64-cuda
            backend: cuda
            runner: ubuntu-22.04
            build: source
            platform: manylinux_2_34_x86_64
            license: MIT AND LicenseRef-NVIDIA-CUDA-EULA
            timeout: 350
          - cell: windows-x86_64-vulkan
            backend: vulkan
            runner: windows-2022
            asset: llama-b12032-bin-win-vulkan-x64.zip
            platform: win_amd64
            license: MIT AND Apache-2.0 WITH LLVM-exception
            timeout: 45
          - cell: linux-x86_64-vulkan
            backend: vulkan
            runner: ubuntu-22.04
            build: source
            platform: manylinux_2_34_x86_64
            license: MIT
            timeout: 120
          - cell: linux-x86_64-rocm
            backend: rocm
            runner: ubuntu-22.04
            build: source
            platform: manylinux_2_34_x86_64
            license: MIT AND BSD-3-Clause AND NCSA AND Apache-2.0 WITH LLVM-exception
            timeout: 350
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: ${{ matrix.asset }}
      EXTRA_ASSET: ${{ matrix.extra_asset }}
      LICENSE_EXPRESSION: ${{ matrix.license }}
      PLATFORM: ${{ matrix.platform }}
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space for the Vulkan and ROCm build
        if: matrix.build == 'source' && matrix.backend != 'cuda'
        run: |
          set -euo pipefail
          # The ROCm packages and the build need more disk than the runner image leaves free.
          # This runs before setup-go and setup-python, so the later tool installs survive it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h / | tail -1

      - name: Read the engine pins
        run: grep -E '^ENGINE_[A-Z_]+=' engine-versions.env >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.ENGINE_GO_VERSION }}
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the upstream archives and check their digests
        if: matrix.build != 'source'
        run: |
          set -euo pipefail
          for name in "${ASSET}" ${EXTRA_ASSET}; do
            gh release download "${UPSTREAM_TAG}" -R "${UPSTREAM_REPO}" --pattern "${name}" --dir upstream
            want="$(gh release view "${UPSTREAM_TAG}" -R "${UPSTREAM_REPO}" --json assets \
              --jq ".assets[] | select(.name==\"${name}\") | .digest")"
            if command -v sha256sum >/dev/null; then
              got="sha256:$(sha256sum "upstream/${name}" | cut -d' ' -f1)"
            else
              got="sha256:$(shasum -a 256 "upstream/${name}" | cut -d' ' -f1)"
            fi
            test "${want}" = "${got}" || { echo "digest mismatch ${name}: ${want} ${got}"; exit 1; }
          done

      - name: Build llama-swap and gguf-parser, and collect the three licences
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local
          suffix=""
          case "$(uname -s)" in MINGW* | MSYS* | CYGWIN*) suffix=".exe" ;; esac
          bin="$PWD/packaging/engine-wheel/lilbee_engine_llama_cpp/bin"
          work="$(mktemp -d)"
          lic="$PWD/packaging/engine-wheel"
          mkdir -p "${bin}" "${lic}"
          gh api -H "Accept: application/vnd.github.raw" "repos/${UPSTREAM_REPO}/contents/LICENSE?ref=${UPSTREAM_TAG}" > "${lic}/LICENSE-llama.cpp"
          git clone -q --depth 1 --branch "${ENGINE_LLAMA_SWAP_VERSION}" https://github.com/mostlygeek/llama-swap.git "${work}/llama-swap"
          (cd "${work}/llama-swap" && go build -trimpath -o "${bin}/llama-swap${suffix}" .)
          cp "${work}/llama-swap/LICENSE.md" "${lic}/LICENSE-llama-swap"
          git clone -q --depth 1 --branch "${ENGINE_GGUF_PARSER_REF}" "${ENGINE_GGUF_PARSER_REPO}" "${work}/gguf-parser-go"
          (cd "${work}/gguf-parser-go/cmd/gguf-parser" && go build -trimpath -o "${bin}/gguf-parser${suffix}" .)
          cp "${work}/gguf-parser-go/LICENSE" "${lic}/LICENSE-gguf-parser"
          for f in "${lic}"/LICENSE-*; do test -s "${f}" || { echo "empty licence file ${f}"; exit 1; }; done

      - name: Write the NVIDIA CUDA notice with the EULA text
        if: matrix.backend == 'cuda'
        run: |
          set -euo pipefail
          python - packaging/engine-wheel/NOTICE-NVIDIA-CUDA <<'PY'
          import html.parser, sys, urllib.request

          class Text(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts, self.skip = [], 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1
                  elif tag in ("p", "div", "li", "h1", "h2", "h3", "h4", "br", "tr"):
                      self.parts.append("\n")

              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.skip -= 1

              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          url = "https://docs.nvidia.com/cuda/archive/12.4.1/eula/index.html"
          page = urllib.request.urlopen(url, timeout=60).read().decode("utf-8")
          parser = Text()
          parser.feed(page)
          body = "\n".join(line.strip() for line in "".join(parser.parts).splitlines() if line.strip())
          if "Attachment A" not in body or len(body) < 20000:
              raise SystemExit("the EULA text from " + url + " looks incomplete")
          head = (
              "This wheel carries NVIDIA CUDA 12.4 runtime files: the CUDA Runtime (cudart) and the\n"
              "CUDA BLAS libraries (cublas, cublasLt). They are named in Attachment A of the NVIDIA\n"
              "CUDA Toolkit End User License Agreement (https://docs.nvidia.com/cuda/eula/index.html#attachment-a).\n"
              "The files are not modified. The EULA terms apply to these files. The GPU driver\n"
              "(libcuda, nvcuda) is not part of this wheel.\n\n"
              "NVIDIA CUDA Toolkit EULA, version 12.4.1, from " + url + "\n\n")
          open(sys.argv[1], "w", encoding="utf-8").write(head + body + "\n")
          PY
          wc -c packaging/engine-wheel/NOTICE-NVIDIA-CUDA

      - name: Build llama.cpp with Vulkan or ROCm in the manylinux_2_34 image
        if: matrix.build == 'source' && matrix.backend != 'cuda'
        run: |
          set -euo pipefail
          mkdir -p packaging/engine-wheel/lilbee_engine_llama_cpp/bin
          docker run --rm -v "${PWD}:/work" -w /work \
            -e BACKEND -e UPSTREAM_REPO -e UPSTREAM_TAG \
            -e BIN_DIR=/work/packaging/engine-wheel/lilbee_engine_llama_cpp/bin \
            -e LICENSE_DIR=/work/packaging/engine-wheel \
            -e "OWNER=$(id -u):$(id -g)" \
            quay.io/pypa/manylinux_2_34_x86_64@sha256:e0b7a1bdb4a0b7d519b29b301e2d3c626a33ea78e9bb5bb1590ce2d99d0ae62f \
            bash /work/tools/wheel-build/llama_gpu_manylinux.sh
          ls -l packaging/engine-wheel/lilbee_engine_llama_cpp/bin
          df -h / | tail -1

      - name: Build llama.cpp with CUDA 12.4 in the manylinux_2_34 image
        if: matrix.build == 'source' && matrix.backend == 'cuda'
        run: |
          set -euo pipefail
          # The runner disk is small; the build and the toolkit need several GB.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          mkdir -p packaging/engine-wheel/lilbee_engine_llama_cpp/bin
          docker run --rm -v "${PWD}:/work" -w /work \
            -e UPSTREAM_REPO -e UPSTREAM_TAG \
            -e BIN_DIR=/work/packaging/engine-wheel/lilbee_engine_llama_cpp/bin \
            -e SHA_FILE=/work/cuda-libs.sha256 -e "OWNER=$(id -u):$(id -g)" \
            quay.io/pypa/manylinux_2_34_x86_64@sha256:e0b7a1bdb4a0b7d519b29b301e2d3c626a33ea78e9bb5bb1590ce2d99d0ae62f \
            bash /work/tools/wheel-build/llama_cuda_manylinux.sh
          ls -l packaging/engine-wheel/lilbee_engine_llama_cpp/bin
          cat cuda-libs.sha256

      - name: Repack the upstream archives into the wheel tree
        if: matrix.build != 'source'
        run: |
          set -euo pipefail
          python - packaging/engine-wheel/lilbee_engine_llama_cpp/bin "upstream/${ASSET}" ${EXTRA_ASSET:+"upstream/${EXTRA_ASSET}"} <<'PY'
          import re, shutil, subprocess, sys, tarfile, tempfile, zipfile
          from pathlib import Path

          bin_dir, archives = Path(sys.argv[1]), [Path(a) for a in sys.argv[2:]]
          server = {"llama-server", "llama-server.exe"}
          library = re.compile(r"lib.+\.so(\.[\d.]+)?|.+\.dll|lib.+(\.[\d.]+)?\.dylib")

          def install_name(entry):
              """The file name dependents load for a dylib: its install id, else its own name."""
              if entry.suffix != ".dylib":
                  return entry.name
              ident = subprocess.run(["otool", "-D", str(entry)], capture_output=True, text=True, check=True)
              lines = ident.stdout.strip().splitlines()
              return Path(lines[-1].strip()).name if len(lines) > 1 else entry.name

          def repack(archive, with_server):
              """Copy the server and the libraries of one archive; a runtime-only archive has no server."""
              with tempfile.TemporaryDirectory() as scratch:
                  if archive.suffix == ".zip":
                      with zipfile.ZipFile(archive) as z:
                          z.extractall(scratch)
                  else:
                      with tarfile.open(archive) as t:
                          t.extractall(scratch, filter="data")
                  wanted = lambda p: p.name in server if with_server else library.fullmatch(p.name)
                  roots = {p.parent for p in Path(scratch).rglob("*") if p.is_file() and wanted(p)}
                  if len(roots) != 1:
                      raise SystemExit(f"{archive.name}: expected one folder to repack, found {len(roots)}")
                  (root,) = roots
                  # The archive carries the LLVM OpenMP licence beside libomp.dll.
                  omp_licence = root / "LICENSE-LLVM-OpenMP"
                  if with_server and omp_licence.is_file():
                      shutil.copy2(omp_licence, bin_dir.parents[1] / omp_licence.name)
                  for entry in sorted(root.iterdir()):
                      if entry.is_symlink():
                          continue  # a link only repeats a file that the loop copies once
                      if entry.is_file() and (entry.name in server or library.fullmatch(entry.name)):
                          target = bin_dir / install_name(entry)
                          if target.exists():
                              raise SystemExit(f"{archive.name}: two files install as {target.name}")
                          shutil.copy2(entry, target)

          repack(archives[0], True)
          for extra in archives[1:]:
              repack(extra, False)
          if not any((bin_dir / n).exists() for n in server):
              raise SystemExit(f"{archives[0].name}: no llama-server in the tree")
          if (bin_dir / "libomp.dll").exists() and not (bin_dir.parents[1] / "LICENSE-LLVM-OpenMP").is_file():
              raise SystemExit(f"{archives[0].name}: libomp.dll without LICENSE-LLVM-OpenMP")
          PY
          ls -l packaging/engine-wheel/lilbee_engine_llama_cpp/bin

      - name: Add the Visual C++ runtime beside the exe
        if: runner.os == 'Windows'
        run: bash tools/wheel-build/bundle_windows_runtime.sh packaging/engine-wheel/lilbee_engine_llama_cpp/bin

      - name: Drop vcomp140 when nothing imports it
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          cd packaging/engine-wheel/lilbee_engine_llama_cpp/bin
          # This build uses libomp.dll. A binary that names vcomp140 keeps the file.
          if grep -rilaF vcomp140 --include='*.dll' --include='*.exe' . | grep -vi '^./vcomp140.dll$'; then
            echo "a binary imports vcomp140.dll"; exit 1
          fi
          rm -f vcomp140.dll

      - name: Build the wheel
        run: |
          set -euo pipefail
          cd packaging/engine-wheel
          python - "${WHEEL_VERSION}" <<'PY'
          import os, pathlib, re, sys
          p = pathlib.Path("pyproject.toml")
          text = re.sub(r'(?m)^version = ".*"$', f'version = "{sys.argv[1]}"', p.read_text(), count=1)
          # License-Expression in METADATA needs setuptools 77 or later; lilbee refuses a wheel without it.
          text = text.replace('requires = ["setuptools>=68"]', 'requires = ["setuptools>=77"]', 1)
          files = '["LICENSE-*", "NOTICE-*"]' if os.environ["BACKEND"] == "cuda" else '["LICENSE-*"]'
          text = text.replace('requires-python', 'license = "%s"\nlicense-files = %s\nrequires-python' % (os.environ["LICENSE_EXPRESSION"], files), 1)
          p.write_text(text)
          pin = "llama-cpp-{}+swap-{}+gguf-{}".format(
              os.environ["UPSTREAM_TAG"], os.environ["ENGINE_LLAMA_SWAP_VERSION"], os.environ["ENGINE_GGUF_PARSER_REF"])
          pathlib.Path("lilbee_engine_llama_cpp/pins.py").write_text(
              '"""Engine build identity; written by the llama-pack-cells workflow."""\n\nENGINE_PIN = "%s"\n' % pin)
          PY
          python -m pip install build wheel
          grep -E '^(license|license-files|requires)' pyproject.toml
          cat lilbee_engine_llama_cpp/pins.py
          python -m build --wheel -C--build-option="--build-number=1.${BACKEND}"
          python -m wheel tags --remove --platform-tag "${PLATFORM}" dist/*.whl
          ls dist

      - name: Repair the macOS wheel with delocate
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python -m pip install "delocate==0.13.0"
          # Fails when any Mach-O needs a newer macOS than the tag (macosx_14_0) allows.
          delocate-wheel --require-archs arm64 --require-target-macos-version 14.0 \
            -w repaired packaging/engine-wheel/dist/*.whl
          ls repaired
          for w in repaired/*.whl; do
            case "${w}" in *-macosx_14_0_arm64.whl) ;; *) echo "wrong tag on ${w}"; exit 1 ;; esac
            if python -m zipfile -l "${w}" | grep -q '\.dylibs/'; then echo "delocate grafted a library into ${w}"; exit 1; fi
          done

      - name: Collect the wheel
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${RUNNER_OS}" = macOS ]; then
            cp repaired/*.whl out/
          else
            cp packaging/engine-wheel/dist/*.whl out/
          fi
          wheels=(out/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          if command -v sha256sum >/dev/null; then
            (cd out && sha256sum "$(basename "${wheel}")" > "$(basename "${wheel}").sha256")
          else
            (cd out && shasum -a 256 "$(basename "${wheel}")" > "$(basename "${wheel}").sha256")
          fi
          cat out/*.sha256
          if [ "${BACKEND}" = rocm ]; then
            # The lists of gfx targets that the rocBLAS kernels in the pack cover.
            shopt -s nullglob
            for kernels in packaging/engine-wheel/lilbee_engine_llama_cpp/bin/rocblas/library/TensileLibrary_lazy_gfx*.dat; do
              name="${kernels##*/}"
              name="${name#TensileLibrary_lazy_}"
              echo "${name%.dat}"
            done | sort -u > out/lilbee-linux-x86_64-rocm.gfx.txt
            [ -s out/lilbee-linux-x86_64-rocm.gfx.txt ] || { echo "the pack carries no rocBLAS kernels"; exit 1; }
            cat out/lilbee-linux-x86_64-rocm.gfx.txt
          fi
          ls -l out

      - name: Start llama-server from the installed wheel
        run: |
          set -euo pipefail
          python -m venv check-venv
          if [ "${RUNNER_OS}" = Windows ]; then py=check-venv/Scripts/python.exe; else py=check-venv/bin/python; fi
          "${py}" -m pip install -q out/*.whl
          exe="$("${py}" -c "import lilbee_engine_llama_cpp as m; print(m.get_llama_server_path().as_posix())")"
          echo "llama-server: ${exe}"
          bindir="$(dirname "${exe}")"
          ls "${bindir}"
          for tool in llama-swap gguf-parser; do
            test -e "${bindir}/${tool}" -o -e "${bindir}/${tool}.exe" || { echo "wheel lacks ${tool}"; exit 1; }
          done
          if [ "${RUNNER_OS}" = Windows ]; then
            for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
              test -f "${bindir}/${dll}" || { echo "wheel lacks ${dll}"; exit 1; }
            done
          fi
          python -m zipfile -l out/*.whl | grep -E 'dist-info/(licenses/|METADATA)'
          unzip -p out/*.whl '*.dist-info/METADATA' | grep -x "License-Expression: ${LICENSE_EXPRESSION}"
          for lic in llama.cpp llama-swap gguf-parser; do
            unzip -l out/*.whl | grep -q "dist-info/licenses/LICENSE-${lic}$" || { echo "wheel lacks the ${lic} licence"; exit 1; }
          done
          if [ -f "${bindir}/libomp.dll" ]; then
            unzip -l out/*.whl | grep -q "dist-info/licenses/LICENSE-LLVM-OpenMP$" || { echo "wheel lacks the LLVM OpenMP licence"; exit 1; }
          fi
          if [ "${BACKEND}" = vulkan ]; then
            if [ "${RUNNER_OS}" = Windows ]; then
              test -f "${bindir}/ggml-vulkan.dll"
            else
              test -f "${bindir}/libggml-vulkan.so"
              test "$(find "${bindir}" -name 'libggml-cpu-*.so' | wc -l)" -ge 2
              if find "${bindir}" -name 'libvulkan*' | grep .; then echo "the Vulkan loader must stay with the host"; exit 1; fi
              if ldd "${bindir}/llama-server" | grep 'not found'; then echo "llama-server has an unresolved library"; exit 1; fi
              bash "${GITHUB_WORKSPACE}/tools/wheel-build/check_glibc_floor.sh" "${bindir}"
            fi
          fi
          if [ "${BACKEND}" = rocm ]; then
            test -f "${bindir}/libggml-hip.so"
            test -d "${bindir}/rocblas/library"
            test "$(find "${bindir}" -name 'libggml-cpu-*.so' | wc -l)" -ge 2
            for lic in hsa-rocr comgr hip-runtime-amd rocblas hipblas hipblaslt rocm-llvm; do
              unzip -l out/*.whl | grep -q "dist-info/licenses/LICENSE-ROCm-${lic}$" || { echo "wheel lacks the ${lic} licence"; exit 1; }
            done
            if ldd "${bindir}/llama-server" | grep 'not found'; then echo "llama-server has an unresolved library"; exit 1; fi
            bash "${GITHUB_WORKSPACE}/tools/wheel-build/check_glibc_floor.sh" "${bindir}"
            # A clean container names exactly the six host libraries; with them installed, everything resolves.
            bash "${GITHUB_WORKSPACE}/tools/qa/assert_rocm_host_libs.sh" "${bindir}"
            bash "${GITHUB_WORKSPACE}/tools/qa/assert_rocm_bundle_loads.sh" "${bindir}"
          fi
          if [ "${BACKEND}" = cuda ]; then
            unzip -l out/*.whl | grep -q "dist-info/licenses/NOTICE-NVIDIA-CUDA$" || { echo "wheel lacks the NVIDIA notice"; exit 1; }
            if [ "${RUNNER_OS}" = Windows ]; then
              for dll in ggml-cuda.dll cudart64_12.dll cublas64_12.dll cublasLt64_12.dll; do
                test -f "${bindir}/${dll}" || { echo "wheel lacks ${dll}"; exit 1; }
              done
            else
              # The NVIDIA files must match the toolkit's files byte for byte (EULA 2.3).
              (cd "${bindir}" && sha256sum -c "${OLDPWD}/cuda-libs.sha256")
              test -f "${bindir}/libggml-cuda.so"
              test "$(find "${bindir}" -name 'libggml-cpu-*.so' | wc -l)" -ge 2
              if ldd "${bindir}/llama-server" | grep 'not found'; then echo "llama-server has an unresolved library"; exit 1; fi
            fi
          fi
          if [ "${RUNNER_OS}" = macOS ]; then
            # Every library that a binary loads by @rpath or @loader_path must be a file beside it.
            missing=0
            for f in "${bindir}"/*; do
              file "${f}" | grep -q 'Mach-O' || continue
              for name in $(otool -L "${f}" | awk 'NR > 1 && $1 ~ /^@(rpath|loader_path)\// {n = split($1, a, "/"); print a[n]}'); do
                test -f "${bindir}/${name}" || { echo "${f##*/} loads ${name}: missing"; missing=1; }
              done
            done
            test "${missing}" -eq 0
            find "${bindir}" -type l | grep . && { echo "unexpected symlink"; exit 1; }
            du -sk "${bindir}"
          fi
          cd /
          "${exe}" --version
          case "${BACKEND}" in cuda | vulkan | rocm) "${exe}" --list-devices ;; esac

      - uses: actions/upload-artifact@v7
        with:
          name: llama-pack-${{ matrix.cell }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
