name: Release candidate

# Tag push (v*): build every release artifact ONCE -- default wheels + sdist,
# CUDA/Intel-Mac extra wheels, the standalone executables -- attach the
# executables to a GH pre-release, run the QA matrix against the default wheels
# + executables (the extra-wheels matrix runs in parallel and never delays QA).
# Dispatch: same build + QA, no release attach. Publishing to PyPI is a
# separate manual step that just downloads this run's artifacts -- see
# publish-pypi.yml; nothing downstream rebuilds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build a release candidate from (defaults to current ref)."
        required: false
        default: ""
      skip_tests:
        description: "Build the executables even if release.yml's test job fails (re-run past a known-flaky test)."
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Compute version + tag from pyproject.toml
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ -z "${VERSION}" ]; then
            echo "could not parse version from pyproject.toml" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "push" ]; then
            TAG="${REF_NAME}"
            REF="${GITHUB_REF}"
            # Sanity: tag should match pyproject.toml version (allow with-or-without 'v').
            if [ "${TAG}" != "v${VERSION}" ] && [ "${TAG}" != "${VERSION}" ]; then
              echo "tag ${TAG} does not match pyproject.toml version ${VERSION}" >&2
              exit 1
            fi
          else
            TAG="v${VERSION}"
            REF="${INPUT_REF:-${GITHUB_REF}}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "ref=${REF}"
          } >> "$GITHUB_OUTPUT"

  build-default-wheels:
    needs: [resolve]
    uses: ./.github/workflows/build-default-wheels.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  build-extra-wheels:
    needs: [resolve]
    uses: ./.github/workflows/build-extra-wheels.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  build-binaries:
    needs: [resolve]
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      skip_tests: ${{ inputs.skip_tests || false }}
    secrets: inherit

  # Attach binaries to a GH pre-release as soon as they're built, before QA
  # runs. A GH release is reversible (delete + retag) so this is safe to do
  # eagerly; the irreversible step (PyPI) waits for a human to run
  # publish-pypi.yml after reviewing QA.
  attach-binaries-prerelease:
    needs: [resolve, build-binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: ./.github/actions/attach-prerelease
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          version: ${{ needs.resolve.outputs.version }}

  # QA consumes this run's default wheels + executables (by run id). It does NOT
  # need build-extra-wheels, so the CUDA matrix can chug along without holding QA up.
  qa:
    needs: [resolve, build-default-wheels, build-binaries]
    uses: ./.github/workflows/qa-matrix.yml
    with:
      wheel_run_id: ${{ github.run_id }}
      binary_run_id: ${{ github.run_id }}
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  # PyPI publish is intentionally NOT here. Run publish-pypi.yml manually after
  # reviewing the pre-release + QA -- it just downloads this run's artifacts.
