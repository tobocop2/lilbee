name: Release candidate

# Tag push: build + QA + auto-promote on green. Dispatch: build + QA dry-run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build a release candidate from (defaults to current ref)."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Compute version + tag from pyproject.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ -z "${VERSION}" ]; then
            echo "could not parse version from pyproject.toml" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            REF="${{ github.ref }}"
            # Sanity: tag should match pyproject.toml version (allow with-or-without 'v').
            if [ "${TAG}" != "v${VERSION}" ] && [ "${TAG}" != "${VERSION}" ]; then
              echo "tag ${TAG} does not match pyproject.toml version ${VERSION}" >&2
              exit 1
            fi
          else
            TAG="v${VERSION}"
            REF="${{ inputs.ref || github.ref }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

  build-wheels:
    needs: [resolve]
    uses: ./.github/workflows/build-wheels.yml
    with:
      publish: false
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  build-binaries:
    needs: [resolve]
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  # Attach binaries to a GH pre-release as soon as they're built, before
  # QA runs. PyPI publish is gated on QA green (see promote-pypi below)
  # because PyPI is immutable; a GH release is reversible (delete + retag).
  attach-binaries-prerelease:
    needs: [resolve, build-binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lilbee-*
          path: bins/
          merge-multiple: true

      - name: List binary artifacts
        shell: bash
        run: ls -lh bins/

      # generate_release_notes pulls commit messages since the previous
      # tag; the published notes can be overwritten with `gh release edit`
      # after the run completes if a hand-written body is preferred.
      # prerelease=true on any PEP 440 a/b/rc segment so the GH UI badges
      # them correctly and they stay off the "Latest release" surface.
      - name: Create GH pre-release with binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: bins/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.resolve.outputs.version, 'a') || contains(needs.resolve.outputs.version, 'b') || contains(needs.resolve.outputs.version, 'rc') }}

  qa:
    needs: [resolve, build-wheels, build-binaries]
    uses: ./.github/workflows/qa-matrix.yml
    with:
      wheel_run_id: ${{ github.run_id }}
      binary_run_id: ${{ github.run_id }}
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  # PyPI publish + downstream packaging only run after QA passes. By this
  # point the GH pre-release with binaries is already public, so users
  # exploring a release candidate can pull the executables before PyPI
  # is updated. If QA fails, this job is skipped, the pre-release stays
  # but no PyPI version is created (and can be retracted manually).
  promote-pypi-and-packaging:
    needs: [resolve, qa, attach-binaries-prerelease]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-default-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Stage wheels + sdist for PyPI
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Manually fan out to downstream packaging. The workflow_run trigger
      # on publish-docker.yml + publish-packages.yml is gated to
      # event == 'release' so workflow_call invocations of build-wheels.yml /
      # release.yml above do not auto-fire them; this step is the equivalent
      # kick-off after PyPI is live.
      - name: Trigger Publish Docker Image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-docker.yml \
            --repo ${{ github.repository }} \
            -f tag=${{ needs.resolve.outputs.tag }}

      - name: Trigger Publish Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-packages.yml \
            --repo ${{ github.repository }} \
            -f tag=${{ needs.resolve.outputs.tag }}
