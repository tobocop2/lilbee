name: Release candidate

# Tag push (v*): build every release artifact ONCE -- default wheels + sdist,
# CUDA/Intel-Mac extra wheels, the standalone executables -- and attach the
# executables to a GH pre-release. Dispatch: same build, no release attach.
# The QA matrix runs on demand via qa-matrix.yml; it is no longer gated to
# this workflow so a flaky TUI test on one platform can't strand the wheel
# indexes or the downstream publish. Publishing to PyPI is a separate manual
# step that just downloads this run's artifacts -- see publish.yml; nothing
# downstream rebuilds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build a release candidate from (defaults to current ref)."
        required: false
        default: ""
      skip_tests:
        description: "Build the executables even if release.yml's test job fails (re-run past a known-flaky test)."
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Compute version + tag from pyproject.toml
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ -z "${VERSION}" ]; then
            echo "could not parse version from pyproject.toml" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "push" ]; then
            TAG="${REF_NAME}"
            REF="${GITHUB_REF}"
            # Sanity: tag should match pyproject.toml version (allow with-or-without 'v').
            if [ "${TAG}" != "v${VERSION}" ] && [ "${TAG}" != "${VERSION}" ]; then
              echo "tag ${TAG} does not match pyproject.toml version ${VERSION}" >&2
              exit 1
            fi
          else
            TAG="v${VERSION}"
            REF="${INPUT_REF:-${GITHUB_REF}}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "ref=${REF}"
          } >> "$GITHUB_OUTPUT"

  build-default-wheels:
    needs: [resolve]
    uses: ./.github/workflows/build-default-wheels.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  build-extra-wheels:
    needs: [resolve]
    uses: ./.github/workflows/build-extra-wheels.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  build-binaries:
    needs: [resolve]
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      skip_tests: ${{ inputs.skip_tests || false }}
    secrets: inherit

  build-cuda:
    needs: [resolve]
    uses: ./.github/workflows/build-cuda-executables.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      skip_tests: ${{ inputs.skip_tests || false }}
    secrets: inherit

  # Attach this run's executables AND every wheel to a GH pre-release. The
  # wheels live on the release page because GitHub Pages has a 1 GB per-deploy
  # cap that the full default + extra wheel set (~6 GB) blows through; the
  # PEP 503 index at lilbee.sh/<backend>/lilbee/ now links to these release
  # asset URLs instead of trying to host the wheels itself. A GH release is
  # reversible (delete + retag) so this is safe to do eagerly; the
  # irreversible step (PyPI) waits for a human to run publish.yml.
  attach-prerelease:
    needs: [resolve, build-default-wheels, build-extra-wheels, build-binaries, build-cuda]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: ./.github/actions/attach-prerelease
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          version: ${{ needs.resolve.outputs.version }}

  # QA is decoupled from the RC. Run qa-matrix.yml on demand (workflow_dispatch
  # with this run's id passed as wheel_run_id / binary_run_id) when you want
  # to validate a candidate against the full QA grid.

  # Auto-dispatch publish.yml the moment default wheels + sdist are built.
  dispatch-publish:
    needs: [resolve, build-default-wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh workflow run publish.yml --repo "${REPO}" -f tag="${TAG}"

  # Auto-dispatch Docker / Homebrew / AUR / Nix once executables + wheels are
  # on the GH pre-release.
  dispatch-fanout:
    needs: [resolve, attach-prerelease]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/fanout-packaging
        with:
          tag: ${{ needs.resolve.outputs.tag }}

  # Auto-dispatch the CUDA packaging fan-out once cu125 is on the release.
  dispatch-cuda:
    needs: [resolve, attach-prerelease]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh workflow run publish-cuda-packages.yml --repo "${REPO}" -f tag="${TAG}"

  # Supplementary opt-in lilbee[multi-gpu] artifacts on their OWN path. Fully
  # decoupled: not in attach-prerelease's needs and not gating dispatch-publish,
  # so a failure here never blocks the release. Builds are continue-on-error.
  build-multigpu:
    needs: [resolve]
    uses: ./.github/workflows/build-multigpu.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  attach-multigpu:
    needs: [resolve, build-multigpu]
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - name: Download multi-gpu wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-multigpu-*
          path: multigpu-wheels-staging/
      - name: Download standalone server binaries
        uses: actions/download-artifact@v4
        with:
          pattern: multigpu-exe-*
          path: multigpu-bins/
          merge-multiple: true
      - name: Disambiguate same-platform wheels with a backend build tag
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          out = pathlib.Path("multigpu-wheels")
          out.mkdir(exist_ok=True)
          for d in pathlib.Path("multigpu-wheels-staging").glob("wheel-multigpu-*"):
              backend = d.name.rsplit("-", 1)[-1]
              for whl in d.glob("*.whl"):
                  name, ver, rest = whl.name.split("-", 2)
                  shutil.copy(whl, out / f"{name}-{ver}-1.{backend}-{rest}")
          PY
      - name: Attach multi-gpu wheels and binaries to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: |
            multigpu-wheels/*
            multigpu-bins/*
          prerelease: ${{ contains(needs.resolve.outputs.version, 'a') || contains(needs.resolve.outputs.version, 'b') || contains(needs.resolve.outputs.version, 'rc') }}
