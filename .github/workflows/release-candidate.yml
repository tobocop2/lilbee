name: Release candidate

# Tag push (v*): build every release artifact ONCE -- default wheels + sdist,
# multi-GPU engine builds, the standalone executables -- and attach the
# executables to a GH pre-release. Dispatch: same build, no release attach.
# The QA matrix runs on demand via qa-matrix.yml; it is no longer gated to
# this workflow so a flaky TUI test on one platform can't strand the wheel
# indexes or the downstream publish. publish.yml (PyPI) is auto-dispatched
# once every artifact is attached and the wheel smoke passes; it just
# downloads this run's artifacts, nothing downstream rebuilds. Promotion to
# latest stays gated behind verify-release.yml (see make release-promote).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build a release candidate from (defaults to current ref)."
        required: false
        default: ""
      skip_tests:
        description: "Build the executables even if release.yml's test job fails (re-run past a known-flaky test)."
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ref: ${{ steps.ver.outputs.ref }}
      promoted_from: ${{ steps.promo.outputs.promoted_from }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 2   # promotion detection diffs against the parent commit
      - name: Compute version + tag from pyproject.toml
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ -z "${VERSION}" ]; then
            echo "could not parse version from pyproject.toml" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "push" ]; then
            TAG="${REF_NAME}"
            REF="${GITHUB_REF}"
            # Sanity: tag should match pyproject.toml version (allow with-or-without 'v').
            if [ "${TAG}" != "v${VERSION}" ] && [ "${TAG}" != "${VERSION}" ]; then
              echo "tag ${TAG} does not match pyproject.toml version ${VERSION}" >&2
              exit 1
            fi
          else
            TAG="v${VERSION}"
            REF="${INPUT_REF:-${GITHUB_REF}}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "ref=${REF}"
          } >> "$GITHUB_OUTPUT"

      # A promotion (scripts/promote_release.sh, `make promote`) is a tag whose
      # parent commit is itself a v* tag and whose only change is the version
      # line in pyproject.toml + uv.lock: the same source re-released under a
      # new version. Detected semantically rather than declared, so it can't be
      # spoofed by a commit message; a tag with any other change is a normal
      # release. create-prerelease uses this to carry the source release's
      # notes over.
      - name: Detect same-source promotion
        id: promo
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          promoted_from=""
          parent=$(git rev-parse -q --verify HEAD^ 2>/dev/null || echo "")
          if [ -n "${parent}" ]; then
            # ls-remote instead of fetching all tags; strip annotated-tag ^{} peels.
            from_tag=$(git ls-remote --tags origin \
              | awk -v sha="${parent}" '$1 == sha && $2 ~ /^refs\/tags\/v/ && $2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2; exit }')
            if [ -n "${from_tag}" ] && [ "${from_tag}" != "${TAG}" ] \
              && git diff --quiet HEAD^ HEAD -- . ':(exclude)pyproject.toml' ':(exclude)uv.lock'; then
              promoted_from="${from_tag}"
              echo "${TAG} is a same-source promotion of ${from_tag}"
            fi
          fi
          echo "promoted_from=${promoted_from}" >> "$GITHUB_OUTPUT"

  # Fast fail-first gate: lock consistency, lint, and formatting in a few
  # minutes, so a trivial breakage never burns hours of the executable matrix
  # before surfacing. release.yml still runs its full gate (with tests) behind
  # this for the binaries themselves.
  checks:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: make lint
      - run: make format-check

  build-default-wheels:
    needs: [resolve, create-prerelease]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.create-prerelease.result != 'failure' }}
    uses: ./.github/workflows/build-default-wheels.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      release_tag: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && needs.resolve.outputs.tag || '' }}
    secrets: inherit

  # Pre-release shell created up front so every build job can attach its
  # asset the moment it builds instead of waiting for the slowest cell.
  # A promoted tag starts with the source release's notes under a promotion
  # banner (the source release itself is never modified); attach-prerelease
  # skips note generation so the copied notes survive.
  create-prerelease:
    needs: [resolve]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPO: ${{ github.repository }}
          PROMOTED_FROM: ${{ needs.resolve.outputs.promoted_from }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && exit 0
          notes=$(mktemp)
          if [ -n "$PROMOTED_FROM" ] \
            && gh release view "$PROMOTED_FROM" --repo "$REPO" --json body -q .body > "${notes}.src" 2>/dev/null; then
            {
              echo "Promoted from [${PROMOTED_FROM}](https://github.com/${REPO}/releases/tag/${PROMOTED_FROM}): the same source, released as ${VERSION}."
              echo
              cat "${notes}.src"
            } > "$notes"
          else
            echo "Release candidate building; executables attach here as each one finishes." > "$notes"
          fi
          gh release create "$TAG" --repo "$REPO" --prerelease --notes-file "$notes"

  build-binaries:
    needs: [resolve, create-prerelease]
    # create-prerelease is skipped on workflow_dispatch; only a real failure blocks.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.create-prerelease.result != 'failure' }}
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      skip_tests: ${{ inputs.skip_tests || false }}
      release_tag: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && needs.resolve.outputs.tag || '' }}
    secrets: inherit

  build-cuda:
    # Gated on checks: these are the longest cells (nvcc + Nuitka, hours each)
    # and have no internal lint gate of their own.
    needs: [resolve, create-prerelease, checks]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.checks.result == 'success' && needs.create-prerelease.result != 'failure' }}
    uses: ./.github/workflows/build-cuda-executables.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      skip_tests: ${{ inputs.skip_tests || false }}
      release_tag: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && needs.resolve.outputs.tag || '' }}
    secrets: inherit

  # Attach this run's executables AND the lilbee wheel + sdist to a GH
  # pre-release. (The per-backend engine wheels are attached separately by
  # attach-multigpu.) The PEP 503 index at lilbee.sh/<backend>/ links to those
  # release asset URLs rather than hosting multi-gigabyte wheels itself. A GH
  # release is reversible (delete + retag) so this is safe to do eagerly; the
  # irreversible step (PyPI) waits for a human to run publish.yml.
  attach-prerelease:
    needs: [resolve, build-default-wheels, build-binaries, build-cuda]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: ./.github/actions/attach-prerelease
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          version: ${{ needs.resolve.outputs.version }}
          # Promoted tags keep the notes create-prerelease copied over.
          generate-notes: ${{ needs.resolve.outputs.promoted_from == '' }}

  # QA is decoupled from the RC. Run qa-matrix.yml on demand (workflow_dispatch
  # with this run's id passed as wheel_run_id / binary_run_id) when you want
  # to validate a candidate against the full QA grid.

  # PyPI-channel gate: install the built lilbee wheel plus the cpu engine wheel
  # exactly like a pip user would, then run the core-functionality sweep
  # (engine inference, ingest, search, ask, crawl) against the installed tree.
  smoke-wheels:
    needs: [resolve, build-default-wheels, build-multigpu]
    if: ${{ !cancelled() && needs.build-default-wheels.result == 'success' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - name: Download the default wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-default
          path: wheels/
      - name: Download the cpu engine wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-multigpu-${{ matrix.os }}-cpu
          path: engine/
      - name: Restore CI models (inference smoke)
        uses: ./.github/actions/restore-ci-models
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the wheels and run the sweep
        shell: bash
        run: |
          set -euxo pipefail
          python -m venv smoke-venv
          bin="smoke-venv/bin"
          [ -d "smoke-venv/Scripts" ] && bin="smoke-venv/Scripts"
          lilbee_whls=(wheels/lilbee-*.whl); lilbee_whl="${lilbee_whls[0]}"
          engine_whls=(engine/lilbee_engine-*.whl); engine_whl="${engine_whls[0]}"
          [ -f "${lilbee_whl}" ] || { echo "no lilbee wheel in wheels/" >&2; ls -la wheels/; exit 1; }
          [ -f "${engine_whl}" ] || { echo "no engine wheel in engine/" >&2; ls -la engine/; exit 1; }
          # Install the engine wheel first, then the lilbee wheel with its
          # crawler extra straight off the built file; the extra's own deps
          # (crawl4ai etc.) resolve from PyPI.
          "${bin}/pip" install "${engine_whl}"
          "${bin}/pip" install "${lilbee_whl}[crawler]"
          LILBEE_EXE="${bin}/lilbee" bash tools/qa/artifact_smoke.sh

  # Auto-dispatch publish.yml once every core artifact is attached to the
  # release AND the pip-install story is verified end to end. Dispatching
  # earlier (on wheels alone) raced the executable cells and made publish.yml's
  # guard refuse a half-attached release.
  dispatch-publish:
    needs: [resolve, attach-prerelease, smoke-wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh workflow run publish.yml --repo "${REPO}" -f tag="${TAG}"

  # Auto-dispatch Docker / Homebrew / AUR / Nix once executables + wheels are
  # on the GH pre-release.
  dispatch-fanout:
    needs: [resolve, attach-prerelease]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fanout-packaging
        with:
          tag: ${{ needs.resolve.outputs.tag }}

  # Auto-dispatch the CUDA packaging fan-out once cu125 is on the release.
  dispatch-cuda:
    needs: [resolve, attach-prerelease]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh workflow run publish-cuda-packages.yml --repo "${REPO}" -f tag="${TAG}"

  # Supplementary opt-in lilbee[multi-gpu] artifacts on their OWN path. Fully
  # decoupled: not in attach-prerelease's needs and not gating dispatch-publish,
  # so a failure here never blocks the release. Builds are continue-on-error.
  build-multigpu:
    needs: [resolve]
    uses: ./.github/workflows/build-multigpu.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  attach-multigpu:
    needs: [resolve, build-multigpu]
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - name: Download multi-gpu wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-multigpu-*
          path: multigpu-wheels-staging/
      - name: Disambiguate same-platform wheels with a backend build tag
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          out = pathlib.Path("multigpu-wheels")
          out.mkdir(exist_ok=True)
          for d in pathlib.Path("multigpu-wheels-staging").glob("wheel-multigpu-*"):
              backend = d.name.rsplit("-", 1)[-1]
              for whl in d.glob("*.whl"):
                  name, ver, rest = whl.name.split("-", 2)
                  shutil.copy(whl, out / f"{name}-{ver}-1.{backend}-{rest}")
          PY
      - name: Attach multi-gpu wheels to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: multigpu-wheels/*
          prerelease: ${{ contains(needs.resolve.outputs.version, 'a') || contains(needs.resolve.outputs.version, 'b') || contains(needs.resolve.outputs.version, 'rc') }}
