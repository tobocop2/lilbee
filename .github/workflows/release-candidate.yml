name: Release candidate

# Pre-publish QA orchestrator. Builds the same wheels and binaries that
# would ship to PyPI / a GitHub release, runs the QA matrix against those
# artifacts, and only then promotes them to the public lanes.
#
# Tag push (`git push v0.6.66bN`) builds + QAs + auto-promotes on green.
# workflow_dispatch builds + QAs only — useful for branch / SHA dry-runs
# before tagging. The emergency-publish.yml workflow is the QA-bypass lane.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build a release candidate from (defaults to current ref)."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Compute version + tag from pyproject.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ -z "${VERSION}" ]; then
            echo "could not parse version from pyproject.toml" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            REF="${{ github.ref }}"
            # Sanity: tag should match pyproject.toml version (allow with-or-without 'v').
            if [ "${TAG}" != "v${VERSION}" ] && [ "${TAG}" != "${VERSION}" ]; then
              echo "tag ${TAG} does not match pyproject.toml version ${VERSION}" >&2
              exit 1
            fi
          else
            TAG="v${VERSION}"
            REF="${{ inputs.ref || github.ref }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

  build-wheels:
    needs: [resolve]
    uses: ./.github/workflows/build-wheels.yml
    with:
      publish: false
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  build-binaries:
    needs: [resolve]
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      ref: ${{ needs.resolve.outputs.ref }}
    secrets: inherit

  qa:
    needs: [resolve, build-wheels, build-binaries]
    uses: ./.github/workflows/qa-matrix.yml
    with:
      wheel_run_id: ${{ github.run_id }}
      binary_run_id: ${{ github.run_id }}
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  promote:
    needs: [resolve, qa]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-default-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Stage wheels + sdist for PyPI
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lilbee-*
          path: bins/
          merge-multiple: true

      - name: List binary artifacts
        shell: bash
        run: ls -lh bins/

      # generate_release_notes pulls commit messages since the previous
      # tag; keeps the release page populated without us hand-writing notes.
      # prerelease=true for any PEP 440 a/b/rc segment so the GH UI badges
      # them correctly and they stay off the "Latest release" surface.
      - name: Create GH release with binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: bins/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.resolve.outputs.version, 'a') || contains(needs.resolve.outputs.version, 'b') || contains(needs.resolve.outputs.version, 'rc') }}

      # Manually fan out to the downstream packaging workflows. Their
      # workflow_run trigger is gated to `event == 'release'` so the
      # workflow_call invocations of build-wheels.yml / release.yml above
      # do not auto-fire them; this step is the equivalent kick-off.
      - name: Trigger Publish Docker Image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-docker.yml \
            --repo ${{ github.repository }} \
            -f tag=${{ needs.resolve.outputs.tag }}

      - name: Trigger Publish Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-packages.yml \
            --repo ${{ github.repository }} \
            -f tag=${{ needs.resolve.outputs.tag }}
