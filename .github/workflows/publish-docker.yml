name: Publish Docker Image

# Dispatched by promote.yml (and by hand) once the tag's binaries are attached
# to its GH release. Always pushes the version-pinned tags; the moving tag it
# also pushes comes from the channel: dev -> :dev/:dev-cuda, beta ->
# :beta/:beta-cuda, stable -> :latest/:cuda. Same image bits either way --
# promotion just adds a pointer.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. v0.6.91)."
        required: true
      channel:
        description: "Channel the tag is being published to; picks the moving docker tag."
        required: false
        type: choice
        options: [dev, beta, stable]
        default: stable

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ inputs.tag }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and channel tags
        id: info
        env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$CHANNEL" in
            stable) echo "alias_cpu=latest" >> "$GITHUB_OUTPUT"; echo "alias_cuda=cuda" >> "$GITHUB_OUTPUT" ;;
            *)      echo "alias_cpu=${CHANNEL}" >> "$GITHUB_OUTPUT"; echo "alias_cuda=${CHANNEL}-cuda" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: packaging/docker
          file: packaging/docker/Dockerfile
          build-args: |
            LILBEE_VERSION=${{ steps.info.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lilbee:${{ steps.info.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lilbee:${{ steps.info.outputs.alias_cpu }}
          push: true

      - name: Build & push CUDA image
        uses: docker/build-push-action@v7
        with:
          context: packaging/docker
          file: packaging/docker/Dockerfile.cuda
          build-args: |
            LILBEE_VERSION=${{ steps.info.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lilbee:${{ steps.info.outputs.version }}-cuda
            ghcr.io/${{ github.repository_owner }}/lilbee:${{ steps.info.outputs.alias_cuda }}
          push: true
