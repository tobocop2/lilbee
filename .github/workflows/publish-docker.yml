name: Publish Docker Image

# Dispatched by the publish & emergency-publish workflows (and by hand) once
# the tag's binaries are attached to its GH release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. v0.6.66b469)."
        required: true

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from tag
        id: info
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: packaging/docker
          file: packaging/docker/Dockerfile
          build-args: |
            LILBEE_VERSION=${{ steps.info.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lilbee:${{ steps.info.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lilbee:latest
          push: true

      - name: Build & push CUDA image
        uses: docker/build-push-action@v7
        with:
          context: packaging/docker
          file: packaging/docker/Dockerfile.cuda
          build-args: |
            LILBEE_VERSION=${{ steps.info.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lilbee:${{ steps.info.outputs.version }}-cuda
            ghcr.io/${{ github.repository_owner }}/lilbee:cuda
          push: true
