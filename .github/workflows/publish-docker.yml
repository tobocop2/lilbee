name: Publish Docker Image

on:
  workflow_run:
    workflows: ["Build Platform Wheels"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. v0.6.66b456)"
        required: true

jobs:
  docker:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: info
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="${{ github.event.workflow_run.head_branch }}"
          else
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: packaging/docker
          file: packaging/docker/Dockerfile
          build-args: |
            LILBEE_VERSION=${{ steps.info.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lilbee:${{ steps.info.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lilbee:latest
          push: true
