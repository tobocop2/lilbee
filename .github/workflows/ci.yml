name: CI

# Probe branch only: the Windows unit suite, as CI runs it on Python 3.13, at the head of
# fix/winci-timer, with the Windows coverage config and its 100% gate.
on:
  push:
    branches: [probe/wintimer]
  pull_request:
  workflow_dispatch:

jobs:
  probe-wintimer-suite:
    timeout-minutes: 120
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e30d5810c24a56820b82b423f40aaae9cabd6b02

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - uses: ./.github/actions/checkout-engine-packs

      - name: Install make
        shell: bash
        run: bash scripts/ci_retry.sh 3 choco install make -y

      - name: Install dependencies
        run: uv sync --locked --python 3.13

      - name: Run unit tests
        shell: bash
        run: |
          echo "SUITE-HEAD $(git rev-parse HEAD)"
          make test-ci COV_FLAGS="--cov-config=.coveragerc-windows" BRANCH_CHECK=true
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee
          LILBEE_TEST_HANG_DUMP_DIR: ${{ runner.temp }}/hang-dumps
