name: CI

# Probe branch only: one Windows job that runs the Ctrl+C wakeup probe and the failing test.
on:
  pull_request:
  workflow_dispatch:

jobs:
  probe-winctrlc:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - uses: ./.github/actions/checkout-engine-packs

      - name: Install dependencies
        run: uv sync --locked

      - name: Probe
        shell: bash
        continue-on-error: true
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee
        run: uv run pytest -s -v -p no:xdist tests/test_probe_winctrlc.py

      - name: The failing test
        shell: bash
        continue-on-error: true
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee
        run: uv run pytest -s -v -p no:xdist "tests/test_cli.py::TestSyncCancelledExit::test_ctrl_c_at_any_stage_of_an_add_follows_one_rule[planning]"
