name: CI

# Full CI only runs when the app, its tests, or their toolchain change;
# docs/site edits skip it. release.yml re-runs lint+test itself when a tag
# has no green CI run, so a skipped push never strands a release.
on:
  push:
    branches: [main]
    paths: &ci-paths
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.coveragerc-windows'
      - 'engine-versions.env'
      - 'scripts/check_style_rules.py'
      - 'tools/qa/**'
      - 'tools/wheel-build/**'
      - 'packaging/tools/**'
      - 'scripts/qa/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/restore-ci-models/**'
  pull_request:
    paths: *ci-paths
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Check imports resolve
        run: make imports-check

  # Seeded TUI fuzz: fixed seeds, deterministic, fails on any invariant break.
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Fuzz the TUI (smoke tier)
        run: make fuzz-smoke

  test:
    # Bumped from 60 to 120: Windows 3.11 runs the suite serially (no
    # xdist) to dodge reactive-timing flakes, which exceeds 60 min. All
    # other matrix entries finish well under the original budget.
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # macOS 3.11 still doesn't work even under pytest-forked: every
          # Textual app.run_test() under fork() SIGSEGVs because forking
          # a multi-threaded Cocoa-linked process is unsafe on macOS. Linux
          # fork is fine, so ubuntu 3.11 stays restored. 3.11 coverage on
          # macOS would need a spawn-per-test runner, which doesn't exist
          # in the pytest ecosystem today.
          - os: macos-latest
            python-version: "3.11"
          # Windows 3.11 hangs under pytest-xdist (ProactorEventLoop +
          # reactive-timing scheduler thread-accumulation wedge), so the
          # only reliable path was serial -p no:xdist, which pushes the
          # job past 60 minutes wall-clock. 3.12 and 3.13 still own the
          # Windows coverage story; re-enable once 3.11 reaches end-of-life
          # or asyncio's Windows transport teardown is patched upstream.
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        # ubuntu and macOS on 3.11 hang under pytest-xdist near the end of
        # the run, so they run with pytest-forked (one subprocess per
        # test, distributed across -n auto xdist workers) to sidestep the
        # thread-accumulation wedge. That path loses coverage because
        # forks exit via os._exit, skipping coverage.py's atexit save —
        # accepted tradeoff: 3.11 lanes prove the code runs, 3.12 and
        # 3.13 own the coverage story. Windows 3.11 is excluded above.
        # Windows measures with .coveragerc-windows: same 100% gate, minus the
        # two POSIX-only modules the Linux/macOS lanes already hold at 100%.
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            make test-ci-forked
          elif [ "${{ runner.os }}" = "Windows" ]; then
            make test-ci COV_FLAGS="--cov-config=.coveragerc-windows"
          else
            make test-ci
          fi
        shell: bash
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee
          # Backstop for the xdist worker wedge (ProactorEventLoop /
          # reactive-timing thread-accumulation), which pytest-timeout's thread
          # method cannot break on Windows: its callback is Python and never runs
          # while the GIL is held. Above the 60s per-test pytest-timeout so this
          # only fires when that fails; faulthandler's C watchdog dumps every
          # thread and _exits the worker, so a wedge fails fast with a traceback
          # instead of hanging to timeout-minutes. See tests/_hang_watchdog.py.
          LILBEE_TEST_HANG_DUMP_S: "90"
          LILBEE_TEST_HANG_DUMP_DIR: ${{ runner.temp }}/hang-dumps

      - name: Surface hang-watchdog stack dumps
        # Runs even when the test step failed/was killed: the wedged worker
        # cannot print its own dump. Empty dirs/files mean no wedge fired.
        if: always()
        shell: bash
        run: |
          dir="${{ runner.temp }}/hang-dumps"
          found=""
          for f in "$dir"/hang-*.txt; do
            [ -s "$f" ] || continue
            found=1
            echo "===== $f ====="
            cat "$f"
          done
          [ -n "$found" ] || echo "no hang-watchdog dumps (no worker wedged)"

  integration:
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    # Authenticate HF API + model downloads so the runner's shared IP doesn't
    # hit the unauthenticated rate limit (429) on the featured-model sweep.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Pin ollama instead of installing latest every run. The warm-up
      # ('ollama run qwen3:0.6b') intermittently segfaults in ollama's own
      # runner on the unpinned latest (0.32.x); pin to the last 0.31 stable so
      # the version stops drifting and a bad release can't land mid-run. Bump
      # deliberately after checking a release is stable.
      OLLAMA_PIN: "0.31.2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Integration tests run real local inference, which now means a real
      # llama-server. The lilbee-engine wheel ships empty bin/ in this lane
      # (CI fills it only in the release wheel build), so download a prebuilt
      # llama.cpp release binary; resolve_llama_server() finds it on PATH.
      - name: Install llama-server (engine)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned: releases/latest can ship partial asset sets (b9352 dropped
          # the x64/windows builds). Bump to a tag carrying all three platforms.
          LLAMA_CPP_TAG: b9351
        run: |
          set -euxo pipefail
          # Anchored to the suffix: ubuntu/macos ship .tar.gz, windows .zip, and
          # the bare -x64/-arm64 names must not match the vulkan/kleidiai variants.
          case "${{ runner.os }}" in
            Linux)   pat="bin-ubuntu-x64.tar.gz$" ;;
            macOS)   pat="bin-macos-arm64.tar.gz$" ;;
            Windows) pat="bin-win-cpu-x64.zip$" ;;
          esac
          url=$(gh api "repos/ggml-org/llama.cpp/releases/tags/${LLAMA_CPP_TAG}" \
            --jq ".assets[] | select(.name | test(\"${pat}\")) | .browser_download_url" | head -1)
          [ -n "${url}" ] || { echo "no llama.cpp ${LLAMA_CPP_TAG} asset matching ${pat}" >&2; exit 1; }
          mkdir -p "${HOME}/llama-engine"
          case "${url}" in
            *.zip)    curl -fsSL "${url}" -o engine.zip && unzip -q engine.zip -d "${HOME}/llama-engine" ;;
            *.tar.gz) curl -fsSL "${url}" | tar -xz -C "${HOME}/llama-engine" ;;
          esac
          bindir=$(dirname "$(find "${HOME}/llama-engine" \( -name llama-server -o -name llama-server.exe \) | head -1)")
          [ -n "${bindir}" ] || { echo "llama-server not found in the release archive" >&2; exit 1; }
          # On Windows, GITHUB_PATH needs a native path (C:\...), not the git-bash
          # /c/... form, or Python's shutil.which won't find the binary. cygpath
          # is a no-op fallback on Linux/macOS. Co-located DLLs are found via PATH.
          #
          # PATH only, deliberately no loader variable: llama-server and every
          # library it pulls in carry RUNPATH $ORIGIN on Linux and LC_RPATH
          # @loader_path on macOS, so the engine resolves its own libraries. A
          # GITHUB_ENV export would apply to every later step in the job, and
          # ollama's bundled runner links the same libggml/libllama SONAMEs this
          # tarball ships, so it would load these instead of its own and
          # segfault on the model warm-up.
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "${bindir}" >> "${GITHUB_PATH}"
          else
            echo "${bindir}" >> "${GITHUB_PATH}"
          fi

      # The engine also needs llama-swap (process supervisor / OpenAI proxy) and
      # gguf-parser (footprint estimator), introduced with the llama-swap engine.
      # The lilbee-engine wheel ships these only in the release build, so build the
      # pinned versions from source here; resolve_llama_swap()/resolve_gguf_parser()
      # then find them on PATH. Same Go toolchain the release wheel uses.
      - name: Read the pinned Go toolchain
        shell: bash
        run: |
          source engine-versions.env
          echo "ENGINE_GO_VERSION=${ENGINE_GO_VERSION}" >> "${GITHUB_ENV}"

      - name: Set up Go (engine helpers)
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.ENGINE_GO_VERSION }}
          # Key the module cache on the pins: this repo has no go.sum, and the
          # helper module graph only changes when engine-versions.env does.
          cache-dependency-path: engine-versions.env

      - name: Install llama-swap + gguf-parser (engine helpers)
        shell: bash
        env:
          # A go.mod bump past the installed toolchain must fail here, not
          # silently download one.
          GOTOOLCHAIN: local
        run: |
          set -euxo pipefail
          # Shared pins with tools/wheel-build/build_llama_server.sh.
          source engine-versions.env
          helperdir="${HOME}/engine-helpers"
          mkdir -p "${helperdir}"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          work="$(mktemp -d)"
          git clone -q --depth 1 --branch "${ENGINE_LLAMA_SWAP_VERSION}" \
            https://github.com/mostlygeek/llama-swap.git "${work}/llama-swap"
          ( cd "${work}/llama-swap" && go build -trimpath -o "${helperdir}/llama-swap${exe}" . )
          # gguf-parser's CLI lives under a nested go.mod in cmd/gguf-parser.
          git clone -q --depth 1 --branch "${ENGINE_GGUF_PARSER_REF}" \
            "${ENGINE_GGUF_PARSER_REPO}" "${work}/gguf-parser-go"
          ( cd "${work}/gguf-parser-go/cmd/gguf-parser" && go build -trimpath -o "${helperdir}/gguf-parser${exe}" . )
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "${helperdir}" >> "${GITHUB_PATH}"
          else
            echo "${helperdir}" >> "${GITHUB_PATH}"
          fi

      # No cache for C:\ollama: the extracted tree (ollama plus its CUDA/ROCm
      # runner DLLs) was 1.4 GB, the largest entry in the repo, to save a ~1 min
      # download. Against a hard 10 GB cap it was evicting engine caches worth
      # ~50 min apiece to a release build.

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Install spacy model
        # Retry around the GitHub-releases download. The default `uv pip
        # install` does 3 retries internally but a 502 from GH releases
        # can outlast those; an outer 5-attempt loop with backoff turns a
        # transient gateway error into a flaky-but-eventually-green job.
        shell: bash
        run: |
          url="https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
          for attempt in 1 2 3 4 5; do
            if uv pip install "$url"; then
              exit 0
            fi
            echo "spacy model install attempt $attempt failed; sleeping before retry"
            sleep $((attempt * 10))
          done
          echo "spacy model install failed after 5 attempts" >&2
          exit 1

      # Keyed on the browser revision, not uv.lock: the browsers do not change when
      # an unrelated dependency does, and hashing the lock minted a fresh ~300 MB
      # entry per OS on every bump while the old ones sat on the cap until evicted.
      - name: Restore Playwright cache
        id: pw-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Install Playwright for crawl4ai
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: uv run crawl4ai-setup
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

      - name: Save Playwright cache
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-chromium-v1

      # GGUF models come from the ci-models release (restore-ci-models below), so
      # nothing ever wrote ~/.cache/huggingface/hub. The cache block that used to
      # sit here only churned a key off pyproject.toml and consumed the cap.

      # Linux only, deliberately. The pull is ~2 min; the entry is ~750 MB per OS,
      # and the repo cache sits against a hard 10 GB cap where every GB evicts an
      # engine cache worth ~50 min to a release build. Windows/macOS re-pull.
      - name: Cache Ollama models
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ runner.os }}-qwen3-nomic-v1
          restore-keys: ollama-models-${{ runner.os }}-

      - name: Install Ollama (Linux)
        if: runner.os == 'Linux'
        run: curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="${OLLAMA_PIN}" sh

      - name: Install Ollama (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL "https://github.com/ollama/ollama/releases/download/v${OLLAMA_PIN}/Ollama-darwin.zip" -o /tmp/ollama.zip
          unzip -q /tmp/ollama.zip -d /tmp/ollama
          sudo mv /tmp/ollama/Ollama.app /Applications/
          sudo ln -sf /Applications/Ollama.app/Contents/Resources/ollama /usr/local/bin/ollama

      - name: Install Ollama (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/download/v$env:OLLAMA_PIN/ollama-windows-amd64.zip" -OutFile "$env:TEMP\ollama.zip"
          Expand-Archive "$env:TEMP\ollama.zip" -DestinationPath "C:\ollama" -Force

      # KEEP_ALIVE=-1 pins loaded models in memory: the litellm tests run well
      # past ollama's 5-minute default unload, and a cold reload plus first
      # generation on a loaded runner overruns the request timeout ("Couldn't
      # reach the provider ... or it timed out"). The warm-up calls pay the
      # load cost here, where nothing is timing the request.
      - name: Start Ollama (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          OLLAMA_KEEP_ALIVE=-1 nohup ollama serve > /dev/null 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS localhost:11434/api/version >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Pull Ollama models (Linux/macOS)
        if: runner.os != 'Windows'
        uses: ./.github/actions/ollama-pull
        with:
          models: |
            qwen3:0.6b
            nomic-embed-text

      - name: Warm up Ollama models (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ollama run qwen3:0.6b "warm up" >/dev/null
          curl -fsS localhost:11434/api/embed \
            -d '{"model":"nomic-embed-text","input":"warm up"}' >/dev/null

      - name: Start Ollama (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OLLAMA_KEEP_ALIVE = "-1"
          Start-Process -FilePath "C:\ollama\ollama.exe" -ArgumentList "serve" -WindowStyle Hidden
          foreach ($i in 1..30) {
            try { Invoke-RestMethod "http://localhost:11434/api/version" | Out-Null; break }
            catch { Start-Sleep -Seconds 1 }
          }

      - name: Pull Ollama models (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/ollama-pull
        with:
          ollama: C:/ollama/ollama.exe
          models: |
            qwen3:0.6b
            nomic-embed-text

      - name: Warm up Ollama models (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\ollama\ollama.exe run qwen3:0.6b "warm up" | Out-Null
          Invoke-RestMethod -Method Post -Uri "http://localhost:11434/api/embed" `
            -Body '{"model":"nomic-embed-text","input":"warm up"}' | Out-Null

      - name: Restore GGUF models from release mirror
        id: ci-models
        uses: ./.github/actions/restore-ci-models

      # Only runs if the mirror asset is missing; HF_TOKEN lifts the anon rate limit.
      - name: Pre-download GGUF models from HuggingFace (fallback)
        if: steps.ci-models.outputs.restored != 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for i in 1 2 3; do
            uv run lilbee model pull nomic-ai/nomic-embed-text-v1.5-GGUF && \
            uv run lilbee model pull Qwen/Qwen3-0.6B-GGUF && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Run integration tests
        run: make test-integration
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee
          LILBEE_LLM_PROVIDER: auto
          OLLAMA_HOST: http://127.0.0.1:11434
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
