name: CI

# Probe branch only: the Windows unit suite on Python 3.12 and 3.13, at union 79,
# with the Windows coverage config and its 100% gate.
on:
  push:
    branches: [probe/e774p]
  pull_request:
  workflow_dispatch:

jobs:
  probe-e774p-suite:
    timeout-minutes: 120
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c76239c13e797cb6ffcb7b77a11f1a4c4c9e158b

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - uses: ./.github/actions/checkout-engine-packs

      - name: Install make
        shell: bash
        run: bash scripts/ci_retry.sh 3 choco install make -y

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Run unit tests
        shell: bash
        run: |
          echo "SUITE-HEAD $(git rev-parse HEAD)"
          make test-ci COV_FLAGS="--cov-config=.coveragerc-windows" BRANCH_CHECK=true
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee
          LILBEE_TEST_HANG_DUMP_DIR: ${{ runner.temp }}/hang-dumps
          UV_PYTHON: ${{ matrix.python }}
