name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras
        env:
          # x86_64 build cap at AVX baseline (Sandy Bridge 2011+) so ggml
          # doesn't bake AVX2/FMA/BMI2 into a wheel that the runner pool's
          # weakest CPU can't run. See tools/wheel-build/cmake_args.sh for
          # the full rationale (CPU_ALL_VARIANTS + BACKEND_DL builds but
          # llama-cpp-python's binding never registers the dynamic backends).
          CMAKE_ARGS: >-
            -DGGML_METAL=OFF
            -DGGML_NATIVE=OFF
            -DGGML_AVX=ON
            -DGGML_AVX2=OFF
            -DGGML_FMA=OFF
            -DGGML_F16C=OFF
            -DGGML_BMI2=OFF
            -DGGML_AVX_VNNI=OFF
            -DGGML_AVX512=OFF

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Check imports resolve
        run: make imports-check

  test:
    # Bumped from 60 to 120: Windows 3.11 runs the suite serially (no
    # xdist) to dodge reactive-timing flakes, which exceeds 60 min. All
    # other matrix entries finish well under the original budget.
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # macOS 3.11 still doesn't work even under pytest-forked: every
          # Textual app.run_test() under fork() SIGSEGVs because forking
          # a multi-threaded Cocoa-linked process is unsafe on macOS. Linux
          # fork is fine, so ubuntu 3.11 stays restored. 3.11 coverage on
          # macOS would need a spawn-per-test runner, which doesn't exist
          # in the pytest ecosystem today.
          - os: macos-latest
            python-version: "3.11"
          # Windows 3.11 hangs under pytest-xdist (ProactorEventLoop +
          # reactive-timing scheduler thread-accumulation wedge), so the
          # only reliable path was serial -p no:xdist, which pushes the
          # job past 60 minutes wall-clock. 3.12 and 3.13 still own the
          # Windows coverage story; re-enable once 3.11 reaches end-of-life
          # or asyncio's Windows transport teardown is patched upstream.
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Install dependencies
        run: uv sync --locked
        env:
          # Cap x86_64 builds at AVX baseline (Sandy Bridge 2011+). With
          # GGML_NATIVE=OFF, ggml's CMake still auto-enables AVX2/FMA/BMI2
          # when the build host supports them, so the resulting wheel SIGILLs
          # on runners whose CPU lacks them. Explicit *=OFF flags pin the
          # baseline; matches tools/wheel-build/cmake_args.sh. arm64 needs
          # no equivalent: NEON is mandatory in ARMv8.
          CMAKE_ARGS: >-
            -DGGML_METAL=OFF
            -DGGML_NATIVE=OFF
            -DGGML_BLAS=OFF
            -DGGML_CUDA=OFF
            ${{ runner.arch == 'X64' && '-DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX512=OFF' || '' }}

      - name: Run unit tests
        # ubuntu and macOS on 3.11 hang under pytest-xdist near the end of
        # the run, so they run with pytest-forked (one subprocess per
        # test, distributed across -n auto xdist workers) to sidestep the
        # thread-accumulation wedge. That path loses coverage because
        # forks exit via os._exit, skipping coverage.py's atexit save —
        # accepted tradeoff: 3.11 lanes prove the code runs, 3.12 and
        # 3.13 own the coverage story. Windows 3.11 is excluded above.
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            make test-ci-forked
          else
            make test-ci
          fi
        shell: bash
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee

  integration:
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Windows 3.11 integration hits the original ProactorEventLoop
          # subprocess-transport teardown flake that PR #145 fixed for 3.12+.
          # 3.11's asyncio internals release transports differently and the
          # shared-loop fix doesn't fully cover them; the test suite passes
          # cleanly (119 tests) but pytest crashes on stdout.flush() during
          # exit. Re-enable once Python 3.11 reaches end-of-life or the
          # 3.11 cleanup path is patched upstream.
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract -y
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Integration tests run real local inference, which now means a real
      # llama-server. The lilbee-llama-server wheel ships empty bin/ in this lane
      # (CI fills it only in the release wheel build), so download a prebuilt
      # llama.cpp release binary; resolve_llama_server_binary() finds it on PATH.
      - name: Install llama-server (engine)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          case "${{ runner.os }}" in
            Linux)   pat="bin-ubuntu-x64" ;;
            macOS)   pat="bin-macos-arm64" ;;
            Windows) pat="bin-win-cpu-x64" ;;
          esac
          url=$(gh api repos/ggml-org/llama.cpp/releases/latest \
            --jq ".assets[] | select(.name | test(\"${pat}\")) | .browser_download_url" | head -1)
          [ -n "${url}" ] || { echo "no llama.cpp release asset matching ${pat}" >&2; exit 1; }
          curl -fsSL "${url}" -o llama-engine.zip
          unzip -q llama-engine.zip -d "${HOME}/llama-engine"
          bindir=$(dirname "$(find "${HOME}/llama-engine" \( -name llama-server -o -name llama-server.exe \) | head -1)")
          [ -n "${bindir}" ] || { echo "llama-server not found in the release zip" >&2; exit 1; }
          echo "${bindir}" >> "${GITHUB_PATH}"
          # Co-located libs: add the bin dir to the platform library path too.
          echo "LD_LIBRARY_PATH=${bindir}:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
          echo "DYLD_LIBRARY_PATH=${bindir}:${DYLD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Restore Ollama binary cache (Windows)
        if: runner.os == 'Windows'
        id: ollama-bin-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\ollama
          key: ollama-bin-${{ runner.os }}-v1

      # Metal OFF: CI macOS runners are VMs without GPU passthrough.
      # Native OFF: avoids i8mm compile errors on CI M1 runners.
      # BLAS ON (macOS): uses built-in Accelerate framework for faster matrix ops.
      # BLAS/CUDA OFF (Linux/Windows): no GPU or BLAS library available.
      # AVX baseline (x86_64): explicit *=OFF for AVX2/FMA/BMI2/etc. so a
      # runner lacking them doesn't SIGILL on llama-cpp init.
      - name: Install dependencies
        run: uv sync --locked --all-extras
        env:
          # x86_64 builds cap at AVX baseline so ggml doesn't bake AVX2/FMA/BMI2
          # into a wheel that crashes on the runner pool's weaker CPUs. See
          # tools/wheel-build/cmake_args.sh for why CPU_ALL_VARIANTS + BACKEND_DL
          # isn't viable with llama-cpp-python's Python binding.
          CMAKE_ARGS: >-
            -DGGML_METAL=OFF
            -DGGML_NATIVE=OFF
            -DGGML_CUDA=OFF
            ${{ runner.os == 'macOS' && '-DGGML_BLAS=ON' || '-DGGML_BLAS=OFF' }}
            ${{ runner.arch == 'X64' && '-DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX512=OFF' || '' }}

      - name: Install spacy model
        # Retry around the GitHub-releases download. The default `uv pip
        # install` does 3 retries internally but a 502 from GH releases
        # can outlast those; an outer 5-attempt loop with backoff turns a
        # transient gateway error into a flaky-but-eventually-green job.
        shell: bash
        run: |
          url="https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
          for attempt in 1 2 3 4 5; do
            if uv pip install "$url"; then
              exit 0
            fi
            echo "spacy model install attempt $attempt failed; sleeping before retry"
            sleep $((attempt * 10))
          done
          echo "spacy model install failed after 5 attempts" >&2
          exit 1

      - name: Restore Playwright cache
        id: pw-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright for crawl4ai
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: uv run crawl4ai-setup
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

      - name: Save Playwright cache
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Cache GGUF models (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: ~/.local/share/lilbee/models
          key: gguf-models-Linux-v4

      - name: Cache GGUF models (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/Library/Application Support/lilbee/models
          key: gguf-models-macOS-v4

      - name: Cache GGUF models (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\lilbee\models
          key: gguf-models-Windows-v4

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-models-${{ runner.os }}-

      - name: Cache Ollama models
        uses: actions/cache@v5
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ runner.os }}-qwen3-nomic-v1
          restore-keys: ollama-models-${{ runner.os }}-

      - name: Install Ollama (Linux)
        if: runner.os == 'Linux'
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Install Ollama (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://ollama.com/download/Ollama-darwin.zip -o /tmp/ollama.zip
          unzip -q /tmp/ollama.zip -d /tmp/ollama
          sudo mv /tmp/ollama/Ollama.app /Applications/
          sudo ln -sf /Applications/Ollama.app/Contents/Resources/ollama /usr/local/bin/ollama

      - name: Install Ollama (Windows)
        if: runner.os == 'Windows' && steps.ollama-bin-cache.outputs.cache-hit != 'true'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://ollama.com/download/ollama-windows-amd64.zip" -OutFile "$env:TEMP\ollama.zip"
          Expand-Archive "$env:TEMP\ollama.zip" -DestinationPath "C:\ollama" -Force

      - name: Save Ollama binary cache (Windows)
        if: runner.os == 'Windows' && steps.ollama-bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\ollama
          key: ollama-bin-${{ runner.os }}-v1

      - name: Start Ollama and pull models (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          nohup ollama serve > /dev/null 2>&1 &
          sleep 3
          ollama pull qwen3:0.6b
          ollama pull nomic-embed-text

      - name: Start Ollama and pull models (Windows)
        if: runner.os == 'Windows'
        run: |
          Start-Process -FilePath "C:\ollama\ollama.exe" -ArgumentList "serve" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          & C:\ollama\ollama.exe pull qwen3:0.6b
          & C:\ollama\ollama.exe pull nomic-embed-text

      - name: Pre-download GGUF models
        shell: bash
        run: |
          for i in 1 2 3; do
            uv run lilbee model pull nomic-ai/nomic-embed-text-v1.5-GGUF && \
            uv run lilbee model pull Qwen/Qwen3-0.6B-GGUF && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Run integration tests
        run: make test-integration
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee
          LILBEE_LLM_PROVIDER: auto
          OLLAMA_HOST: http://127.0.0.1:11434
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
