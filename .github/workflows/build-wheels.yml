name: Build Platform Wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: "llama-cpp-python version to vendor"
        default: "0.3.20"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 0.3.20 brings a Gemma 4 chat-template fix not in 0.3.19. abetlen has
  # not published 0.3.20 prebuilts on any of their indexes (cpu, cu*,
  # metal), so every backend builds from source on our runners.
  LLAMA_CPP_VERSION: ${{ inputs.llama_cpp_version || '0.3.20' }}

jobs:
  ci:
    if: github.event_name == 'release'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  build-wheels:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        # The full backend matrix:
        #   * Linux x86_64       — vulkan (default), cu121, cu124, cu125, rocm, sycl, cpu
        #   * macOS arm64        — metal (default)
        #   * Windows x86_64     — vulkan (default), cu121, cu124, cu125, cpu
        # Default backends ship as the PyPI wheel for each OS; non-default
        # backends ship via per-backend GitHub Pages PEP 503 indexes that
        # users opt into with --extra-index-url.
        include:
          # ---- Linux x86_64 ----
          - {os: ubuntu-latest, backend: vulkan, default: true,  wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: vulkan, default: true,  wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: vulkan, default: true,  wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: vulkan, default: true,  wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          - {os: ubuntu-latest, backend: cpu,    default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: cpu,    default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: cpu,    default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: cpu,    default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          - {os: ubuntu-latest, backend: cu121,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: cu121,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: cu121,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: cu121,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          - {os: ubuntu-latest, backend: cu124,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: cu124,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: cu124,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: cu124,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          - {os: ubuntu-latest, backend: cu125,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: cu125,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: cu125,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: cu125,  default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          - {os: ubuntu-latest, backend: rocm,   default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: rocm,   default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: rocm,   default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: rocm,   default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          - {os: ubuntu-latest, backend: sycl,   default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: sycl,   default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: sycl,   default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: sycl,   default: false, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          # ---- macOS arm64 ----
          - {os: macos-latest,  backend: metal,  default: true,  wheel-plat: macosx_11_0_arm64, python-version: "3.11"}
          - {os: macos-latest,  backend: metal,  default: true,  wheel-plat: macosx_11_0_arm64, python-version: "3.12"}
          - {os: macos-latest,  backend: metal,  default: true,  wheel-plat: macosx_11_0_arm64, python-version: "3.13"}
          # ---- Windows x86_64 ----
          - {os: windows-latest, backend: vulkan, default: true,  wheel-plat: win_amd64, python-version: "3.11"}
          - {os: windows-latest, backend: vulkan, default: true,  wheel-plat: win_amd64, python-version: "3.12"}
          - {os: windows-latest, backend: vulkan, default: true,  wheel-plat: win_amd64, python-version: "3.13"}
          - {os: windows-latest, backend: cpu,    default: false, wheel-plat: win_amd64, python-version: "3.11"}
          - {os: windows-latest, backend: cpu,    default: false, wheel-plat: win_amd64, python-version: "3.12"}
          - {os: windows-latest, backend: cpu,    default: false, wheel-plat: win_amd64, python-version: "3.13"}
          - {os: windows-latest, backend: cu121,  default: false, wheel-plat: win_amd64, python-version: "3.11"}
          - {os: windows-latest, backend: cu121,  default: false, wheel-plat: win_amd64, python-version: "3.12"}
          - {os: windows-latest, backend: cu121,  default: false, wheel-plat: win_amd64, python-version: "3.13"}
          - {os: windows-latest, backend: cu124,  default: false, wheel-plat: win_amd64, python-version: "3.11"}
          - {os: windows-latest, backend: cu124,  default: false, wheel-plat: win_amd64, python-version: "3.12"}
          - {os: windows-latest, backend: cu124,  default: false, wheel-plat: win_amd64, python-version: "3.13"}
          - {os: windows-latest, backend: cu125,  default: false, wheel-plat: win_amd64, python-version: "3.11"}
          - {os: windows-latest, backend: cu125,  default: false, wheel-plat: win_amd64, python-version: "3.12"}
          - {os: windows-latest, backend: cu125,  default: false, wheel-plat: win_amd64, python-version: "3.13"}

    runs-on: ${{ matrix.os }}

    env:
      BACKEND: ${{ matrix.backend }}
      LLAMA_BUILD_DIR: "/tmp/llama-build"
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: pip install build

      - name: Build pure wheel
        run: python -m build --wheel

      # ---- GPU build SDK ----
      - name: Install GPU build toolkit (Linux + macOS)
        if: runner.os != 'Windows' && matrix.backend != 'metal'
        shell: bash
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Install CUDA Toolkit (Windows)
        if: startsWith(matrix.backend, 'cu') && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: ${{ matrix.backend == 'cu121' && '12.1.0' || matrix.backend == 'cu122' && '12.2.0' || matrix.backend == 'cu123' && '12.3.0' || matrix.backend == 'cu124' && '12.4.0' || matrix.backend == 'cu125' && '12.5.0' || '12.4.0' }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust","visual_studio_integration"]'

      - name: Build llama-cpp-python from source
        shell: bash
        run: bash tools/wheel-build/build_llama_cpp.sh

      - name: Vendor llama-cpp-python and retag wheel
        shell: bash
        run: >
          python -m tools.vendor.llama_cpp dist/*.whl
          --local-wheel ${{ env.LLAMA_BUILD_DIR }}/llama_cpp_python-${{ env.LLAMA_CPP_VERSION }}-*.whl
          --wheel-platform ${{ matrix.wheel-plat }}

      - name: List output
        shell: bash
        run: ls -lh dist/

      # ---- Smoke test (default backends only) ----
      # Non-default backends (cu*, rocm, sycl) cannot run self-check on the
      # build runner because there's no matching GPU. They get an import-
      # only smoke instead — proves the wheel installs and llama_cpp loads.
      - name: Smoke test (default backend, full self-check)
        if: matrix.default == true
        shell: bash
        run: |
          set -euxo pipefail
          pip install 'typer==0.9.4'
          pip install --pre dist/*.whl
          python -c "import typer, sys; v = tuple(int(p) for p in typer.__version__.split('.')[:2]); assert v >= (0, 12), f'typer={typer.__version__} < 0.12'; print(f'typer {typer.__version__} OK')"

          python -c "
          import lilbee
          from lilbee.cli import app
          from lilbee import code_chunker, ingest, embedder, store, query, config, chunk
          import llama_cpp
          print('llama_cpp loaded from:', llama_cpp.__file__)
          print('lilbee imports OK')
          "

          expected=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          lilbee --version >"$stdout_file" 2>"$stderr_file"
          actual=$(cat "$stdout_file")
          echo "Expected: lilbee ${expected}"
          echo "Actual:   ${actual}"
          echo "Stderr:"
          cat "$stderr_file"
          test "${actual}" = "lilbee ${expected}"
          if grep -qE "No such option|Type not yet supported|RuntimeError" "$stderr_file"; then
            echo "FAIL: typer or runtime error on --version stderr"
            exit 1
          fi

          lilbee --help >/dev/null 2>"$stderr_file"
          if grep -qE "No such option|Type not yet supported|RuntimeError" "$stderr_file"; then
            echo "FAIL: typer or runtime error on --help stderr"
            cat "$stderr_file"
            exit 1
          fi

          export HF_HUB_DISABLE_PROGRESS_BARS=1
          SELF_CHECK_LOG=$(mktemp)
          SELF_CHECK_RC=0
          lilbee --json self-check > "$SELF_CHECK_LOG" 2>&1 || SELF_CHECK_RC=$?
          echo "=== self-check output (exit=${SELF_CHECK_RC}) ==="
          cat "$SELF_CHECK_LOG"
          if [ "${SELF_CHECK_RC}" != "0" ]; then
            echo "FAIL: self-check exited ${SELF_CHECK_RC}"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'self-check failed: {data}'
          assert data.get('chat_response','').strip(), f'empty chat response: {data}'
          dims = data.get('embedding_dims')
          assert isinstance(dims, int) and dims > 0, f'missing embedding_dims: {data}'
          print(f'self-check chat={data[\"chat_response\"]!r} embedding_dims={dims}')
          " "$SELF_CHECK_LOG"
          echo "E2E INFERENCE PASSED"

      - name: Smoke test (non-default backend, install + import only)
        if: matrix.default == false
        shell: bash
        run: |
          set -euxo pipefail
          # Build runners don't have the matching CUDA/ROCm/SYCL hardware,
          # so we can't run inference here. The PEP 503 publish path tests
          # the wheel structurally (filename + libs present); end-to-end
          # GPU tests require a real device and are out of scope for this
          # CI runner.
          pip install --pre dist/*.whl
          python -c "
          import pathlib, llama_cpp
          lib_dir = pathlib.Path(llama_cpp.__file__).parent / 'lib'
          libs = sorted(p.name for p in lib_dir.glob('*'))
          print(f'llama_cpp/lib: {libs}')
          assert any('llama' in n.lower() for n in libs), f'libllama missing: {libs}'
          print('non-default smoke OK')
          "

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.backend }}-py${{ matrix.python-version }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    if: github.event_name == 'release'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download default artifacts (vulkan + metal + sdist)
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage default-backend wheels for PyPI
        run: |
          set -euxo pipefail
          mkdir -p dist
          # Default-backend wheels: linux/win vulkan + macos metal. Bring
          # only those + the sdist into dist/. Everything else (cu*, rocm,
          # sycl, cpu) goes to the per-backend GH Pages publish.
          cp artifacts/wheel-ubuntu-latest-vulkan-py*/lilbee-*.whl dist/
          cp artifacts/wheel-macos-latest-metal-py*/lilbee-*.whl dist/
          cp artifacts/wheel-windows-latest-vulkan-py*/lilbee-*.whl dist/
          cp artifacts/sdist/lilbee-*.tar.gz dist/
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-extra-index:
    # Per-backend PEP 503 simple repository hosted on GitHub Pages.
    # Users opt in: pip install lilbee --extra-index-url https://tobocop2.github.io/lilbee/cu124/
    if: github.event_name == 'release'
    needs: [build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Build PEP 503 simple index per backend
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p public
          # One index dir per backend; each contains a /lilbee/ project
          # subdir with the wheel(s) and an index.html listing them.
          backends=$(find artifacts -type d -name 'wheel-*' | awk -F- '{print $(NF-2)}' | sort -u)
          for backend in ${backends}; do
            mkdir -p "public/${backend}/lilbee"
            find artifacts -type d -name "wheel-*-${backend}-*" | while read -r dir; do
              cp "${dir}"/lilbee-*.whl "public/${backend}/lilbee/"
            done
            (
              cd "public/${backend}/lilbee"
              {
                echo '<!DOCTYPE html><html><body>'
                for whl in lilbee-*.whl; do
                  echo "<a href=\"${whl}\">${whl}</a><br>"
                done
                echo '</body></html>'
              } > index.html
            )
            (
              cd "public/${backend}"
              {
                echo '<!DOCTYPE html><html><body>'
                echo '<a href="lilbee/">lilbee</a><br>'
                echo '</body></html>'
              } > index.html
            )
          done
          # Top-level landing page lists the backends.
          {
            echo '<!DOCTYPE html><html><body>'
            echo '<h1>lilbee — per-backend wheel indexes</h1>'
            echo '<p>Use <code>pip install lilbee --extra-index-url https://tobocop2.github.io/lilbee/&lt;backend&gt;/</code></p>'
            echo '<ul>'
            for backend in ${backends}; do
              echo "<li><a href=\"${backend}/\">${backend}</a></li>"
            done
            echo '</ul></body></html>'
          } > public/index.html
          ls -R public/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

  verify-pypi:
    if: github.event_name == 'release'
    needs: [publish-pypi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, backend: vulkan, python-version: "3.11"}
          - {os: ubuntu-latest, backend: vulkan, python-version: "3.12"}
          - {os: ubuntu-latest, backend: vulkan, python-version: "3.13"}
          - {os: ubuntu-latest, backend: vulkan, python-version: "3.14"}
          - {os: macos-latest,  backend: metal,  python-version: "3.11"}
          - {os: macos-latest,  backend: metal,  python-version: "3.12"}
          - {os: macos-latest,  backend: metal,  python-version: "3.13"}
          - {os: windows-latest, backend: vulkan, python-version: "3.11"}
          - {os: windows-latest, backend: vulkan, python-version: "3.12"}
          - {os: windows-latest, backend: vulkan, python-version: "3.13"}
    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GPU runtime loader
        shell: bash
        run: bash tools/wheel-build/install_gpu_runtime.sh

      - name: Install Vulkan runtime (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install from PyPI (poll until indexed)
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if pip install --pre --dry-run "lilbee==${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
              echo "PyPI indexed on attempt ${i}"
              break
            fi
            sleep 6
            if [ "$i" = "30" ]; then
              echo "PyPI never indexed lilbee==${{ steps.version.outputs.version }}"
              exit 1
            fi
          done
          pip install --pre "lilbee==${{ steps.version.outputs.version }}"

      - name: self-check end-to-end
        shell: bash
        run: |
          set -euxo pipefail
          OUT=$(mktemp)
          RC=0
          lilbee --json self-check > "$OUT" 2>&1 || RC=$?
          echo "=== self-check output (exit=${RC}) ==="
          cat "$OUT"
          if [ "${RC}" != "0" ]; then
            echo "FAIL: self-check exited ${RC}"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'PyPI install self-check failed: {data}'
          assert data.get('chat_response','').strip(), f'empty chat response: {data}'
          dims = data.get('embedding_dims')
          assert isinstance(dims, int) and dims > 0, f'missing embedding_dims: {data}'
          print(f'PyPI install self-check PASSED chat={data[\"chat_response\"]!r} embedding_dims={dims}')
          " "$OUT"
