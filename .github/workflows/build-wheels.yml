name: Build Platform Wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: "llama-cpp-python version to vendor"
        default: "0.3.19"
        required: false

permissions:
  contents: read

env:
  # 0.3.19 is the latest version with abetlen's full prebuilt coverage on
  # the CPU + CUDA + Metal indexes. Bumping this to a version abetlen
  # hasn't shipped yet means every backend has to rebuild from source —
  # see tools/wheel-build/README.md.
  LLAMA_CPP_VERSION: ${{ inputs.llama_cpp_version || '0.3.19' }}

jobs:
  ci:
    if: github.event_name == 'release'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  build-wheels:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        # The default-PyPI wheel matrix. One wheel per OS × Python, with
        # the GPU backend that's universal for that OS:
        #   * Linux x86_64 → Vulkan (cross-vendor: NVIDIA, AMD, Intel Arc)
        #   * macOS arm64  → Metal (built into the OS)
        #   * Windows x86_64 → Vulkan (cross-vendor)
        # Per-CUDA, ROCm, and SYCL wheels go on a separate extra-index
        # under the build-extra-index job below.
        include:
          - os: ubuntu-latest
            backend: vulkan
            wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64
            python-version: "3.11"
          - os: ubuntu-latest
            backend: vulkan
            wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64
            python-version: "3.12"
          - os: ubuntu-latest
            backend: vulkan
            wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64
            python-version: "3.13"
          - os: ubuntu-latest
            backend: vulkan
            wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64
            python-version: "3.14"
          - os: macos-latest
            backend: metal
            wheel-plat: macosx_11_0_arm64
            python-version: "3.11"
          - os: macos-latest
            backend: metal
            wheel-plat: macosx_11_0_arm64
            python-version: "3.12"
          - os: macos-latest
            backend: metal
            wheel-plat: macosx_11_0_arm64
            python-version: "3.13"
          - os: windows-latest
            backend: vulkan
            wheel-plat: win_amd64
            python-version: "3.11"
          - os: windows-latest
            backend: vulkan
            wheel-plat: win_amd64
            python-version: "3.12"
          - os: windows-latest
            backend: vulkan
            wheel-plat: win_amd64
            python-version: "3.13"

    runs-on: ${{ matrix.os }}

    env:
      BACKEND: ${{ matrix.backend }}
      LLAMA_BUILD_DIR: "/tmp/llama-build"
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: pip install build

      - name: Build pure wheel
        run: python -m build --wheel

      - name: Install GPU build toolkit
        if: matrix.backend != 'metal'
        shell: bash
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build llama-cpp-python from source
        shell: bash
        run: bash tools/wheel-build/build_llama_cpp.sh

      - name: Vendor llama-cpp-python and retag wheel
        shell: bash
        run: >
          python -m tools.vendor.llama_cpp dist/*.whl
          --local-wheel ${{ env.LLAMA_BUILD_DIR }}/llama_cpp_python-${{ env.LLAMA_CPP_VERSION }}-*.whl
          --wheel-platform ${{ matrix.wheel-plat }}

      - name: List output
        shell: bash
        run: ls -lh dist/

      - name: Smoke test
        shell: bash
        run: |
          set -euxo pipefail
          # Pre-seed typer 0.9.4: real users sometimes carry a stale typer
          # from another project, and lilbee's own pin (typer>=0.12) needs
          # to drag the resolver forward.
          pip install 'typer==0.9.4'
          pip install --pre dist/*.whl
          python -c "import typer, sys; v = tuple(int(p) for p in typer.__version__.split('.')[:2]); assert v >= (0, 12), f'typer={typer.__version__} < 0.12'; print(f'typer {typer.__version__} OK')"

          python -c "
          import lilbee
          from lilbee.cli import app
          from lilbee import code_chunker, ingest, embedder, store, query, config, chunk
          import llama_cpp
          print('llama_cpp loaded from:', llama_cpp.__file__)
          print('lilbee imports OK')
          "

          expected=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          lilbee --version >"$stdout_file" 2>"$stderr_file"
          actual=$(cat "$stdout_file")
          echo "Expected: lilbee ${expected}"
          echo "Actual:   ${actual}"
          echo "Stderr:"
          cat "$stderr_file"
          test "${actual}" = "lilbee ${expected}"
          if grep -qE "No such option|Type not yet supported|RuntimeError" "$stderr_file"; then
            echo "FAIL: typer or runtime error on --version stderr"
            exit 1
          fi

          lilbee --help >/dev/null 2>"$stderr_file"
          if grep -qE "No such option|Type not yet supported|RuntimeError" "$stderr_file"; then
            echo "FAIL: typer or runtime error on --help stderr"
            cat "$stderr_file"
            exit 1
          fi

          # End-to-end inference smoke (chat + embedding legs). Same gate
          # as release.yml so the wheel and frozen exe are held to the
          # same bar.
          export HF_HUB_DISABLE_PROGRESS_BARS=1
          SELF_CHECK_LOG=$(mktemp)
          SELF_CHECK_RC=0
          lilbee --json self-check > "$SELF_CHECK_LOG" 2>&1 || SELF_CHECK_RC=$?
          echo "=== self-check output (exit=${SELF_CHECK_RC}) ==="
          cat "$SELF_CHECK_LOG"
          if [ "${SELF_CHECK_RC}" != "0" ]; then
            echo "FAIL: self-check exited ${SELF_CHECK_RC}"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'self-check failed: {data}'
          assert data.get('chat_response','').strip(), f'empty chat response: {data}'
          dims = data.get('embedding_dims')
          assert isinstance(dims, int) and dims > 0, f'missing embedding_dims: {data}'
          print(f'self-check chat={data[\"chat_response\"]!r} embedding_dims={dims}')
          " "$SELF_CHECK_LOG"
          echo "E2E INFERENCE PASSED"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.backend }}-py${{ matrix.python-version }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: github.event_name == 'release'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Verify the PUBLISHED artifact (not just the locally-built wheel) actually
  # installs and runs end-to-end across the same OS × Python matrix users
  # will hit. Each runner installs the GPU runtime loader matching the
  # default wheel's backend (vulkan loader on Linux/Windows, nothing on
  # macOS) so the import doesn't fail on a CPU-only headless box.
  verify-pypi:
    if: github.event_name == 'release'
    needs: [publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: vulkan
            python-version: "3.11"
          - os: ubuntu-latest
            backend: vulkan
            python-version: "3.12"
          - os: ubuntu-latest
            backend: vulkan
            python-version: "3.13"
          - os: ubuntu-latest
            backend: vulkan
            python-version: "3.14"
          - os: macos-latest
            backend: metal
            python-version: "3.11"
          - os: macos-latest
            backend: metal
            python-version: "3.12"
          - os: macos-latest
            backend: metal
            python-version: "3.13"
          - os: windows-latest
            backend: vulkan
            python-version: "3.11"
          - os: windows-latest
            backend: vulkan
            python-version: "3.12"
          - os: windows-latest
            backend: vulkan
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GPU runtime loader
        shell: bash
        run: bash tools/wheel-build/install_gpu_runtime.sh

      - name: Install Vulkan runtime (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install from PyPI (poll until indexed)
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if pip install --pre --dry-run "lilbee==${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
              echo "PyPI indexed on attempt ${i}"
              break
            fi
            sleep 6
            if [ "$i" = "30" ]; then
              echo "PyPI never indexed lilbee==${{ steps.version.outputs.version }} after 3 min"
              exit 1
            fi
          done
          pip install --pre "lilbee==${{ steps.version.outputs.version }}"

      - name: Confirm the resolved wheel ships vendored llama_cpp libs
        shell: bash
        run: |
          set -euxo pipefail
          python -c "
          import pathlib, llama_cpp
          lib_dir = pathlib.Path(llama_cpp.__file__).parent / 'lib'
          files = sorted(lib_dir.glob('*')) if lib_dir.is_dir() else []
          print('llama_cpp/lib:', [f.name for f in files])
          assert any('llama' in f.name for f in files), f'wheel missing libllama.*: {[f.name for f in files]}'
          "

      - name: self-check end-to-end
        shell: bash
        run: |
          set -euxo pipefail
          OUT=$(mktemp)
          RC=0
          lilbee --json self-check > "$OUT" 2>&1 || RC=$?
          echo "=== self-check output (exit=${RC}) ==="
          cat "$OUT"
          if [ "${RC}" != "0" ]; then
            echo "FAIL: self-check exited ${RC}"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'PyPI install self-check failed: {data}'
          assert data.get('chat_response','').strip(), f'empty chat response: {data}'
          dims = data.get('embedding_dims')
          assert isinstance(dims, int) and dims > 0, f'missing embedding_dims: {data}'
          print(f'PyPI install self-check PASSED chat={data[\"chat_response\"]!r} embedding_dims={dims}')
          " "$OUT"
