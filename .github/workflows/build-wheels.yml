name: Build Platform Wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: "llama-cpp-python version to vendor"
        default: "0.3.20"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 0.3.20 brings the Gemma 4 chat-template fix not in 0.3.19. abetlen
  # has not published 0.3.20 prebuilts on any of their indexes, so every
  # wheel builds from source on our runners.
  LLAMA_CPP_VERSION: ${{ inputs.llama_cpp_version || '0.3.20' }}

jobs:
  ci:
    if: github.event_name == 'release'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # Default-backend wheels for PyPI:
  #   * Linux x86_64       → vulkan
  #   * macOS arm64        → metal
  #   * Windows x86_64     → vulkan
  # `pip install lilbee` (no flags) gets these. The build runner can run
  # the full self-check inference here because Vulkan/Metal fall back to
  # CPU when no GPU is present, so we test BOTH the GPU path's import
  # surface AND end-to-end inference.
  build-default-wheels:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, backend: vulkan, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: vulkan, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: vulkan, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: vulkan, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          - {os: macos-latest,  backend: metal,  wheel-plat: macosx_11_0_arm64,                          python-version: "3.11"}
          - {os: macos-latest,  backend: metal,  wheel-plat: macosx_11_0_arm64,                          python-version: "3.12"}
          - {os: macos-latest,  backend: metal,  wheel-plat: macosx_11_0_arm64,                          python-version: "3.13"}
          - {os: windows-latest, backend: vulkan, wheel-plat: win_amd64,                                 python-version: "3.11"}
          - {os: windows-latest, backend: vulkan, wheel-plat: win_amd64,                                 python-version: "3.12"}
          - {os: windows-latest, backend: vulkan, wheel-plat: win_amd64,                                 python-version: "3.13"}

    runs-on: ${{ matrix.os }}

    env:
      BACKEND: ${{ matrix.backend }}
      LLAMA_BUILD_DIR: "/tmp/llama-build"
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: pip install build

      - name: Build pure wheel
        run: python -m build --wheel

      - name: Install Vulkan loader (Linux)
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        shell: bash
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build llama-cpp-python from source
        shell: bash
        run: bash tools/wheel-build/build_llama_cpp.sh

      - name: Vendor llama-cpp-python and retag wheel
        shell: bash
        run: >
          python -m tools.vendor.llama_cpp dist/*.whl
          --local-wheel ${{ env.LLAMA_BUILD_DIR }}/llama_cpp_python-${{ env.LLAMA_CPP_VERSION }}-*.whl
          --wheel-platform ${{ matrix.wheel-plat }}

      - name: Smoke test
        shell: bash
        run: |
          set -euxo pipefail
          pip install 'typer==0.9.4'
          pip install --pre dist/*.whl
          python -c "import typer, sys; v = tuple(int(p) for p in typer.__version__.split('.')[:2]); assert v >= (0, 12), f'typer={typer.__version__} < 0.12'; print(f'typer {typer.__version__} OK')"

          python -c "
          import lilbee
          from lilbee.cli import app
          from lilbee import code_chunker, ingest, embedder, store, query, config, chunk
          import llama_cpp
          print('llama_cpp loaded from:', llama_cpp.__file__)
          print('lilbee imports OK')
          "

          expected=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          lilbee --version >"$stdout_file" 2>"$stderr_file"
          test "$(cat "$stdout_file")" = "lilbee ${expected}"
          if grep -qE "No such option|Type not yet supported|RuntimeError" "$stderr_file"; then
            cat "$stderr_file"; exit 1
          fi
          lilbee --help >/dev/null 2>"$stderr_file"
          if grep -qE "No such option|Type not yet supported|RuntimeError" "$stderr_file"; then
            cat "$stderr_file"; exit 1
          fi

          export HF_HUB_DISABLE_PROGRESS_BARS=1
          OUT=$(mktemp); RC=0
          lilbee --json self-check > "$OUT" 2>&1 || RC=$?
          echo "=== self-check (exit=${RC}) ==="
          cat "$OUT"
          [ "${RC}" = "0" ]
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'self-check failed: {data}'
          assert data.get('chat_response','').strip(), f'empty chat response: {data}'
          dims = data.get('embedding_dims')
          assert isinstance(dims, int) and dims > 0, f'missing embedding_dims: {data}'
          print(f'self-check chat={data[\"chat_response\"]!r} embedding_dims={dims}')
          " "$OUT"

      - name: Upload default-backend wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-default-${{ matrix.os }}-${{ matrix.backend }}-py${{ matrix.python-version }}
          path: dist/*.whl

  # Extra-backend wheels: per-CUDA-version + pure CPU. Distributed via
  # GitHub Pages PEP 503 simple repos; users opt in with --extra-index-url.
  # These lanes can fail individually without blocking the PyPI publish
  # of the default-backend wheels.
  build-extra-wheels:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux pure CPU (no Vulkan dep — for headless containers)
          - {os: ubuntu-latest, backend: cpu, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: cpu, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: cpu, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: cpu, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          # Linux CUDA — toolkit installed via Jimver/cuda-toolkit action,
          # which handles network install of older CUDA versions that
          # NVIDIA's ubuntu2404 apt repo doesn't carry.
          - {os: ubuntu-22.04, backend: cu121, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11", cuda: "12.1.0"}
          - {os: ubuntu-22.04, backend: cu121, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12", cuda: "12.1.0"}
          - {os: ubuntu-22.04, backend: cu121, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13", cuda: "12.1.0"}
          - {os: ubuntu-22.04, backend: cu124, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11", cuda: "12.4.0"}
          - {os: ubuntu-22.04, backend: cu124, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12", cuda: "12.4.0"}
          - {os: ubuntu-22.04, backend: cu124, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13", cuda: "12.4.0"}
          - {os: ubuntu-22.04, backend: cu125, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11", cuda: "12.5.0"}
          - {os: ubuntu-22.04, backend: cu125, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12", cuda: "12.5.0"}
          - {os: ubuntu-22.04, backend: cu125, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13", cuda: "12.5.0"}
          # Windows pure CPU
          - {os: windows-latest, backend: cpu, wheel-plat: win_amd64, python-version: "3.11"}
          - {os: windows-latest, backend: cpu, wheel-plat: win_amd64, python-version: "3.12"}
          - {os: windows-latest, backend: cpu, wheel-plat: win_amd64, python-version: "3.13"}
          # Windows CUDA — same Jimver action.
          - {os: windows-2022, backend: cu121, wheel-plat: win_amd64, python-version: "3.11", cuda: "12.1.0"}
          - {os: windows-2022, backend: cu121, wheel-plat: win_amd64, python-version: "3.12", cuda: "12.1.0"}
          - {os: windows-2022, backend: cu121, wheel-plat: win_amd64, python-version: "3.13", cuda: "12.1.0"}
          - {os: windows-2022, backend: cu124, wheel-plat: win_amd64, python-version: "3.11", cuda: "12.4.0"}
          - {os: windows-2022, backend: cu124, wheel-plat: win_amd64, python-version: "3.12", cuda: "12.4.0"}
          - {os: windows-2022, backend: cu124, wheel-plat: win_amd64, python-version: "3.13", cuda: "12.4.0"}
          - {os: windows-2022, backend: cu125, wheel-plat: win_amd64, python-version: "3.11", cuda: "12.5.0"}
          - {os: windows-2022, backend: cu125, wheel-plat: win_amd64, python-version: "3.12", cuda: "12.5.0"}
          - {os: windows-2022, backend: cu125, wheel-plat: win_amd64, python-version: "3.13", cuda: "12.5.0"}

    runs-on: ${{ matrix.os }}

    env:
      BACKEND: ${{ matrix.backend }}
      LLAMA_BUILD_DIR: "/tmp/llama-build"
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: pip install build

      - name: Build pure wheel
        run: python -m build --wheel

      - name: Install CUDA Toolkit (Linux)
        if: startsWith(matrix.backend, 'cu') && runner.os == 'Linux'
        shell: bash
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install CUDA Toolkit (Windows)
        if: startsWith(matrix.backend, 'cu') && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust","visual_studio_integration"]'

      - name: Build llama-cpp-python from source
        shell: bash
        run: bash tools/wheel-build/build_llama_cpp.sh

      - name: Vendor llama-cpp-python and retag wheel
        shell: bash
        run: >
          python -m tools.vendor.llama_cpp dist/*.whl
          --local-wheel ${{ env.LLAMA_BUILD_DIR }}/llama_cpp_python-${{ env.LLAMA_CPP_VERSION }}-*.whl
          --wheel-platform ${{ matrix.wheel-plat }}

      # Non-default backends (cu*, cpu) can't run inference here — the
      # build runner has no matching GPU, and a CUDA-built wheel won't
      # initialize on a CPU-only host. Structural smoke only: install
      # the wheel, confirm libllama is bundled.
      - name: Smoke test (install + import)
        shell: bash
        run: |
          set -euxo pipefail
          pip install --pre dist/*.whl || true
          python -c "
          import pathlib
          try:
              import llama_cpp
              lib_dir = pathlib.Path(llama_cpp.__file__).parent / 'lib'
              libs = sorted(p.name for p in lib_dir.glob('*'))
              print(f'llama_cpp/lib: {libs}')
              assert any('llama' in n.lower() for n in libs), f'libllama missing: {libs}'
              print('non-default smoke OK')
          except OSError as exc:
              # CUDA wheel may fail to dlopen on a CPU-only runner — that
              # is expected; the wheel structure is what matters here.
              print(f'(expected) cannot import llama_cpp on CI runner: {exc!r}')
              # Still verify the wheel has libs by inspecting site-packages.
              import sys, glob
              for sp in sys.path:
                  candidates = glob.glob(f'{sp}/llama_cpp/lib/*')
                  if candidates:
                      print(f'wheel libs: {[c.split(\"/\")[-1] for c in candidates]}')
                      assert any('llama' in c.lower() for c in candidates)
                      break
              else:
                  raise AssertionError('no llama_cpp/lib/ found on sys.path')
          "

      - name: Upload extra-backend wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-extra-${{ matrix.os }}-${{ matrix.backend }}-py${{ matrix.python-version }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    if: github.event_name == 'release'
    needs: [build-default-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download default artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: "wheel-default-*"

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: "sdist"

      - name: Stage default wheels + sdist for PyPI
        run: |
          set -euxo pipefail
          mkdir -p dist
          find artifacts -name "lilbee-*.whl" -exec cp {} dist/ \;
          find artifacts -name "lilbee-*.tar.gz" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # PEP 503 simple repository hosted on GitHub Pages. Users opt in with
  # `--extra-index-url`. Always runs even if some extra-backend lanes
  # failed — `if: always()` + filtering in the artifact step.
  publish-extra-index:
    if: github.event_name == 'release' && always()
    needs: [build-extra-wheels, build-default-wheels]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: "wheel-*"

      - name: Build PEP 503 simple index per backend
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p public
          # Each artifact dir name is wheel-default-<os>-<backend>-pyX.YZ
          # or wheel-extra-<os>-<backend>-pyX.YZ. Group by backend.
          backends=$(find artifacts -mindepth 1 -maxdepth 1 -type d -name "wheel-*" | \
                     awk -F'-' '{print $(NF-2)}' | sort -u)
          for backend in ${backends}; do
            mkdir -p "public/${backend}/lilbee"
            for dir in artifacts/wheel-*-${backend}-*; do
              [ -d "${dir}" ] || continue
              cp "${dir}"/lilbee-*.whl "public/${backend}/lilbee/" 2>/dev/null || true
            done
            count=$(ls "public/${backend}/lilbee/"*.whl 2>/dev/null | wc -l)
            echo "backend=${backend} wheels=${count}"
            if [ "${count}" = "0" ]; then
              rm -rf "public/${backend}"
              continue
            fi
            (
              cd "public/${backend}/lilbee"
              {
                echo '<!DOCTYPE html><html><body>'
                for whl in lilbee-*.whl; do
                  echo "<a href=\"${whl}\">${whl}</a><br>"
                done
                echo '</body></html>'
              } > index.html
            )
            (
              cd "public/${backend}"
              {
                echo '<!DOCTYPE html><html><body>'
                echo '<a href="lilbee/">lilbee</a><br>'
                echo '</body></html>'
              } > index.html
            )
          done
          {
            echo '<!DOCTYPE html><html><body>'
            echo '<h1>lilbee — per-backend wheel indexes</h1>'
            echo '<p><code>pip install lilbee --extra-index-url https://tobocop2.github.io/lilbee/&lt;backend&gt;/</code></p>'
            echo '<ul>'
            for d in public/*/; do
              [ -d "${d}" ] || continue
              name=$(basename "${d}")
              echo "<li><a href=\"${name}/\">${name}</a></li>"
            done
            echo '</ul></body></html>'
          } > public/index.html
          ls -R public/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

  verify-pypi:
    if: github.event_name == 'release'
    needs: [publish-pypi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, backend: vulkan, python-version: "3.11"}
          - {os: ubuntu-latest, backend: vulkan, python-version: "3.12"}
          - {os: ubuntu-latest, backend: vulkan, python-version: "3.13"}
          - {os: ubuntu-latest, backend: vulkan, python-version: "3.14"}
          - {os: macos-latest,  backend: metal,  python-version: "3.11"}
          - {os: macos-latest,  backend: metal,  python-version: "3.12"}
          - {os: macos-latest,  backend: metal,  python-version: "3.13"}
          - {os: windows-latest, backend: vulkan, python-version: "3.11"}
          - {os: windows-latest, backend: vulkan, python-version: "3.12"}
          - {os: windows-latest, backend: vulkan, python-version: "3.13"}
    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GPU runtime loader
        shell: bash
        run: bash tools/wheel-build/install_gpu_runtime.sh

      - name: Install Vulkan runtime (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install from PyPI (poll until indexed)
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if pip install --pre --dry-run "lilbee==${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
              echo "PyPI indexed on attempt ${i}"
              break
            fi
            sleep 6
            if [ "$i" = "30" ]; then
              echo "PyPI never indexed lilbee==${{ steps.version.outputs.version }}"
              exit 1
            fi
          done
          pip install --pre "lilbee==${{ steps.version.outputs.version }}"

      - name: self-check end-to-end
        shell: bash
        run: |
          set -euxo pipefail
          OUT=$(mktemp)
          RC=0
          lilbee --json self-check > "$OUT" 2>&1 || RC=$?
          echo "=== self-check (exit=${RC}) ==="
          cat "$OUT"
          [ "${RC}" = "0" ]
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'PyPI install self-check failed: {data}'
          assert data.get('chat_response','').strip(), f'empty chat response: {data}'
          dims = data.get('embedding_dims')
          assert isinstance(dims, int) and dims > 0, f'missing embedding_dims: {data}'
          print(f'PyPI install self-check PASSED chat={data[\"chat_response\"]!r} embedding_dims={dims}')
          " "$OUT"
