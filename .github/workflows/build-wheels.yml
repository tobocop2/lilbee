name: Build Platform Wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: "llama-cpp-python version to vendor"
        default: "0.3.18"
        required: false

permissions:
  contents: read

env:
  LLAMA_CPP_VERSION: ${{ inputs.llama_cpp_version || '0.3.20' }}

jobs:
  ci:
    if: github.event_name == 'release'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  build-wheels:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            llama-plat: linux_x86_64
            wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64
          - os: macos-latest
            llama-plat: macosx_11_0_arm64
            wheel-plat: macosx_11_0_arm64
          - os: windows-latest
            llama-plat: win_amd64
            wheel-plat: win_amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: pip install build

      - name: Build pure wheel
        run: python -m build --wheel

      # Build llama-cpp-python from source on every platform. abetlen's CPU
      # index only ships up to 0.3.19 and Linux's wheels are musl-linked
      # (broken on glibc); building from source against the runner's
      # toolchain gives us 0.3.20 with consistent behavior everywhere.
      # GGML_NATIVE=OFF on every OS so wheels are portable across the runner
      # pool's CPU classes (avoids the "Illegal instruction" failures on
      # weaker CI machines). Metal stays ON for macOS arm64 since that's
      # the whole point of an Apple Silicon wheel.
      - name: Build llama-cpp-python from source (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF"
        run: |
          mkdir -p /tmp/llama-build
          pip wheel "llama-cpp-python==${{ env.LLAMA_CPP_VERSION }}" \
            --no-deps --no-binary=llama-cpp-python \
            -w /tmp/llama-build
          ls -lh /tmp/llama-build/

      - name: Build llama-cpp-python from source (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_BLAS=OFF"
          # Deployment target matches the wheel platform tag we stamp on
          # the lilbee wheel (macosx_11_0_arm64). Without this, cmake
          # defaults to the runner's current macOS (15+), which would
          # produce a dylib that fails to load on macOS 11–14 users.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          mkdir -p /tmp/llama-build
          pip wheel "llama-cpp-python==${{ env.LLAMA_CPP_VERSION }}" \
            --no-deps --no-binary=llama-cpp-python \
            -w /tmp/llama-build
          ls -lh /tmp/llama-build/

      - name: Build llama-cpp-python from source (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BLAS=OFF"
        run: |
          mkdir -p /tmp/llama-build
          pip wheel "llama-cpp-python==${{ env.LLAMA_CPP_VERSION }}" \
            --no-deps --no-binary=llama-cpp-python \
            -w /tmp/llama-build
          ls -lh /tmp/llama-build/

      - name: Vendor llama-cpp-python and retag wheel
        shell: bash
        run: >
          python -m tools.vendor.llama_cpp dist/*.whl
          --local-wheel /tmp/llama-build/llama_cpp_python-${{ env.LLAMA_CPP_VERSION }}-*.whl
          --wheel-platform ${{ matrix.wheel-plat }}

      - name: List output
        shell: bash
        run: ls -lh dist/

      - name: Smoke test
        shell: bash
        run: |
          set -euxo pipefail

          # Pre-seed typer 0.9.4 to reproduce the stale-env case that bit a
          # real user: they had old typer from another project, and the lilbee
          # wheel didn't force an upgrade, so `lilbee --version` crashed with
          # "Type not yet supported: pathlib.Path | None". The wheel must
          # declare typer>=0.12 so pip upgrades it during install.
          pip install 'typer==0.9.4'

          # Install with --pre so pip mirrors user install flow for beta
          # releases. This is what catches transitive pre-release deps like
          # tree-sitter-language-pack 2.0.0a1 that break real imports.
          pip install --pre dist/*.whl

          # Verify the install actually upgraded typer past the 0.12 cutoff.
          python -c "import typer, sys; v = tuple(int(p) for p in typer.__version__.split('.')[:2]); assert v >= (0, 12), f'typer={typer.__version__} < 0.12 — wheel missing pin'; print(f'typer {typer.__version__} OK')"

          # Exercise the import path that users hit on every invocation.
          # lilbee --version alone only loads the launcher, so it misses
          # breakage in code_chunker / ingest / cli modules.
          python -c "
          import lilbee
          from lilbee.cli import app
          from lilbee import code_chunker, ingest, embedder, store, query, config, chunk
          import llama_cpp
          print('llama_cpp loaded from:', llama_cpp.__file__)
          print('lilbee imports OK')
          "

          # --version must match the version declared in pyproject.toml.
          # Capture stdout AND stderr: a flood of '-B: no such option' on
          # stderr means the exe is caught in a multiprocessing-spawn loop
          # even though stdout shows the right version. --help similarly
          # must not emit typer usage errors — that means a Path | None or
          # other unsupported annotation slipped through.
          expected=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          stdout_file=$(mktemp)
          stderr_file=$(mktemp)
          lilbee --version >"$stdout_file" 2>"$stderr_file"
          actual=$(cat "$stdout_file")
          echo "Expected: lilbee ${expected}"
          echo "Actual:   ${actual}"
          echo "Stderr:"
          cat "$stderr_file"
          test "${actual}" = "lilbee ${expected}"
          if grep -qE "No such option|Type not yet supported|RuntimeError" "$stderr_file"; then
            echo "FAIL: typer or runtime error on --version stderr"
            exit 1
          fi

          lilbee --help >/dev/null 2>"$stderr_file"
          if grep -qE "No such option|Type not yet supported|RuntimeError" "$stderr_file"; then
            echo "FAIL: typer or runtime error on --help stderr"
            cat "$stderr_file"
            exit 1
          fi

          # END-TO-END INFERENCE SMOKE: download a ~90MB SmolLM2 135M GGUF
          # through the self-check command and run a tiny completion against
          # it. This is the exact failure mode that bit a user in b426:
          # "Shared library with base name 'llama' not found" fires from
          # llama_cpp/_ctypes_extensions.py when the vendored
          # llama_cpp/lib/ is missing or unreadable. self-check exits 1
          # on any failure (download, library load, empty response). The
          # same command runs in the PyInstaller exe smoke so both artifact
          # flavors are held to the same bar.
          export HF_HUB_DISABLE_PROGRESS_BARS=1
          SELF_CHECK_LOG=$(mktemp)
          SELF_CHECK_RC=0
          lilbee --json self-check > "$SELF_CHECK_LOG" 2>&1 || SELF_CHECK_RC=$?
          echo "=== self-check output (exit=${SELF_CHECK_RC}) ==="
          cat "$SELF_CHECK_LOG"
          if [ "${SELF_CHECK_RC}" != "0" ]; then
            echo "FAIL: self-check exited ${SELF_CHECK_RC}"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'self-check failed: {data}'
          assert data.get('response','').strip(), f'empty response: {data}'
          print('self-check response:', repr(data['response']))
          " "$SELF_CHECK_LOG"
          echo "E2E INFERENCE PASSED"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  # Pure sdist for pip install from source (users provide llama-cpp-python).
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: github.event_name == 'release'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Verify the PUBLISHED artifact (not just the locally-built wheel) actually
  # installs and runs end-to-end across the same OS × Python matrix users
  # will hit. The in-build smoke tests locally-built dist/*.whl; this one
  # exercises the exact pip resolution, wheel selection, and install flow a
  # real user gets, including any way PyPI may have mangled the upload. If
  # this stage fails, the release is broken for users even though everything
  # upstream looked green.
  verify-pypi:
    if: github.event_name == 'release'
    needs: [publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          # 3.14 wheels for these platforms aren't produced upstream; see the
          # matching exclude in build-wheels above. Nothing to verify.
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install from PyPI (poll until indexed)
        shell: bash
        run: |
          set -euxo pipefail
          # PyPI warehouse indexes new uploads with a short lag. Poll up to
          # ~3 min so the verify lane isn't flaky on the wait.
          for i in $(seq 1 30); do
            if pip install --pre --dry-run "lilbee==${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
              echo "PyPI indexed on attempt ${i}"
              break
            fi
            sleep 6
            if [ "$i" = "30" ]; then
              echo "PyPI never indexed lilbee==${{ steps.version.outputs.version }} after 3 min"
              exit 1
            fi
          done
          pip install --pre "lilbee==${{ steps.version.outputs.version }}"

      - name: Confirm the resolved wheel actually has vendored llama_cpp libs
        shell: bash
        run: |
          set -euxo pipefail
          # Fail loudly if pip fell through to sdist or picked a wheel that
          # doesn't ship libllama. This is the specific failure mode a real
          # Arch user hit — pip picked something, lilbee imported, but the
          # shared library wasn't on disk.
          python -c "
          import pathlib, llama_cpp
          lib_dir = pathlib.Path(llama_cpp.__file__).parent / 'lib'
          files = sorted(lib_dir.glob('*')) if lib_dir.is_dir() else []
          print('llama_cpp/lib:', [f.name for f in files])
          assert any('llama' in f.name for f in files), (
              f'PyPI-resolved wheel is missing libllama.*: {[f.name for f in files]}'
          )
          "

      - name: self-check end-to-end
        shell: bash
        run: |
          set -euxo pipefail
          OUT=$(mktemp)
          RC=0
          lilbee --json self-check > "$OUT" 2>&1 || RC=$?
          echo "=== self-check output (exit=${RC}) ==="
          cat "$OUT"
          if [ "${RC}" != "0" ]; then
            echo "FAIL: self-check exited ${RC}"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().strip().splitlines()
          payload = next(line for line in reversed(raw) if line.strip().startswith('{'))
          data = json.loads(payload)
          assert data.get('ok'), f'PyPI install self-check failed: {data}'
          assert data.get('response','').strip(), f'empty response: {data}'
          print('PyPI install self-check PASSED:', repr(data['response']))
          " "$OUT"
