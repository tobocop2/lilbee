name: Diagnose closed lock descriptor

# Diagnostic run for a closed lock descriptor in the test suite. It starts only
# on a push to diag/fd-closer and never reaches main. The unit tests run on
# ubuntu with Python 3.13 under a bpftrace probe, with the conftest rules that
# hide a closed descriptor removed on this branch.
#
# The probe pays its cost only on a descriptor that holds a flock: the kernel
# keeps a map of held descriptors, reports a close of one, and signals the
# closing process, whose faulthandler dumps the closer's Python stack. The test
# plugin records the owner's Python stack at each flock.
#
# A zero is read only after these controls pass in the same job:
#   1. Canary: a test that closes a descriptor it does not own runs on two xdist
#      workers under the probe. The summary must print FDC-FOREIGN with the
#      closer and owner stacks for each worker, or the job fails.
#   2. Speed: the canary runs without and with the probe; FDC-TIME prints both.
#   3. Tests ran: each pytest run must report a floor of passed tests.

on:
  push:
    branches: [diag/fd-closer]

concurrency:
  group: diag-fd-closer
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Install bpftrace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bpftrace
          bpftrace --version
          sudo bpftrace -e 'BEGIN { printf("FDC-PROBE bpftrace runs\n"); exit(); }'

      - name: Canary without and with the probe (must show FDC-FOREIGN on two workers)
        shell: bash
        run: |
          set +e
          canary=(uv run pytest tests/test_fd_canary.py -n 2 --dist each --no-cov -p no:cacheprovider -q)
          for i in 1 2 3; do
            out="${{ runner.temp }}/canary-plain-$i.txt"
            start=$(date +%s.%N)
            "${canary[@]}" > "$out" 2>&1
            rc=$?
            end=$(date +%s.%N)
            echo "FDC-TIME plain run=$i rc=$rc seconds=$(awk -v a="$start" -v b="$end" 'BEGIN { printf "%.2f", b - a }') $(grep -E 'passed|failed' "$out" | tail -1)"
          done
          for i in 1 2 3; do
            dir="${{ runner.temp }}/canary-$i"
            bash .github/diag/fd_probe.sh "$dir" "${canary[@]}" > "${{ runner.temp }}/canary-$i.log" 2>&1
            echo "probed run=$i rc=$?"
            grep -E '^FDC-|passed|failed' "${{ runner.temp }}/canary-$i.log"
            python3 .github/diag/fd_tests_ran.py "${{ runner.temp }}/canary-$i.log" canary 8 || exit 1
            python3 .github/diag/fd_probe_summary.py "$dir" --expect-canary 2 > "$dir/summary.txt"
            ok=$?
            grep -E '^FDC-(RESULT|CANARY|DUMP)' "$dir/summary.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -m 1 -A 40 '^FDC-FOREIGN ' "$dir/summary.txt"
            test "$ok" -eq 0 || { echo "FDC-CANARY the probe has no power; do not read the zero"; exit 1; }
          done

      - name: Run unit tests under the probe
        shell: bash
        run: |
          set +e
          dir="${{ runner.temp }}/suite"
          bash .github/diag/fd_probe.sh "$dir" make test-ci 2>&1 | tee "${{ runner.temp }}/suite.log"
          rc="${PIPESTATUS[0]}"
          python3 .github/diag/fd_tests_ran.py "${{ runner.temp }}/suite.log" suite 3000 | tee -a "$GITHUB_STEP_SUMMARY"
          ctl="${PIPESTATUS[0]}"
          if [ "$ctl" -ne 0 ]; then exit "$ctl"; fi
          exit "$rc"
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee
          LILBEE_TEST_HANG_DUMP_S: "90"
          LILBEE_TEST_HANG_DUMP_DIR: ${{ runner.temp }}/hang-dumps

      - name: Name the closer of a held lock descriptor
        if: always()
        shell: bash
        run: |
          dir="${{ runner.temp }}/suite"
          test -f "$dir/bpftrace.txt" || { echo "FDC-RESULT no suite trace"; exit 0; }
          python3 .github/diag/fd_probe_summary.py "$dir" > "$dir/summary.txt"
          grep -E '^FDC-' "$dir/summary.txt" | head -400
          grep -E '^FDC-(RESULT|DUMP)' "$dir/summary.txt" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fd-probe-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/suite/
            ${{ runner.temp }}/canary-*/
            ${{ runner.temp }}/hang-dumps/
          retention-days: 7
          if-no-files-found: ignore
