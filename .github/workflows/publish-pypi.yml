name: Publish to PyPI

# Fast lane: build default wheels + sdist, upload via Trusted Publishing, then
# dispatch release-artifacts.yml for the slow rest (executables, CUDA wheels,
# Docker/Homebrew/AUR/Nix). Filename + the `pypi` env name are pinned by PyPI's
# trusted-publisher config -- don't rename.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.66b469)."
        required: true

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse if tag already has a non-prerelease published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo ${{ github.repository }} --json isPrerelease -q .isPrerelease 2>/dev/null | grep -q false; then
            echo "tag ${{ inputs.tag }} already has a non-prerelease GH release; refusing to overwrite" >&2
            exit 1
          fi
      - uses: actions/checkout@v6   # also the implicit tag-exists check
        with:
          ref: ${{ inputs.tag }}
      - name: Check tag matches pyproject version
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi

  build-wheels:
    needs: [guard]
    uses: ./.github/workflows/build-wheels.yml
    with:
      build_extras: false   # CUDA matrix lives in release-artifacts.yml
      ref: ${{ inputs.tag }}
    secrets: inherit

  publish-pypi:
    needs: [guard, build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/promote-pypi

  # Kick off the slow lane only after the PyPI upload lands.
  dispatch-release-artifacts:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release-artifacts.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-artifacts.yml --repo ${{ github.repository }} -f tag=${{ inputs.tag }}
