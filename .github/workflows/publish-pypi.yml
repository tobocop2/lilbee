name: Publish to PyPI

# Pure publish step -- no builds. Resolves the release-candidate.yml run that
# built this tag, downloads its default wheels + sdist, uploads them to PyPI,
# then dispatches the packaging fan-out (Docker / Homebrew / AUR / Nix), which
# uses the executables already attached to the GH release by that RC run. Run
# this after release-candidate.yml has built the tag and QA is green.
#
# Filename `publish-pypi.yml` + the `pypi` environment name are pinned by PyPI's
# trusted-publisher config -- don't rename.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.66b469)."
        required: true

permissions:
  contents: read
  id-token: write   # OIDC for Trusted Publishing
  actions: write    # cross-run artifact download (read) + dispatch publish-docker/packages

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      rc_run_id: ${{ steps.resolve.outputs.rc_run_id }}
    steps:
      - name: Refuse if tag already has a non-prerelease published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo ${{ github.repository }} --json isPrerelease -q .isPrerelease 2>/dev/null | grep -q false; then
            echo "tag ${{ inputs.tag }} already has a non-prerelease GH release; refusing to overwrite" >&2
            exit 1
          fi

      - uses: actions/checkout@v6   # also the implicit tag-exists check
        with:
          ref: ${{ inputs.tag }}

      - name: Check tag matches pyproject version
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi

      - name: Resolve the release-candidate run that built this tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "${TAG} -> ${SHA}"
          # Latest *successful* push-triggered RC run for this exact commit:
          # success => every wheel cell, the executables, and QA all passed,
          # so the artifacts are complete. (emergency-publish.yml is the path
          # to publish past a QA flake.)
          RC_ID=$(gh api "repos/${REPO}/actions/workflows/release-candidate.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=50" \
            --jq '.workflow_runs | sort_by(.run_started_at) | last | .id // empty')
          if [ -z "${RC_ID}" ]; then
            echo "no successful 'Release candidate' run for ${SHA}; push the tag (or re-run release-candidate.yml) and let it pass first" >&2
            exit 1
          fi
          echo "release-candidate run = ${RC_ID}"
          echo "rc_run_id=${RC_ID}" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: [guard]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6   # for the local promote-pypi action
      - uses: ./.github/actions/promote-pypi
        with:
          run_id: ${{ needs.guard.outputs.rc_run_id }}
          github_token: ${{ github.token }}

  # Docker / Homebrew / AUR / Nix consume the executables on the GH release that
  # the RC run already attached -- they don't need a build, just the tag.
  dispatch-fanout:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/fanout-packaging
        with:
          tag: ${{ inputs.tag }}
