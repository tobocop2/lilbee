name: Build default wheels

# The lilbee wheel is pure Python: the inference engine ships separately as the
# per-platform `lilbee-engine` wheel (build-multigpu.yml), pulled as a
# dependency. So there is one platform-independent wheel + an sdist, with no
# per-OS / per-CPython axis. Reusable; the caller (release-candidate.yml) keeps
# the artifacts.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the calling workflow's ref)."
        type: string
        default: ""
      release_tag:
        description: "GH release tag to eagerly attach each built wheel to (empty = artifacts only)."
        type: string
        default: ""

permissions:
  contents: write  # eager release_tag attach; otherwise read-only behavior is unchanged

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build pure wheel
        run: python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-default
          path: dist/*.whl

      # Call-mode eager attach: the caller created the pre-release shell, so
      # the wheel appears on the release as soon as this cell builds it.
      # Default wheels keep their canonical PyPI filenames.
      - name: Attach wheel to the GH pre-release (call mode)
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/*.whl --clobber

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
