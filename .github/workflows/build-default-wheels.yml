name: Build default wheels

# The default-backend wheels (Linux/Win = vulkan, macOS arm64 = metal) + sdist.
# Reusable; the caller (release-candidate.yml) keeps the artifacts. CUDA /
# Intel-Mac CPU wheels live in build-extra-wheels.yml.

on:
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: "Override llama-cpp-python version (blank = read from uv.lock)."
        default: ""
        required: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the calling workflow's ref)."
        type: string
        default: ""
      llama_cpp_version:
        description: "Override llama-cpp-python version (blank = read from uv.lock)."
        type: string
        default: ""
      release_tag:
        description: "GH release tag to eagerly attach each built wheel to (empty = artifacts only)."
        type: string
        default: ""

permissions:
  contents: write  # eager release_tag attach; otherwise read-only behavior is unchanged

jobs:
  build-default-wheels:
    # macOS stops at 3.13: no cp314 macOS-arm64 build for the vendored llama-cpp-python yet.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, backend: vulkan, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.11"}
          - {os: ubuntu-latest, backend: vulkan, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.12"}
          - {os: ubuntu-latest, backend: vulkan, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.13"}
          - {os: ubuntu-latest, backend: vulkan, wheel-plat: manylinux_2_17_x86_64.manylinux2014_x86_64, python-version: "3.14"}
          - {os: macos-latest,  backend: metal,  wheel-plat: macosx_11_0_arm64,                          python-version: "3.11"}
          - {os: macos-latest,  backend: metal,  wheel-plat: macosx_11_0_arm64,                          python-version: "3.12"}
          - {os: macos-latest,  backend: metal,  wheel-plat: macosx_11_0_arm64,                          python-version: "3.13"}
          # Intel Mac wheels live in build-extra-wheels (cross-compile is flaky).
          - {os: windows-latest, backend: vulkan, wheel-plat: win_amd64,                                 python-version: "3.11"}
          - {os: windows-latest, backend: vulkan, wheel-plat: win_amd64,                                 python-version: "3.12"}
          - {os: windows-latest, backend: vulkan, wheel-plat: win_amd64,                                 python-version: "3.13"}

    runs-on: ${{ matrix.os }}

    env:
      BACKEND: ${{ matrix.backend }}
      LLAMA_BUILD_DIR: "/tmp/llama-build"
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: pip install build

      - name: Build pure wheel
        run: python -m build --wheel

      - name: Install Vulkan loader (Linux)
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        shell: bash
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build llama-cpp-python from source
        shell: bash
        env:
          LLAMA_CPP_VERSION: ${{ inputs.llama_cpp_version }}   # blank -> build_llama_cpp.sh reads uv.lock
        run: bash tools/wheel-build/build_llama_cpp.sh

      - name: Vendor llama-cpp-python and retag wheel
        shell: bash
        run: >
          python -m tools.vendor.llama_cpp dist/*.whl
          --local-wheel ${{ env.LLAMA_BUILD_DIR }}/llama_cpp_python-*.whl
          --wheel-platform ${{ matrix.wheel-plat }}

      - name: Smoke test (native)
        shell: bash
        run: bash tools/wheel-build/smoke_wheel_full.sh 'dist/*.whl'

      - name: Upload default-backend wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-default-${{ matrix.os }}-${{ matrix.backend }}-py${{ matrix.python-version }}
          path: dist/*.whl

      # Call-mode eager attach: the caller created the pre-release shell, so
      # the wheel appears on the release as soon as this cell builds it.
      # Default wheels keep their canonical PyPI filenames.
      - name: Attach wheel to the GH pre-release (call mode)
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/*.whl --clobber

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
