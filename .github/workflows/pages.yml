name: Pages

# Marketing site at https://lilbee.sh/ plus the per-backend
# PEP 503 wheel indexes under /<backend>/. Decoupled from package distribution:
# it redeploys when site/ (or this workflow) changes on main, and after a
# successful Release candidate run (which builds the full wheel-* set -- default
# + CUDA extras), so wheel index subdirs stay current without making site
# updates wait for a release cycle.
#
# build-site and build-wheel-indexes run in parallel; deploy merges both.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Release candidate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      rc_run_id:
        description: "Override: pull wheel artifacts from this Release-candidate run id instead of the most recent."
        required: false
        default: ""

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # cross-run download-artifact for the wheel-* indexes
  pages: write
  id-token: write

jobs:
  build-site:
    # Skip only on cancelled RCs. Success and failure both produce valid wheel
    # artifacts (the build-default-wheels / build-multigpu legs run well before
    # QA or attach), so a flaky QA shouldn't strand the wheel indexes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: uv sync --locked --all-extras
        env:
          CMAKE_ARGS: >-
            -DGGML_METAL=OFF
            -DGGML_NATIVE=OFF
            ${{ runner.arch == 'X64' && '-DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX512=OFF' || '' }}

      - name: Build dev portal (marketing site + coverage + API docs)
        run: make docs-site
        env:
          LILBEE_DATA: ${{ runner.temp }}/lilbee

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-content
          path: site/
          retention-days: 1

  build-wheel-indexes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve wheel-source run id
        id: wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE_RUN_ID: ${{ inputs.rc_run_id }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE_RUN_ID}" ]; then
            run_id="${OVERRIDE_RUN_ID}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            # Plain main pushes / manual runs: pull from the most recent
            # completed Release candidate run -- the default + extra wheel
            # builds run as reusable calls inside it, so that run holds the
            # full wheel-* set whether or not a downstream leg (e.g. QA)
            # succeeded.
            run_id=$(gh run list \
              --workflow=release-candidate.yml \
              --status=completed \
              --limit=1 \
              --json databaseId \
              -q '.[0].databaseId // ""')
          fi
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"
          if [ -z "${run_id}" ]; then
            echo "No completed Release candidate run found; deploying site without wheel indexes."
          else
            echo "Pulling wheel artifacts from run ${run_id}."
          fi

      - name: Download wheel artifacts
        if: steps.wheels.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: "wheel-*"
          path: artifacts/
          run-id: ${{ steps.wheels.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PEP 503 wheel indexes
        run: |
          set -euo pipefail
          mkdir -p wheel-indexes
          if [ -d artifacts ] && [ -n "$(ls -A artifacts 2>/dev/null)" ]; then
            python3 tools/build_pep503_indexes.py artifacts wheel-indexes
          else
            # Keep the dir non-empty so upload-artifact / download-artifact
            # have a deterministic payload to round-trip.
            touch wheel-indexes/.empty
          fi

      - name: Upload wheel-indexes artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-indexes-content
          path: wheel-indexes/
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: [build-site, build-wheel-indexes]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-content
          path: site/

      - name: Download wheel-indexes artifact
        uses: actions/download-artifact@v8
        with:
          name: wheel-indexes-content
          path: wheel-indexes/

      - name: Merge wheel indexes into site
        run: |
          set -euo pipefail
          rm -f wheel-indexes/.empty
          if [ -n "$(ls -A wheel-indexes 2>/dev/null)" ]; then
            cp -R wheel-indexes/. site/
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
