name: Build multi-GPU server wheels and executables

# Opt-in lilbee[multi-gpu] artifacts: the per-backend lilbee-engine wheel
# (bundles the compiled llama.cpp llama-server). Built across the multi-GPU
# backend matrix (CUDA / Vulkan / ROCm) plus metal/cpu fallbacks.
#
# This is its OWN path. Every cell is continue-on-error and the artifacts use a
# distinct prefix (wheel-multigpu-*) so a failure here never blocks the
# default wheels, extra wheels, or executable release paths.

on:
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: "Override the llama-cpp-python release tag whose vendored llama.cpp gets built (blank = the pin in engine-versions.env)."
        default: ""
        required: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the calling workflow's ref)."
        type: string
        default: ""
      llama_cpp_version:
        description: "Override the llama-cpp-python release tag whose vendored llama.cpp gets built (blank = the pin in engine-versions.env)."
        type: string
        default: ""

permissions:
  contents: write  # publish freshly built engines to the engine-binaries mirror release

jobs:
  build-multigpu:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: cross-vendor Vulkan, CUDA (multi-GPU via tensor-split), ROCm, cpu fallback.
          #
          # Every Linux row pins its runner rather than tracking ubuntu-latest.
          # The wheels link against the runner's glibc, so the label moving from
          # 22.04 to 24.04 silently raised what they need from 2.35 to 2.38
          # while they went on declaring manylinux_2_17. pip installed them and
          # the engine died in the loader on every current-stable distro.
          - {os: ubuntu-22.04,  backend: vulkan, wheel-plat: manylinux_2_17_x86_64}
          - {os: ubuntu-22.04,  backend: cu124,  wheel-plat: manylinux_2_17_x86_64, cuda: "12.4.0"}
          - {os: ubuntu-22.04,  backend: cu125,  wheel-plat: manylinux_2_17_x86_64, cuda: "12.5.0"}
          - {os: ubuntu-22.04,  backend: rocm,   wheel-plat: manylinux_2_17_x86_64}
          - {os: ubuntu-22.04,  backend: cpu,    wheel-plat: manylinux_2_17_x86_64}
          # Windows: Vulkan, CUDA, cpu fallback.
          - {os: windows-2022,   backend: cu124,  wheel-plat: win_amd64, cuda: "12.4.0"}
          - {os: windows-2022,   backend: cu125,  wheel-plat: win_amd64, cuda: "12.5.0"}
          - {os: windows-latest, backend: vulkan, wheel-plat: win_amd64}
          - {os: windows-latest, backend: cpu,    wheel-plat: win_amd64}
          # macOS arm64: Metal (single Apple GPU) + cpu fallback.
          - {os: macos-latest, backend: metal, wheel-plat: macosx_11_0_arm64}
          - {os: macos-latest, backend: cpu,   wheel-plat: macosx_11_0_arm64}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    env:
      BACKEND: ${{ matrix.backend }}
      # Hosted runners have ~7GB RAM; two parallel nvcc/ROCm compile jobs is the
      # most that fits. Plain C++ backends are lighter and take four.
      ENGINE_BUILD_JOBS: ${{ (startsWith(matrix.backend, 'cu') || matrix.backend == 'rocm') && '2' || '4' }}
      LLAMA_BUILD_DIR: "/tmp/llama-build"
      LLAMA_CPP_VERSION: ${{ inputs.llama_cpp_version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      PKG_DIR: packaging/engine-wheel

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # MSVC FileTracker dies past MAX_PATH; /tmp maps under AppData and overflows.
      - name: Use a short build path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LLAMA_BUILD_DIR=/c/lb" >> "$GITHUB_ENV"

      # Every engine source is tag-pinned in engine-versions.env, so the same
      # key means byte-identical output. On a hit the toolchain installs and the
      # build are skipped wholesale.
      - name: Resolve the engine key
        id: engine-key
        shell: bash
        run: |
          set -euo pipefail
          echo "key=engine-${{ matrix.os }}-${{ matrix.backend }}-tk${{ matrix.cuda }}-llcp${{ inputs.llama_cpp_version }}-${{ hashFiles('engine-versions.env', 'tools/wheel-build/build_llama_server.sh', 'tools/wheel-build/bundle_rocm_runtime.sh', 'tools/wheel-build/cmake_args.sh', 'tools/wheel-build/install_gpu_toolkit.sh') }}" >> "$GITHUB_OUTPUT"

      # The mirror first, same as the executable builds. This job publishes to it
      # but used to never read it, so every warm run rebuilt engines the mirror
      # already carried: 88 min for a CUDA cell that a fetch resolves in seconds.
      - name: Restore the engine from the release mirror
        id: engine-mirror
        shell: bash
        run: |
          set -uo pipefail
          if bash tools/wheel-build/ci_mirror.sh fetch \
            "${{ steps.engine-key.outputs.key }}" packaging/engine-wheel/lilbee_engine/bin; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the built engine
        id: engine-cache
        if: steps.engine-mirror.outputs.restored != 'true'
        uses: actions/cache/restore@v4
        with:
          path: packaging/engine-wheel/lilbee_engine/bin
          key: ${{ steps.engine-key.outputs.key }}

      - name: Decide whether the engine still needs building
        id: engine
        shell: bash
        env:
          MIRRORED: ${{ steps.engine-mirror.outputs.restored }}
          CACHED: ${{ steps.engine-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "${MIRRORED}" = "true" ] || [ "${CACHED}" = "true" ]; then
            echo "needs-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs-build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build wheel

      - name: Install CUDA Toolkit (Linux)
        if: steps.engine.outputs.needs-build == 'true' && startsWith(matrix.backend, 'cu') && runner.os == 'Linux'
        shell: bash
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install CUDA Toolkit (Windows)
        if: steps.engine.outputs.needs-build == 'true' && startsWith(matrix.backend, 'cu') && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust","visual_studio_integration"]'

      - name: Install Vulkan loader (Linux)
        if: steps.engine.outputs.needs-build == 'true' && matrix.backend == 'vulkan' && runner.os == 'Linux'
        shell: bash
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Install Vulkan SDK (Windows)
        if: steps.engine.outputs.needs-build == 'true' && matrix.backend == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Install ROCm (Linux)
        if: steps.engine.outputs.needs-build == 'true' && matrix.backend == 'rocm' && runner.os == 'Linux'
        shell: bash
        run: bash tools/wheel-build/install_gpu_toolkit.sh

      - name: Set up Go (for llama-swap + gguf-parser)
        if: steps.engine.outputs.needs-build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build the engine binaries from source
        if: steps.engine.outputs.needs-build == 'true'
        shell: bash
        run: bash tools/wheel-build/build_llama_server.sh

      # The one gate that can prove the ROCm bundle is complete, and it has to run
      # somewhere without ROCm. Every machine able to build ROCm has it installed, so
      # any loader check run on this runner resolves against /opt/rocm and passes a
      # bundle that would fail on the machine this wheel exists for. A container with
      # no ROCm in it is that machine. No LD_LIBRARY_PATH: the baked $ORIGIN runpath
      # is what a user gets, so it is what gets tested.
      #
      # The apt line is the wheel's host contract, and the reason it is a short line.
      # These are the pieces that must match the running kernel driver rather than
      # travel with the userspace; everything else ROCm needs is in the bundle. It
      # runs before the mirror step so a bad bundle is never published for later runs
      # to restore, and on restored engines too, which is when a stale one surfaces.
      - name: The ROCm bundle resolves on a machine with no ROCm
        if: matrix.backend == 'rocm'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/${PKG_DIR}/lilbee_engine/bin:/bundle:ro" ubuntu:22.04 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq libnuma1 libdrm2 libdrm-amdgpu1 libelf1 >/dev/null
            status=0
            checked=0
            for lib in /bundle/libggml-hip.so* /bundle/llama-server; do
              [ -e "${lib}" ] || continue
              checked=$((checked + 1))
              missing=$(ldd "${lib}" 2>&1 | grep "not found" || true)
              if [ -n "${missing}" ]; then
                echo "UNRESOLVED in $(basename "${lib}"):" >&2
                echo "${missing}" >&2
                status=1
              fi
            done
            # Without this the step passes on an empty bundle: an unmatched glob makes
            # ldd fail, the grep finds no "not found", and nothing was ever checked.
            if [ "${checked}" -lt 2 ]; then
              echo "checked ${checked} file(s); expected libggml-hip.so and llama-server" >&2
              exit 1
            fi
            if [ "${status}" != 0 ]; then
              echo "the ROCm bundle does not close: the libraries above are neither" >&2
              echo "beside the binary nor installed by the apt line in this step" >&2
              exit 1
            fi
            echo "every ROCm dependency resolves with no ROCm installed"
          '

      # The mirror is the only place a built engine is stored. Writing it to the
      # Actions cache as well cost ~2.5 GiB of a 10 GiB cap to duplicate what the
      # mirror already holds durably, and that cap is what the Nuitka object
      # caches need: those cannot live on a release, engines can.
      - name: Mirror the built engine
        if: steps.engine.outputs.needs-build == 'true' && github.ref_type != 'tag'
        continue-on-error: true
        uses: ./.github/actions/publish-engine-asset
        with:
          engine-key: ${{ steps.engine-key.outputs.key }}
          token: ${{ github.token }}

      - name: Set wheel version to the lilbee version
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          python - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("packaging/engine-wheel/pyproject.toml")
          text = re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', path.read_text(), count=1)
          path.write_text(text)
          PY

      - name: Build the lilbee-engine wheel
        shell: bash
        working-directory: ${{ env.PKG_DIR }}
        run: |
          python -m build --wheel
          python -m wheel tags --remove --platform-tag "${{ matrix.wheel-plat }}" dist/*.whl

      # Hard gate for every cell, because the exec smoke below cannot cover any of
      # this: a driverless runner never loads a GPU backend, so the binary starts
      # clean whether or not the build produced one. Read the wheel instead and fail
      # here, where the diagnosis is cheap. Running it only for the CUDA cells is
      # what let the rocm wheel ship as a CPU build for as long as its cmake flag
      # was misspelled. The backend is passed because a wheel this fresh has no
      # build tag to read it from yet.
      # `python`, not `python3`: setup-python does not put a python3 on PATH for the
      # Windows cells.
      - name: The wheel carries the backend it claims
        shell: bash
        run: python tools/qa/assert_engine_bundle.py --backend "${{ matrix.backend }}" "${PKG_DIR}"/dist/*.whl

      # Hard gate: a lib-less bundle fails at exec with a loader error. This
      # step swallowing failures (continue-on-error) is how a broken metal
      # bundle once shipped. Skipped for GPU-driver backends, whose binaries
      # link libcuda.so.1 / libamdhip64.so and cannot load on the driverless
      # runner; their closure is identical to the CPU/Vulkan/Metal cells that
      # do run this gate.
      - name: Smoke test the bundled binary
        if: ${{ !startsWith(matrix.backend, 'cu') && matrix.backend != 'rocm' && matrix.backend != 'sycl' }}
        shell: bash
        run: |
          set -x
          bin_dir="${PKG_DIR}/lilbee_engine/bin"
          # Exact names only: llama-server* also matches the Windows engine's
          # llama-server-impl.dll, which is not executable.
          exe=$(find "${bin_dir}" -maxdepth 1 -type f \( -name 'llama-server' -o -name 'llama-server.exe' \) | head -1)
          [ -n "${exe}" ] || { echo "no bundled binary found"; exit 1; }
          "${exe}" --help

      - name: Upload the multi-gpu wheel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wheel-multigpu-${{ matrix.os }}-${{ matrix.backend }}
          path: ${{ env.PKG_DIR }}/dist/*.whl
          if-no-files-found: warn
