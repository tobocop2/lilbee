name: AUR Check

on:
  push:
    branches: [main]
    paths:
      - packaging/aur/**
      - packaging/tools/render_pkgbuild.sh
      - .github/workflows/aur-check.yml
  pull_request:
    paths:
      - packaging/aur/**
      - packaging/tools/render_pkgbuild.sh
      - .github/workflows/aur-check.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck + namcap + .SRCINFO sync
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD/packaging:/pkg" -w /pkg archlinux:latest bash -euc '
              echo DisableSandbox >> /etc/pacman.conf
              pacman -Syu --noconfirm namcap shellcheck pacman-contrib diffutils >/dev/null
              useradd -m b
              chown -R b /pkg
              shellcheck tools/render_pkgbuild.sh
              for pkg in lilbee lilbee-cuda lilbee-compat; do
                shellcheck -s bash -e SC2034,SC2154 "aur/${pkg}/PKGBUILD"
                out=$(namcap "aur/${pkg}/PKGBUILD")
                if [ -n "$out" ]; then
                  echo "$out"
                  exit 1
                fi
                ( cd "aur/${pkg}" && su b -c "makepkg --printsrcinfo" > "/tmp/${pkg}.SRCINFO" )
                diff -u "aur/${pkg}/.SRCINFO" "/tmp/${pkg}.SRCINFO"
              done
            '
