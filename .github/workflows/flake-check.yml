name: Flake Check

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - sources.json
      - sources-cuda.json
      - .github/workflows/flake-check.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - sources.json
      - sources-cuda.json
      - .github/workflows/flake-check.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: statix
        run: nix run nixpkgs#statix -- check flake.nix
      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail flake.nix
      - name: nixfmt --check
        run: nix run nixpkgs#nixfmt-rfc-style -- --check flake.nix

  check:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: nix flake check
        run: nix flake check --all-systems
      - name: nix build
        run: nix build .#packages.${{ matrix.system }}.default --no-link --print-out-paths
