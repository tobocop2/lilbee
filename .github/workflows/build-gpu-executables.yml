name: Build GPU executables

# GPU-flavored standalone executables (CUDA and ROCm). Called from
# release-candidate.yml alongside the Vulkan/Metal build, or dispatched for an
# already-released tag. Cells are independent; a failure blocks nothing. Under
# workflow_call the caller's attach-prerelease step collects the artifacts;
# under workflow_dispatch each cell attaches to the named release itself.

on:
  workflow_dispatch:
    inputs:
      tag:
        # Empty builds artifacts only: both attach steps are gated on a tag, so
        # this is how you validate a cell without touching a release.
        description: "Release tag to attach GPU executables to (empty = artifacts only)."
        required: false
        default: ""
      skip_tests:
        description: "Build even if the smoke step fails (re-run past a known-flaky cell)."
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build at (defaults to caller's ref)."
        type: string
        default: ""
      skip_tests:
        description: "Build even if the smoke step fails."
        type: boolean
        default: false
      release_tag:
        description: "GH release tag to eagerly attach each built executable to (empty = artifacts only)."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-gpu-executables-${{ inputs.tag || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux CUDA cells run on ubuntu-22.04, not the manylinux container: install_gpu_toolkit.sh is apt-based, and glibc 2.35 stays above the README's 2.28 floor.
          # cu121 pins llama-cpp-version explicitly: CUDA 12.1's nvcc can't compile
          # the newer llama.cpp CUDA kernels (half-conversion in allreduce.cu).
          - os: ubuntu-22.04
            backend: cu121
            cuda: "12.1.0"
            asset_name: lilbee-linux-x86_64-cu121
            llama-cpp-version: "0.3.30"
          - os: ubuntu-22.04
            backend: cu124
            cuda: "12.4.0"
            asset_name: lilbee-linux-x86_64-cu124
          - os: ubuntu-22.04
            backend: cu125
            cuda: "12.5.0"
            asset_name: lilbee-linux-x86_64-cu125
          # Pre-Haswell-safe cell: swaps in lancedb==X.Y.Z+compat from the lilbee.sh/compat
          # index and holds the launcher to an x86-64-v2 baseline, so the binary runs on
          # Sandy Bridge / Bulldozer CPUs that SIGILL on the stock lancedb wheel. Fully
          # self-contained -- no pyproject/uv.lock footprint, so it cannot affect any
          # other cell or job. Fails at the override step until that index is live; the
          # job's continue-on-error keeps that failure off the release path.
          - os: ubuntu-22.04
            backend: cu124
            cuda: "12.4.0"
            asset_name: lilbee-compat-linux-x86_64-cu124
            compat: true
            march: "x86-64-v2"
          # Here, not release.yml's matrix, for the same reason as the CUDA cells:
          # install_gpu_toolkit.sh is apt-based and manylinux is not. Linux only.
          - os: ubuntu-22.04
            backend: rocm
            asset_name: lilbee-linux-x86_64-rocm
          # Windows cu121 dropped: MSVC 14.44 on windows-2022 requires CUDA 12.4+.
          - os: windows-2022
            backend: cu124
            cuda: "12.4.0"
            asset_name: lilbee-windows-x86_64-cu124.exe
          - os: windows-2022
            backend: cu125
            cuda: "12.5.0"
            asset_name: lilbee-windows-x86_64-cu125.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Compute version
        # NUITKA_VERSION: int-tuple form Nuitka --product-version accepts.
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          NUITKA_VERSION=$(echo "$VERSION" | tr -cs '0-9' ' ' | awk '{ printf "%s.%s.%s.%s", $1, $2, $3, $4 }')
          echo "LILBEE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LILBEE_NUITKA_VERSION=$NUITKA_VERSION" >> "$GITHUB_ENV"

      # Installed unconditionally on purpose. Gating it on an engine-available
      # probe would save 4.9 min here, but the probe and the fetch are separate
      # requests: an asset present at probe time and unfetchable a minute later
      # leaves the cell building the engine with no CUDA_PATH. This job is
      # continue-on-error, so that failure would not stop the release, it would
      # ship without this CUDA binary.
      - name: Install the GPU toolkit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          # ROCm 7.2 unpacks ~20 GB and this cell then stacks Nuitka's standalone tree
          # on top, so report headroom rather than failing opaquely on the first run.
          df -h /
          bash tools/wheel-build/install_gpu_toolkit.sh
          df -h /

      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust","visual_studio_integration"]'

      - name: Set up ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          # Tag-scoped cache saves are unrestorable by future runs; don't evict useful ones.
          save: ${{ github.ref_type != 'tag' }}
          # The compat cell compiles at -march=x86-64-v2; without it in the key it
          # shares an entry with the stock cell and each poisons the other.
          key: nuitka-${{ matrix.os }}-${{ matrix.backend }}${{ matrix.march && format('-{0}', matrix.march) || '' }}
          max-size: '2G'

      # ccache-action only writes a config file, and Nuitka overrides that with its
      # own CCACHE_DIR unless one is already exported (nuitka/build/SconsCaching.py),
      # so none of its C objects ever reached the cached directory. Env beats config.
      - name: Point ccache at the cached directory
        if: runner.os == 'Linux'
        shell: bash
        run: echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_ENV"

      # The mirror is readable from a tag ref, unlike the Actions cache, so a
      # release starts warm from whatever the last build contributed, and can
      # contribute its own compile back.
      - name: Restore the Nuitka cache from the mirror
        id: nuitka-mirror
        if: runner.os == 'Windows'
        uses: ./.github/actions/nuitka-object-cache
        with:
          phase: restore
          key: nuitka-objects-${{ matrix.os }}-${{ hashFiles('uv.lock') }}

      # Windows only, and it is the whole point: these cells are the release
      # terminus, MSVC has no ccache, and this workflow had no object cache of
      # any kind, so every CUDA Windows build compiled ~9056 files from cold.
      # release.yml has carried the same mechanism for its Windows cells.
      # Not added on Linux: ccache above already caches those objects, and a
      # second copy would only consume a cap these legs do not need (they finish
      # hours before the Windows terminus).
      - name: Restore Nuitka cache (Windows)
        if: runner.os == 'Windows' && steps.nuitka-mirror.outputs.restored != 'true'
        uses: actions/cache/restore@v6
        with:
          path: nuitka-cache
          key: nuitka-${{ matrix.os }}-${{ matrix.asset_name }}-${{ github.run_id }}
          restore-keys: nuitka-${{ matrix.os }}-

      - name: Point Nuitka at the cache dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "NUITKA_CACHE_DIR=${GITHUB_WORKSPACE}/nuitka-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --extra release && uv pip install 'nuitka[onefile]>=4.0,<5' pip

      - name: Verify extras installed in build venv
        shell: bash
        # --no-sync is load-bearing: re-syncing reinstalls python-multipart and shadows the shim.
        # One retry with a purged uv cache: a hardlink-fallback race can leave a
        # mixed-version package on disk (one litellm's redis_cache.py beside an
        # older constants.py) that only an import catches. Without the purge the
        # re-sync relinks the same corrupted cache entries.
        run: |
          check() { uv run --no-sync python -c "import crawl4ai, litellm, spacy, graspologic_native; print('extras OK')"; }
          if ! check; then
            echo "extras import failed; purging the uv cache and re-syncing once"
            uv cache clean
            uv sync --reinstall --extra release
            uv pip install 'nuitka[onefile]>=4.0,<5' pip
            check
          fi

      # compat cell only: replace the stock lancedb the sync installed with the
      # pre-Haswell build from the private index. --no-deps leaves the rest of the
      # synced venv untouched, so this swap is local to this cell -- pyproject and
      # uv.lock never change, and no other cell or job sees it. Pinned to the latest
      # stable lancedb for Python (0.34), served by the fork as +compat; bump when the
      # fork moves. continue-on-error keeps a missing wheel off the release.
      - name: Swap in the pre-Haswell lancedb
        if: matrix.compat
        shell: bash
        run: |
          uv pip install --reinstall --no-deps \
            --extra-index-url https://lilbee.sh/compat/ \
            lancedb==0.34.0+compat

      # Build the self-contained CUDA llama-server (binary + ggml/llama/mtmd libs
      # with a baked rpath) and install lilbee_engine so Nuitka bundles the
      # whole engine into the onefile.
      - name: Bundle llama-server
        uses: ./.github/actions/bundle-llama-server
        with:
          backend: ${{ matrix.backend }}
          llama-cpp-version: ${{ matrix.llama-cpp-version }}
          cache-env: ${{ matrix.os }}
          toolkit-version: ${{ matrix.cuda }}

      - name: Build executable
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          PRODUCT_VERSION: ${{ env.LILBEE_NUITKA_VERSION }}
          # compat cell only: hold Nuitka's C output to the pre-Haswell baseline so the
          # launcher layer (not just lancedb) runs on old silicon. Empty elsewhere.
          CFLAGS: ${{ matrix.march && format('-march={0}', matrix.march) || '' }}
          CXXFLAGS: ${{ matrix.march && format('-march={0}', matrix.march) || '' }}
        run: bash tools/wheel-build/build_lilbee_binary.sh

      # Save even when the smoke test later fails: the objects are still valid
      # and make the retry fast. Non-tag only, like ccache.
      - name: Save Nuitka cache (Windows)
        if: runner.os == 'Windows' && github.ref_type != 'tag'
        uses: actions/cache/save@v6
        with:
          path: nuitka-cache
          key: nuitka-${{ matrix.os }}-${{ matrix.asset_name }}-${{ github.run_id }}

      # Any ref, including tags. See the action for why this cannot be an
      # actions/cache save.
      # success() is explicit rather than load-bearing: steps already carry an
      # implicit success(), so a failed compile would not reach this anyway. It
      # is spelled out because first-publish-wins makes a partial cache permanent
      # for the key, and that guarantee should not rest on an implicit default.
      #
      # continue-on-error because this is a pure optimisation sitting between a
      # finished compile and the artifact upload. ci_mirror.sh soft-fails on its
      # own errors, but mktemp and wc run under set -euo pipefail and can still
      # hard-exit; on a soft cell that would go green with the asset missing.
      - name: Publish the Nuitka cache to the mirror
        if: success() && runner.os == 'Windows' && steps.nuitka-mirror.outputs.restored != 'true'
        continue-on-error: true
        uses: ./.github/actions/nuitka-object-cache
        with:
          phase: publish
          key: nuitka-objects-${{ matrix.os }}-${{ hashFiles('uv.lock') }}
          token: ${{ github.token }}


      # The wheel gate can't cover the executable: Nuitka rebundles the engine, and on
      # Linux it takes the .so files through --include-package-data rather than the
      # verbatim --include-data-files path (build_lilbee_binary.sh skips *.so there).
      # If it ever drops them the onefile ships a GPU engine with no GPU runtime, and
      # a driverless runner can't tell by executing it. Assert against the standalone
      # tree Nuitka leaves under dist/ before it is packed into the onefile.
      - name: The executable bundles the runtime it links
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          # Nuitka names the standalone tree after the entry module (__main__.dist);
          # find it by shape rather than by that name.
          bin_dir=$(find dist -type d -path '*lilbee_engine/bin' | head -1)
          [ -n "${bin_dir}" ] || { echo "no bundled engine found under dist/" >&2; exit 1; }
          echo "ENGINE_BIN_DIR=${bin_dir}" >> "${GITHUB_ENV}"
          # rocBLAS also loads Tensile kernels as data, so the directory is required
          # the same way the libraries are.
          if [ "${BACKEND}" = "rocm" ]; then
            required="libamdhip64.so.* librocblas.so.* libhipblas.so.* rocblas/library"
          elif [ "${RUNNER_OS}" = "Windows" ]; then
            required="cudart64_*.dll cublas64_*.dll cublasLt64_*.dll"
          else
            required="libcudart.so.* libcublas.so.* libcublasLt.so.*"
          fi
          for pattern in ${required}; do
            compgen -G "${bin_dir}/${pattern}" >/dev/null || {
              echo "${pattern} missing from the engine Nuitka bundled into ${{ matrix.asset_name }}" >&2
              exit 1
            }
          done
          echo "the bundled engine carries its ${BACKEND} runtime"

          # Presence is not resolution. The wheel path caught libamd_comgr => not found
          # on a bundle that passed exactly the checks above, and this tree is what
          # every ROCm channel ships, so run the same loader gate against it.
          if [ "${BACKEND}" = "rocm" ]; then
            bash tools/qa/assert_rocm_bundle_loads.sh "${bin_dir}"
          fi

      # A ROCm build serves only the cards it carries rocBLAS kernels for, and
      # rocm_runtime.py reads those kernels back at startup to refuse a host it
      # cannot serve. A downloader has to make the same call before it has a
      # binary to read, so publish the list beside the binary. Generated from the
      # bundle being shipped, so it cannot describe a different build.
      - name: Publish the gfx targets this ROCm build ships kernels for
        if: matrix.backend == 'rocm'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifest="dist/${{ matrix.asset_name }}.gfx.txt"
          for kernels in "${ENGINE_BIN_DIR}"/rocblas/library/TensileLibrary_lazy_gfx*.dat; do
            name="${kernels##*/}"
            name="${name#TensileLibrary_lazy_}"
            echo "${name%.dat}"
          done | sort -u > "${manifest}"
          # An empty manifest reads as "supports nothing" and would turn every AMD
          # host away, so a bundle with no kernels fails the cell instead.
          [ -s "${manifest}" ] || { echo "the bundle carries no rocBLAS kernels" >&2; exit 1; }
          cat "${manifest}"
          [ -z "${TAG}" ] || gh release upload "${TAG}" "${manifest}" --clobber

      - name: Smoke test
        # GPU cells run on GPU-less runners: the bundled server links the vendor
        # driver (libcuda.so.1, libamdhip64 against /dev/kfd), so it cannot run
        # inference here. The full
        # inference sweep runs on the CPU/Vulkan/Metal executables, which share
        # the identical Nuitka bundling and engine-copy logic; this cell gates
        # the launcher itself (--version/--help, frozen-multiprocessing).
        if: inputs.skip_tests != true
        shell: bash
        run: |
          set -euxo pipefail
          EXE="./dist/${{ matrix.asset_name }}"
          EXPECTED=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)

          STDERR=$(mktemp)
          ACTUAL=$("$EXE" --version 2>"$STDERR")
          echo "Expected: lilbee ${EXPECTED}"
          echo "Actual:   ${ACTUAL}"
          cat "$STDERR"
          test "${ACTUAL}" = "lilbee ${EXPECTED}"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --version produced typer/runtime errors on stderr"
            exit 1
          fi

          "$EXE" --help > /dev/null 2>"$STDERR"
          if grep -qE "No such option|Type not yet supported|RuntimeError|ModuleNotFoundError" "$STDERR"; then
            echo "FAIL: --help produced typer/runtime errors on stderr"
            cat "$STDERR"
            exit 1
          fi

          echo "CUDA smoke test passed (--version, --help)"

      - name: Upload binary as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          # The second path exists on the ROCm cell only; upload-artifact warns
          # for a pattern that matches nothing and uploads the rest.
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.gfx.txt
          # The onefile payload is already zstd-compressed; deflating it again buys nothing.
          compression-level: 0

      # workflow_call eager attach: the caller created the pre-release shell,
      # so each cell's exe appears on the release as soon as it builds.
      - name: Attach binary to the GH pre-release (call mode)
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" "dist/${{ matrix.asset_name }}" --clobber

      # Standalone-dispatch mode: attach to the named release tag directly.
      - name: Attach binary to release (dispatch mode)
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/${{ matrix.asset_name }}
          fail_on_unmatched_files: true
