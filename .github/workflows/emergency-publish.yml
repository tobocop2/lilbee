name: Emergency publish

# Like publish.yml, but accepts a release-candidate run whose QA flaked --
# two-step confirm (tag + "skip-qa" token). Still resolves an RC run that built
# the tag's artifacts (this is publish-past-a-bad-QA, not build-from-scratch),
# downloads its default wheels + sdist, uploads to PyPI, then fans out packaging.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.66b458)."
        required: true
      confirm:
        description: 'Type "skip-qa" to confirm you are publishing past a flaky/failed QA run.'
        required: true

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: emergency-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      rc_run_id: ${{ steps.resolve.outputs.rc_run_id }}
    steps:
      - name: Validate confirm token
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "skip-qa" ]; then
            echo "confirm token must be exactly 'skip-qa'" >&2
            exit 1
          fi

      - name: Refuse if tag already has a non-prerelease published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo ${{ github.repository }} --json isPrerelease -q .isPrerelease 2>/dev/null | grep -q false; then
            echo "tag ${{ inputs.tag }} already has a non-prerelease GH release; refusing to overwrite" >&2
            exit 1
          fi

      - uses: actions/checkout@v6   # also the implicit tag-exists check
        with:
          ref: ${{ inputs.tag }}

      - name: Check tag matches pyproject version
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi

      - name: Resolve the release-candidate run that built this tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "${TAG} -> ${SHA}"
          # Latest *completed* push-triggered RC run (any conclusion -- that's
          # the point of this lane). If its default-wheels build was incomplete,
          # the PyPI upload below ships a partial set; look at the RC run first.
          RC_ID=$(gh api "repos/${REPO}/actions/workflows/release-candidate.yml/runs?head_sha=${SHA}&event=push&status=completed&per_page=50" \
            --jq '.workflow_runs | sort_by(.run_started_at) | last | .id // empty')
          if [ -z "${RC_ID}" ]; then
            echo "no completed 'Release candidate' run for ${SHA}; push the tag first" >&2
            exit 1
          fi
          echo "release-candidate run = ${RC_ID}"
          echo "rc_run_id=${RC_ID}" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: [guard]
    runs-on: ubuntu-latest
    environment: pypi
    # See publish.yml: pypa/gh-action-pypi-publish is a Docker action and
    # misbehaves when called from a local composite action, so it runs here directly.
    steps:
      - name: Download the lilbee wheel from the release-candidate run
        uses: actions/download-artifact@v4
        with:
          name: wheel-default
          path: dist/
          run-id: ${{ needs.guard.outputs.rc_run_id }}
          github-token: ${{ github.token }}
      # Default-backend engine wheels (vulkan linux/win, metal mac) so
      # `pip install lilbee` resolves lilbee-llama-server from PyPI.
      - name: Download the default engine wheels from the release-candidate run
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-multigpu-*-@(vulkan|metal)
          path: dist/
          merge-multiple: true
          run-id: ${{ needs.guard.outputs.rc_run_id }}
          github-token: ${{ github.token }}
      - name: Download sdist from the release-candidate run
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
          run-id: ${{ needs.guard.outputs.rc_run_id }}
          github-token: ${{ github.token }}
      - name: List wheels + sdist
        run: ls -lh dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  dispatch-fanout:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/fanout-packaging
        with:
          tag: ${{ inputs.tag }}
