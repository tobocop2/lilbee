name: Emergency publish

# Like publish-pypi.yml but skips the QA review -- two-step confirm (tag +
# "skip-qa" token). Builds default wheels + sdist, uploads, then dispatches
# release-artifacts.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.6.66b458)."
        required: true
      confirm:
        description: 'Type "skip-qa" to confirm you are bypassing the QA matrix.'
        required: true

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: emergency-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirm token
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "skip-qa" ]; then
            echo "confirm token must be exactly 'skip-qa' to bypass the QA matrix" >&2
            exit 1
          fi
      - name: Refuse if tag already has a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "tag ${{ inputs.tag }} already has a published GH release; refusing to overwrite" >&2
            exit 1
          fi
      - uses: actions/checkout@v6   # also the implicit tag-exists check
        with:
          ref: ${{ inputs.tag }}
      - name: Check tag matches pyproject version
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(awk -F'"' '/^version *= */ { print $2; exit }' pyproject.toml)
          if [ "v${VERSION}" != "${EXPECTED_TAG}" ] && [ "${VERSION}" != "${EXPECTED_TAG}" ]; then
            echo "tag ${EXPECTED_TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi

  build-wheels:
    needs: [guard]
    uses: ./.github/workflows/build-wheels.yml
    with:
      build_extras: false   # CUDA matrix lives in release-artifacts.yml
      ref: ${{ inputs.tag }}
    secrets: inherit

  publish-pypi:
    needs: [guard, build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/promote-pypi

  dispatch-release-artifacts:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release-artifacts.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-artifacts.yml --repo ${{ github.repository }} -f tag=${{ inputs.tag }}
