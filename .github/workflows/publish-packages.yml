name: Publish Packages

on:
  workflow_run:
    workflows: ["Release Executables"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. v0.6.66b456)"
        required: true

jobs:
  resolve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      sha_linux: ${{ steps.info.outputs.sha_linux }}
      sha_macos_arm64: ${{ steps.info.outputs.sha_macos_arm64 }}
      sha_macos_x86_64: ${{ steps.info.outputs.sha_macos_x86_64 }}
    steps:
      - name: Resolve tag and asset digests
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="${{ github.event.workflow_run.head_branch }}"
          else
            tag="${{ inputs.tag }}"
          fi
          version="${tag#v}"
          gh api "/repos/${REPO}/releases/tags/${tag}" \
            --jq '.assets[] | "\(.name)\t\(.digest|sub("sha256:"; ""))"' > /tmp/assets.tsv

          get_sha() {
            awk -F'\t' -v name="$1" '$1 == name { print $2 }' /tmp/assets.tsv
          }
          sha_linux=$(get_sha lilbee-linux-x86_64)
          sha_macos_arm64=$(get_sha lilbee-macos-arm64)
          sha_macos_x86_64=$(get_sha lilbee-macos-x86_64)

          [ -n "$sha_linux" ] || { echo "lilbee-linux-x86_64 missing from release ${tag}"; exit 1; }
          [ -n "$sha_macos_arm64" ] || { echo "lilbee-macos-arm64 missing from release ${tag}"; exit 1; }

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha_linux=$sha_linux"
            echo "sha_macos_arm64=$sha_macos_arm64"
            echo "sha_macos_x86_64=$sha_macos_x86_64"
          } >> "$GITHUB_OUTPUT"

  homebrew:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone tap, render formula in place, push
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "lilbee-bot"
          git config --global user.email "lilbee-bot@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tobocop2/homebrew-lilbee.git" /tmp/tap
          extra_args=()
          if [ -n "${{ needs.resolve.outputs.sha_macos_x86_64 }}" ]; then
            extra_args+=(--sha-macos-x86_64 "${{ needs.resolve.outputs.sha_macos_x86_64 }}")
          fi
          python3 packaging/tools/render_formula.py /tmp/tap/Formula/lilbee.rb \
            --version "${{ needs.resolve.outputs.version }}" \
            --sha-macos-arm64 "${{ needs.resolve.outputs.sha_macos_arm64 }}" \
            --sha-linux-x86_64 "${{ needs.resolve.outputs.sha_linux }}" \
            "${extra_args[@]}"
          cd /tmp/tap
          git add Formula/lilbee.rb
          if git diff --cached --quiet; then
            echo "no formula changes; skipping push"
            exit 0
          fi
          git commit -m "lilbee ${{ needs.resolve.outputs.version }}"
          git push

  aur:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Render PKGBUILD
        run: |
          bash packaging/tools/render_pkgbuild.sh \
            packaging/aur/lilbee/PKGBUILD \
            "${{ needs.resolve.outputs.version }}" \
            "${{ needs.resolve.outputs.sha_linux }}"
      - name: Regenerate .SRCINFO
        run: |
          docker run --rm -v "$PWD/packaging/aur/lilbee:/pkg" -w /pkg archlinux:latest \
            bash -c 'pacman -Sy --noconfirm pacman-contrib >/dev/null && \
                     useradd -m b && chown -R b /pkg && \
                     su b -c "makepkg --printsrcinfo" > .SRCINFO'
      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: lilbee
          pkgbuild: packaging/aur/lilbee/PKGBUILD
          assets: packaging/aur/lilbee/.SRCINFO
          commit_username: tobocop
          commit_email: tobias.perelstein@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "lilbee ${{ needs.resolve.outputs.version }}"
          force_push: false

  nix-flake:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update sources.json
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA_LINUX: ${{ needs.resolve.outputs.sha_linux }}
          SHA_DARWIN: ${{ needs.resolve.outputs.sha_macos_arm64 }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg sha_linux "$SHA_LINUX" \
            --arg sha_darwin "$SHA_DARWIN" \
            '{
              version: $version,
              systems: {
                "x86_64-linux":   { asset: "lilbee-linux-x86_64", sha256: $sha_linux },
                "aarch64-darwin": { asset: "lilbee-macos-arm64",  sha256: $sha_darwin }
              }
            }' > sources.json
      - name: Validate flake against new sources
        run: nix flake check --all-systems
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "lilbee-bot"
          git config user.email "lilbee-bot@users.noreply.github.com"
          git add sources.json
          if git diff --cached --quiet; then
            echo "no source changes; skipping push"
            exit 0
          fi
          git commit -m "lilbee ${{ needs.resolve.outputs.version }} (flake)"
          git push origin main
