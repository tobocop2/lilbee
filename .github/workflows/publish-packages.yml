name: Publish Packages

# Updates the Homebrew formula, AUR PKGBUILD, and Nix flake to pin a tag's
# GH-release binaries, and publishes the npm launcher packages. Dispatched by
# publish.yml / emergency-publish.yml (and by hand) once the binaries are
# attached.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. v0.6.66b469)."
        required: true
      channels:
        # Flatpak is not here: every variant publishes from publish-flatpak.yml,
        # which serializes them against the shared OSTree repo.
        description: "Channels to publish: 'all' or a comma list of homebrew,aur,nix,snap,scoop,npm."
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: publish-packages-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      sha_linux: ${{ steps.info.outputs.sha_linux }}
      sha_macos_arm64: ${{ steps.info.outputs.sha_macos_arm64 }}
      sha_macos_x86_64: ${{ steps.info.outputs.sha_macos_x86_64 }}
      sha_windows: ${{ steps.info.outputs.sha_windows }}
      sha_windows_cu125: ${{ steps.info.outputs.sha_windows_cu125 }}
      sha_windows_cu124: ${{ steps.info.outputs.sha_windows_cu124 }}
    steps:
      - name: Resolve tag and asset digests
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${tag#v}"
          gh api "/repos/${REPO}/releases/tags/${tag}" \
            --jq '.assets[] | "\(.name)\t\(.digest|sub("sha256:"; ""))\t\(.size)"' > /tmp/assets.tsv

          get_sha() {
            awk -F'\t' -v name="$1" '$1 == name { print $2 }' /tmp/assets.tsv
          }
          sha_linux=$(get_sha lilbee-linux-x86_64)
          sha_macos_arm64=$(get_sha lilbee-macos-arm64)
          sha_macos_x86_64=$(get_sha lilbee-macos-x86_64)
          sha_windows=$(get_sha lilbee-windows-x86_64.exe)
          sha_windows_cu125=$(get_sha lilbee-windows-x86_64-cu125.exe)
          sha_windows_cu124=$(get_sha lilbee-windows-x86_64-cu124.exe)

          [ -n "$sha_linux" ] || { echo "lilbee-linux-x86_64 missing from release ${tag}"; exit 1; }
          [ -n "$sha_macos_arm64" ] || { echo "lilbee-macos-arm64 missing from release ${tag}"; exit 1; }
          # Soft in the release fan-out, so it can be absent; the Intel url still
          # interpolates the new version, so publishing without it ships a 404.
          [ -n "$sha_macos_x86_64" ] || { echo "lilbee-macos-x86_64 missing from release ${tag}; re-run once the soft Intel cell has uploaded it"; exit 1; }

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha_linux=$sha_linux"
            echo "sha_macos_arm64=$sha_macos_arm64"
            echo "sha_macos_x86_64=$sha_macos_x86_64"
            echo "sha_windows=$sha_windows"
            echo "sha_windows_cu125=$sha_windows_cu125"
            echo "sha_windows_cu124=$sha_windows_cu124"
          } >> "$GITHUB_OUTPUT"

  homebrew:
    needs: resolve
    if: inputs.channels == 'all' || contains(inputs.channels, 'homebrew')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build render-args
        id: args
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA_MACOS_ARM64: ${{ needs.resolve.outputs.sha_macos_arm64 }}
          SHA_LINUX: ${{ needs.resolve.outputs.sha_linux }}
          SHA_MACOS_X86_64: ${{ needs.resolve.outputs.sha_macos_x86_64 }}
        run: |
          args="--version ${VERSION} --sha-macos-arm64 ${SHA_MACOS_ARM64}"
          args="${args} --sha-macos-x86_64 ${SHA_MACOS_X86_64} --sha-linux-x86_64 ${SHA_LINUX}"
          echo "value=${args}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-homebrew-formula
        with:
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula-path: Formula/lilbee.rb
          render-args: ${{ steps.args.outputs.value }}
          commit-message: "lilbee ${{ needs.resolve.outputs.version }}"

  aur:
    needs: resolve
    if: inputs.channels == 'all' || contains(inputs.channels, 'aur')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-aur-package
        with:
          pkgname: lilbee
          pkgbuild-dir: packaging/aur/lilbee
          version: ${{ needs.resolve.outputs.version }}
          sha-linux: ${{ needs.resolve.outputs.sha_linux }}
          aur-ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  snap:
    needs: resolve
    if: inputs.channels == 'all' || contains(inputs.channels, 'snap')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify the release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha_linux }}
        run: |
          set -euo pipefail
          mkdir -p packaging/snap/payload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p lilbee-linux-x86_64 -O packaging/snap/payload/lilbee-linux-x86_64
          echo "$SHA  packaging/snap/payload/lilbee-linux-x86_64" | sha256sum -c -
          chmod +x packaging/snap/payload/lilbee-linux-x86_64
      - name: Render snapcraft.yaml
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash packaging/tools/render_snapcraft.sh packaging/snap/snapcraft.yaml "$VERSION"
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap
      - name: Smoke test
        env:
          EXPECTED: lilbee ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sudo snap install "${{ steps.build.outputs.snap }}" --dangerous --classic
          ACTUAL=$(/snap/bin/lilbee --version)
          echo "snap: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        # Stable asset name so releases/latest/download/lilbee-linux-x86_64.snap works.
        run: |
          cp "${{ steps.build.outputs.snap }}" lilbee-linux-x86_64.snap
          gh release upload "$TAG" lilbee-linux-x86_64.snap --repo "$GITHUB_REPOSITORY" --clobber

  nix-flake:
    needs: resolve
    if: inputs.channels == 'all' || contains(inputs.channels, 'nix')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build systems JSON
        id: sys
        env:
          SHA_LINUX: ${{ needs.resolve.outputs.sha_linux }}
          SHA_DARWIN: ${{ needs.resolve.outputs.sha_macos_arm64 }}
        run: |
          systems=$(jq -nc \
            --arg sha_linux "$SHA_LINUX" \
            --arg sha_darwin "$SHA_DARWIN" \
            '{
              "x86_64-linux":   { asset: "lilbee-linux-x86_64", sha256: $sha_linux },
              "aarch64-darwin": { asset: "lilbee-macos-arm64",  sha256: $sha_darwin }
            }')
          echo "value=${systems}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-flake-sources
        with:
          target-file: sources.json
          version: ${{ needs.resolve.outputs.version }}
          systems-json: ${{ steps.sys.outputs.value }}
          commit-message: "lilbee ${{ needs.resolve.outputs.version }} (flake)"

  scoop:
    needs: resolve
    if: inputs.channels == 'all' || contains(inputs.channels, 'scoop')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Render manifest
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA_WINDOWS: ${{ needs.resolve.outputs.sha_windows }}
          SHA_WINDOWS_CU125: ${{ needs.resolve.outputs.sha_windows_cu125 }}
          SHA_WINDOWS_CU124: ${{ needs.resolve.outputs.sha_windows_cu124 }}
        run: |
          set -euo pipefail
          [ -n "$SHA_WINDOWS" ] || { echo "lilbee-windows-x86_64.exe missing from release"; exit 1; }
          [ -n "$SHA_WINDOWS_CU125" ] || { echo "lilbee-windows-x86_64-cu125.exe missing from release"; exit 1; }
          [ -n "$SHA_WINDOWS_CU124" ] || { echo "lilbee-windows-x86_64-cu124.exe missing from release"; exit 1; }
          python packaging/tools/render_scoop_manifest.py bucket/lilbee.json \
            --version "$VERSION" --sha-windows "$SHA_WINDOWS" \
            --sha-windows-cu125 "$SHA_WINDOWS_CU125" --sha-windows-cu124 "$SHA_WINDOWS_CU124"
          python packaging/tools/render_scoop_manifest.py bucket/lilbee-cuda.json \
            --cuda --version "$VERSION" --sha-windows-cu125 "$SHA_WINDOWS_CU125"
      - name: Install from the rendered manifest and smoke test
        uses: ./.github/actions/validate-scoop-install
        with:
          manifest-path: bucket/lilbee.json
          expected-version: lilbee ${{ needs.resolve.outputs.version }}
      - name: Uninstall lilbee so lilbee-cuda can claim the shim
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
          scoop uninstall lilbee
          if ($LASTEXITCODE -ne 0) { throw "scoop uninstall failed" }
      - name: Install from the rendered CUDA manifest and smoke test
        uses: ./.github/actions/validate-scoop-install
        with:
          manifest-path: bucket/lilbee-cuda.json
          expected-version: lilbee ${{ needs.resolve.outputs.version }}
      - name: Commit and push the manifest
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "lilbee-bot"
          git config user.email "lilbee-bot@users.noreply.github.com"
          git add bucket/lilbee.json bucket/lilbee-cuda.json
          if git diff --cached --quiet; then
            echo "no manifest changes; skipping push"
            exit 0
          fi
          git commit -m "lilbee ${VERSION} (scoop)"
          # nix-flake commits to main from a sibling job; rebase-retry on a race.
          bash tools/ci/git_push_retry.sh

  # Publishes the npm launcher. It downloads the release binaries at first run,
  # so it must publish after they are attached -- `resolve` is that gate.
  # Nothing is committed back: the version is stamped into the working copy
  # only. Auth is npm trusted publishing: the registry takes the job's OIDC
  # token, so there is no npm token anywhere and provenance is automatic. That
  # trust is configured per package on npmjs.com and names this filename, so
  # renaming this workflow breaks the publish -- see
  # packages/lilbee/docs/publishing.md.
  npm:
    needs: resolve
    if: inputs.channels == 'all' || contains(inputs.channels, 'npm')
    runs-on: ubuntu-latest
    # Mirrors the PyPI job: the `npm` environment name is pinned by npm's
    # trusted-publisher config (like `pypi` in publish.yml) -- don't rename.
    environment: npm
    permissions:
      contents: read
      id-token: write   # OIDC for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Use an npm that can do trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
          npm --version

      # Before the stamp: `npm ci` wants the lockfile to match package.json.
      - name: Install launcher dependencies
        run: npm ci --no-audit --no-fund
        working-directory: packages/lilbee

      - name: Test the npm launcher
        run: npm test
        working-directory: packages/lilbee

      - name: Stamp the release into the package
        id: stamp
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node packages/lilbee/tools/stamp-release.mjs "${TAG}")
          echo "${TAG} -> npm ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish lilbee
        if: vars.NPM_TRUSTED_PUBLISHING == 'enabled'
        run: npm publish --access public
        working-directory: packages/lilbee

      - name: Say why nothing published
        if: vars.NPM_TRUSTED_PUBLISHING != 'enabled'
        run: echo "The repository variable NPM_TRUSTED_PUBLISHING is not 'enabled', so ${{ steps.stamp.outputs.version }} did not publish to npm. Finish the one-time npmjs setup in packages/lilbee/docs/publishing.md, then set the variable."
