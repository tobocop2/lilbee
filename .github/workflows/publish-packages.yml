name: Publish Packages

# Updates the Homebrew formula, AUR PKGBUILD, and Nix flake to pin a tag's
# GH-release binaries. Dispatched by publish.yml / emergency-publish.yml
# (and by hand) once the binaries are attached.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish (e.g. v0.6.66b469)."
        required: true

permissions:
  contents: read

concurrency:
  group: publish-packages-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      sha_linux: ${{ steps.info.outputs.sha_linux }}
      sha_macos_arm64: ${{ steps.info.outputs.sha_macos_arm64 }}
      sha_macos_x86_64: ${{ steps.info.outputs.sha_macos_x86_64 }}
      size_linux: ${{ steps.info.outputs.size_linux }}
    steps:
      - name: Resolve tag and asset digests
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${tag#v}"
          gh api "/repos/${REPO}/releases/tags/${tag}" \
            --jq '.assets[] | "\(.name)\t\(.digest|sub("sha256:"; ""))\t\(.size)"' > /tmp/assets.tsv

          get_sha() {
            awk -F'\t' -v name="$1" '$1 == name { print $2 }' /tmp/assets.tsv
          }
          get_size() {
            awk -F'\t' -v name="$1" '$1 == name { print $3 }' /tmp/assets.tsv
          }
          sha_linux=$(get_sha lilbee-linux-x86_64)
          size_linux=$(get_size lilbee-linux-x86_64)
          sha_macos_arm64=$(get_sha lilbee-macos-arm64)
          sha_macos_x86_64=$(get_sha lilbee-macos-x86_64)

          [ -n "$sha_linux" ] || { echo "lilbee-linux-x86_64 missing from release ${tag}"; exit 1; }
          [ -n "$sha_macos_arm64" ] || { echo "lilbee-macos-arm64 missing from release ${tag}"; exit 1; }

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha_linux=$sha_linux"
            echo "sha_macos_arm64=$sha_macos_arm64"
            echo "sha_macos_x86_64=$sha_macos_x86_64"
            echo "size_linux=$size_linux"
          } >> "$GITHUB_OUTPUT"

  homebrew:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build render-args
        id: args
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA_MACOS_ARM64: ${{ needs.resolve.outputs.sha_macos_arm64 }}
          SHA_LINUX: ${{ needs.resolve.outputs.sha_linux }}
          SHA_MACOS_X86_64: ${{ needs.resolve.outputs.sha_macos_x86_64 }}
        run: |
          args="--version ${VERSION} --sha-macos-arm64 ${SHA_MACOS_ARM64} --sha-linux-x86_64 ${SHA_LINUX}"
          if [ -n "${SHA_MACOS_X86_64}" ]; then
            args="${args} --sha-macos-x86_64 ${SHA_MACOS_X86_64}"
          fi
          echo "value=${args}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-homebrew-formula
        with:
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula-path: Formula/lilbee.rb
          render-args: ${{ steps.args.outputs.value }}
          commit-message: "lilbee ${{ needs.resolve.outputs.version }}"

  aur:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/publish-aur-package
        with:
          pkgname: lilbee
          pkgbuild-dir: packaging/aur/lilbee
          version: ${{ needs.resolve.outputs.version }}
          sha-linux: ${{ needs.resolve.outputs.sha_linux }}
          aur-ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  flatpak:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/publish-flatpak
        with:
          pages-token: ${{ secrets.FLATPAK_PAGES_TOKEN }}
          gpg-private-key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          version: ${{ needs.resolve.outputs.version }}
          sha-linux: ${{ needs.resolve.outputs.sha_linux }}
          size-linux: ${{ needs.resolve.outputs.size_linux }}
          tag: ${{ needs.resolve.outputs.tag }}

  snap:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify the release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha_linux }}
        run: |
          set -euo pipefail
          mkdir -p packaging/snap/payload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p lilbee-linux-x86_64 -O packaging/snap/payload/lilbee-linux-x86_64
          echo "$SHA  packaging/snap/payload/lilbee-linux-x86_64" | sha256sum -c -
          chmod +x packaging/snap/payload/lilbee-linux-x86_64
      - name: Render snapcraft.yaml
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash packaging/tools/render_snapcraft.sh packaging/snap/snapcraft.yaml "$VERSION"
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap
      - name: Smoke test
        env:
          EXPECTED: lilbee ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sudo snap install "${{ steps.build.outputs.snap }}" --dangerous --classic
          ACTUAL=$(/snap/bin/lilbee --version)
          echo "snap: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" "${{ steps.build.outputs.snap }}" --repo "$GITHUB_REPOSITORY" --clobber

  nix-flake:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build systems JSON
        id: sys
        env:
          SHA_LINUX: ${{ needs.resolve.outputs.sha_linux }}
          SHA_DARWIN: ${{ needs.resolve.outputs.sha_macos_arm64 }}
        run: |
          systems=$(jq -nc \
            --arg sha_linux "$SHA_LINUX" \
            --arg sha_darwin "$SHA_DARWIN" \
            '{
              "x86_64-linux":   { asset: "lilbee-linux-x86_64", sha256: $sha_linux },
              "aarch64-darwin": { asset: "lilbee-macos-arm64",  sha256: $sha_darwin }
            }')
          echo "value=${systems}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-flake-sources
        with:
          target-file: sources.json
          version: ${{ needs.resolve.outputs.version }}
          systems-json: ${{ steps.sys.outputs.value }}
          commit-message: "lilbee ${{ needs.resolve.outputs.version }} (flake)"
