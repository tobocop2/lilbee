name: Warm engine cache

# GitHub evicts caches unaccessed for 7 days. Without a weekly run the pins can
# sit unchanged past that window and the next release rebuilds every engine
# cold. A change to an engine pin or build script is built by the engine job of
# ci.yml instead, inside the required ci-result check, so that a backend that
# does not compile blocks the merge.
#
# It passes `required: true` for the same reason that job does: a failed cell
# must fail the run, not drop out of a green one.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: warm-engine-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    permissions:
      contents: write  # build-multigpu publishes the engines it builds to the mirror release
    uses: ./.github/workflows/build-multigpu.yml
    with:
      required: true
      mirror: true
    secrets: inherit
