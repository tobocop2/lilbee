name: Bundle llama-server
description: >-
  Build the self-contained llama-server (binary + ggml/llama/mtmd libs with a
  baked rpath) and install the lilbee_llama_server package so the Nuitka build
  bundles the whole local engine into the onefile. Run before the executable is
  built.
inputs:
  backend:
    description: "Backend matching the executable (cpu|vulkan|metal|cu121..cu125|rocm|sycl)."
    required: true
  llama-cpp-version:
    description: >-
      llama.cpp source tag to build from (blank = the pin in build_llama_server.sh).
      Set for a backend whose toolchain can't compile the default (e.g. CUDA 12.1).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Build the self-contained llama-server
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
        LLAMA_CPP_VERSION: ${{ inputs.llama-cpp-version }}
        LLAMA_BUILD_DIR: /tmp/llama-server-build
      run: bash tools/wheel-build/build_llama_server.sh
    - name: Install lilbee_llama_server into the build venv
      shell: bash
      # The wheel now carries the binary AND its backend libs (self-contained,
      # rpath-baked); Nuitka bundles both via --include-package-data and the
      # runtime resolver finds the binary via lilbee_llama_server.get_binary_path().
      run: uv pip install --no-deps ./packaging/llama-server-wheel
