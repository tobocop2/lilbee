name: Publish Flatpak
description: "Build the Flatpak from the release binary, smoke-test it, push the signed OSTree repo to the flatpak-lilbee Pages repo, and attach a .flatpakref installer to the release."

inputs:
  pages-token:
    description: "Token with push rights to the flatpak-lilbee repo."
    required: true
  gpg-private-key:
    description: "ASCII-armored private key that signs the OSTree repo."
    required: true
  version:
    description: "Release version (e.g. 0.6.66b495)."
    required: true
  sha-linux:
    description: "sha256 of the Linux binary release asset."
    required: true
  size-linux:
    description: "Size in bytes of the Linux binary release asset."
    required: true
  tag:
    description: "Release tag the .flatpakref installer is attached to."
    required: true
  # The four below default to the stock build; the compat channel overrides them.
  app-id:
    description: "Flatpak app-id to build, install, and bundle."
    required: false
    default: io.github.tobocop2.lilbee
  manifest-path:
    description: "Path to the Flatpak manifest."
    required: false
    default: packaging/flatpak/io.github.tobocop2.lilbee.yml
  asset-name:
    description: "Release asset the extra-data source points at."
    required: false
    default: lilbee-linux-x86_64
  ref-name:
    description: "Filename of the single-file .flatpakref installer."
    required: false
    default: lilbee.flatpakref

runs:
  using: composite
  steps:
    - name: Install flatpak-builder and runtimes
      shell: bash
      run: |
        set -euo pipefail
        # The runner image ships third-party apt repos this job never installs
        # from, and packages.microsoft.com answers 403 often enough to kill the
        # step. Only the distro sources stay.
        sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
        sudo apt-get update -qq
        sudo apt-get install -y -qq flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y --noninteractive flathub \
          org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

    - name: Import signing key
      id: gpg
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        set -euo pipefail
        GNUPGHOME=$(mktemp -d)
        echo "$GPG_PRIVATE_KEY" | gpg --homedir "$GNUPGHOME" --batch --import
        KEYID=$(gpg --homedir "$GNUPGHOME" --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')
        [ -n "$KEYID" ] || { echo "no secret key found in FLATPAK_GPG_PRIVATE_KEY"; exit 1; }
        # The flatpakref advertises the key the repo is signed with, exported here
        # rather than committed, so the two cannot drift apart.
        gpg --homedir "$GNUPGHOME" --export "$KEYID" > /tmp/flatpak-signing-key.gpg
        {
          echo "gnupghome=$GNUPGHOME"
          echo "keyid=$KEYID"
          echo "pubkey=/tmp/flatpak-signing-key.gpg"
        } >> "$GITHUB_OUTPUT"

    - name: Clone the pages repo
      shell: bash
      env:
        PAGES_TOKEN: ${{ inputs.pages-token }}
      run: |
        set -euo pipefail
        git config --global user.name "lilbee-bot"
        git config --global user.email "lilbee-bot@users.noreply.github.com"
        git clone "https://x-access-token:${PAGES_TOKEN}@github.com/tobocop2/flatpak-lilbee.git" /tmp/pages
        # git can't track empty directories, so OSTree's empty-but-required dirs are
        # dropped on the round-trip through the pages repo. Restore them or build-update-repo
        # aborts with "Listing refs: opendir(refs/remotes): No such file or directory".
        if [ -f /tmp/pages/repo/config ]; then
          mkdir -p /tmp/pages/repo/refs/remotes /tmp/pages/repo/refs/mirrors \
            /tmp/pages/repo/tmp /tmp/pages/repo/state /tmp/pages/repo/extensions
        fi

    - name: Render manifest and build into the OSTree repo
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA_LINUX: ${{ inputs.sha-linux }}
        SIZE_LINUX: ${{ inputs.size-linux }}
        MANIFEST: ${{ inputs.manifest-path }}
        ASSET: ${{ inputs.asset-name }}
        GNUPGHOME: ${{ steps.gpg.outputs.gnupghome }}
        KEYID: ${{ steps.gpg.outputs.keyid }}
      run: |
        set -euo pipefail
        bash packaging/tools/render_flatpak_manifest.sh \
          "$MANIFEST" "$VERSION" "$SHA_LINUX" "$SIZE_LINUX" "$ASSET"
        flatpak-builder --user --force-clean --disable-rofiles-fuse \
          --repo=/tmp/pages/repo --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME" \
          /tmp/flatpak-build "$MANIFEST"
        flatpak build-update-repo --generate-static-deltas --prune --prune-depth=2 \
          --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME" /tmp/pages/repo

    # Not `flatpak build-bundle`: a bundle carries the payload, and every channel
    # keeps its binary out of the repo as extra-data, whose pointer build-bundle
    # drops from the bundle's metadata (flatpak#1334). A flatpakref carries the
    # remote instead, so the install goes through the repo that has the pointer.
    - name: Render the flatpakref installers
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        REF: ${{ inputs.ref-name }}
        PUBKEY: ${{ steps.gpg.outputs.pubkey }}
      run: |
        set -euo pipefail
        render() {
          python3 packaging/tools/render_flatpakref.py \
            "packaging/flatpak/${APP_ID}.metainfo.xml" --gpg-key-file "$PUBKEY" "$@"
        }
        render --repo-url https://tobocop2.github.io/flatpak-lilbee/repo/ \
          --remote-name lilbee > "/tmp/${REF}"
        # The same installer aimed at the repo this run just built, so the smoke
        # test exercises the file being shipped rather than a hand-added remote.
        render --repo-url file:///tmp/pages/repo \
          --remote-name lilbee-local > /tmp/local.flatpakref

    - name: Smoke test the flatpakref install
      shell: bash
      env:
        EXPECTED: lilbee ${{ inputs.version }}
        APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        flatpak install --user -y --noninteractive --from /tmp/local.flatpakref
        ACTUAL=$(flatpak run "$APP_ID" --version)
        echo "flatpak: $ACTUAL"
        test "$ACTUAL" = "$EXPECTED"

    - name: Push the pages repo
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        cd /tmp/pages
        git add -A
        if git diff --cached --quiet; then
          echo "no repo changes; skipping push"
          exit 0
        fi
        git commit -m "lilbee ${VERSION} (flatpak)"
        # Deliberately a plain push, not tools/ci/git_push_retry.sh: build-update-repo
        # regenerates this repo's summary and static deltas wholesale, so rebasing onto
        # a sibling's commit would drop the app it just published. The flatpak jobs
        # serialize on a shared `concurrency` group instead, so there is no race to retry.
        git push

    - name: Attach the installer to the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        REF: ${{ inputs.ref-name }}
      run: |
        set -euo pipefail
        gh release upload "$TAG" "/tmp/${REF}" --repo "$GITHUB_REPOSITORY" --clobber
