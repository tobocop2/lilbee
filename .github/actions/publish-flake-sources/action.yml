name: Publish Nix flake sources
description: "Write a sources JSON file, validate the flake against it, and land it on main through an auto-merging pull request. Used by the four publish-*packages workflows."

inputs:
  target-file:
    description: "Path of the sources file to write (e.g. sources.json, sources-cuda.json)."
    required: true
  version:
    description: "Release version (without leading 'v')."
    required: true
  systems-json:
    description: "JSON-encoded systems map, e.g. {\"x86_64-linux\":{\"asset\":\"...\",\"sha256\":\"...\"}}."
    required: true
  commit-message:
    description: "Commit message for the sources file commit, and the pull request's title."
    required: true
  dry-run:
    description: "When 'true', print the branch, commit and pull request it would make, and push nothing."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - name: Write sources file
      shell: bash
      env:
        TARGET_FILE: ${{ inputs.target-file }}
        VERSION: ${{ inputs.version }}
        SYSTEMS_JSON: ${{ inputs.systems-json }}
      run: |
        set -euo pipefail
        jq -n \
          --arg version "$VERSION" \
          --argjson systems "$SYSTEMS_JSON" \
          '{ version: $version, systems: $systems }' \
          > "$TARGET_FILE"

    - name: Validate flake against new sources
      shell: bash
      run: nix flake check --all-systems

    # The checkout's deploy key pushes the branch; GH_TOKEN opens the pull request.
    - name: Open the pin pull request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_FILE: ${{ inputs.target-file }}
        VERSION: ${{ inputs.version }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        git config user.name "lilbee-bot"
        git config user.email "lilbee-bot@users.noreply.github.com"
        bash "${GITHUB_WORKSPACE}/scripts/flake_pin_pr.sh"
