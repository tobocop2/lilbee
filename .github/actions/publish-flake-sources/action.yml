name: Publish Nix flake sources
description: "Write a sources JSON file, validate the flake against it, and land it on main through an auto-merging pull request. Used by the four publish-*packages workflows."

inputs:
  target-file:
    description: "Path of the sources file to write (e.g. sources.json, sources-cuda.json)."
    required: true
  version:
    description: "Release version (without leading 'v')."
    required: true
  systems-json:
    description: "JSON-encoded systems map, e.g. {\"x86_64-linux\":{\"asset\":\"...\",\"sha256\":\"...\"}}."
    required: true
  commit-message:
    description: "Commit message for the sources file commit, and the pull request's title."
    required: true
  dry-run:
    description: "When 'true', print the branch, commit and pull request it would make, and push nothing."
    required: false
    default: "false"
  deploy-key:
    description: "The FLAKE_PINS_SSH_KEY secret the caller's checkout used. A real run fails when it is empty; a dry run does not need it."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Without the key, checkout falls back to the job token. A push made with
    # that token starts no CI, so the pin pull request never merges. A run
    # without the repository secrets, as in a fork, fails here by design.
    - name: The pin push needs the flake pins deploy key
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        if [ "${DRY_RUN}" = "true" ]; then
          echo "dry run: nothing is pushed, so the deploy key is not needed"
          exit 0
        fi
        [ -n "${DEPLOY_KEY}" ] || { echo "FLAKE_PINS_SSH_KEY is not set, so the flake pin cannot land"; exit 1; }
    - uses: DeterminateSystems/nix-installer-action@v23
    - name: Write sources file
      shell: bash
      env:
        TARGET_FILE: ${{ inputs.target-file }}
        VERSION: ${{ inputs.version }}
        SYSTEMS_JSON: ${{ inputs.systems-json }}
      run: |
        set -euo pipefail
        jq -n \
          --arg version "$VERSION" \
          --argjson systems "$SYSTEMS_JSON" \
          '{ version: $version, systems: $systems }' \
          > "$TARGET_FILE"

    - name: Validate flake against new sources
      shell: bash
      run: nix flake check --all-systems

    # The checkout's deploy key pushes the branch; GH_TOKEN opens the pull request.
    - name: Open the pin pull request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_FILE: ${{ inputs.target-file }}
        VERSION: ${{ inputs.version }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        git config user.name "lilbee-bot"
        git config user.email "lilbee-bot@users.noreply.github.com"
        bash "${GITHUB_WORKSPACE}/scripts/flake_pin_pr.sh"
