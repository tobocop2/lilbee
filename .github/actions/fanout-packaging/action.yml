name: Fan out downstream packaging
description: "Trigger publish-docker.yml and publish-packages.yml for a tag once the Linux + macOS-arm64 executables are attached to the GH release. Waits up to 5 hours for those to land before failing loudly. Caller needs actions:write."

inputs:
  tag:
    description: "Tag whose executables are on the GH release (e.g. v0.6.66b469)."
    required: true
  wait_minutes:
    description: "Max minutes to wait for the downstream-consumed executables to be attached before failing."
    required: false
    default: "300"

runs:
  using: composite
  steps:
    # publish-docker.yml curls the GH-release Linux binary; publish-packages.yml
    # pins Linux and macOS-arm64 by hash. Nothing downstream consumes
    # lilbee-windows-x86_64.exe, so it is not in the wait list -- waiting on
    # the ~3h45m Windows nuitka build would block Homebrew / AUR / Nix / Docker
    # for hours after their inputs are already on the release. Linux ~2h15m
    # and macOS-arm64 ~1h25m are the real gate.
    - name: Wait for the release to have the downstream-consumed executables
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        WAIT_MINUTES: ${{ inputs.wait_minutes }}
      run: |
        set -uo pipefail
        deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
        while true; do
          names=$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || echo "")
          missing=""
          for a in lilbee-linux-x86_64 lilbee-macos-arm64; do
            case " ${names} " in *" ${a} "*) ;; *) missing="${missing} ${a}" ;; esac
          done
          if [ -z "${missing}" ]; then
            echo "release ${TAG} has the downstream-consumed executables; proceeding with fan-out"
            break
          fi
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::release ${TAG} still missing executables after ${WAIT_MINUTES} minutes:${missing}"
            exit 1
          fi
          echo "release ${TAG} missing executables:${missing}; sleeping 60s"
          sleep 60
        done

    - name: Trigger Publish Docker Image
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run publish-docker.yml \
          --repo ${{ github.repository }} \
          -f tag=${{ inputs.tag }}

    - name: Trigger Publish Packages
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run publish-packages.yml \
          --repo ${{ github.repository }} \
          -f tag=${{ inputs.tag }}
