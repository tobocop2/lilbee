name: Fan out downstream packaging
description: "Trigger publish-docker.yml and publish-packages.yml for a tag once its executables are attached to the GH release. Waits up to 45 minutes for the executables to land before failing loudly. Caller needs actions:write."

inputs:
  tag:
    description: "Tag whose executables are on the GH release (e.g. v0.6.66b469)."
    required: true
  wait_minutes:
    description: "Max minutes to wait for all three executables to be attached before failing."
    required: false
    default: "45"

runs:
  using: composite
  steps:
    # publish-docker.yml curls the GH-release Linux binary; publish-packages.yml
    # pins all three by hash. Both consume the release, not PyPI, so this waits
    # on the executables -- it does not wait on the wheels.
    - name: Wait for the release to have the platform executables
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        WAIT_MINUTES: ${{ inputs.wait_minutes }}
      run: |
        set -uo pipefail
        # Default wheels finish ~25 min into the RC run; the executables take
        # another 15-25 min on top, so a 45 minute ceiling covers the common
        # case with headroom. Past the ceiling something is wrong with the RC
        # build and we want a loud failure here rather than a silent skip
        # that strands the fan-out until an operator notices.
        deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
        while true; do
          names=$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || echo "")
          missing=""
          for a in lilbee-linux-x86_64 lilbee-macos-arm64 lilbee-windows-x86_64.exe; do
            case " ${names} " in *" ${a} "*) ;; *) missing="${missing} ${a}" ;; esac
          done
          if [ -z "${missing}" ]; then
            echo "release ${TAG} has all executables; proceeding with fan-out"
            break
          fi
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::release ${TAG} still missing executables after ${WAIT_MINUTES} minutes:${missing}"
            exit 1
          fi
          echo "release ${TAG} missing executables:${missing}; sleeping 60s"
          sleep 60
        done

    - name: Trigger Publish Docker Image
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run publish-docker.yml \
          --repo ${{ github.repository }} \
          -f tag=${{ inputs.tag }}

    - name: Trigger Publish Packages
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run publish-packages.yml \
          --repo ${{ github.repository }} \
          -f tag=${{ inputs.tag }}
