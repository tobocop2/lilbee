name: Attach binaries and the lilbee wheel to GH pre-release
description: "Attach this run's standalone executables and the pure lilbee wheel to a pre-release at the given tag. Caller needs contents:write. (Per-backend engine wheels are attached separately by attach-multigpu.)"

inputs:
  tag:
    description: "Tag to attach to (release will be created if missing)."
    required: true
  version:
    description: "PEP 440 version string used to compute prerelease=true."
    required: true

runs:
  using: composite
  steps:
    - name: Download binary artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: lilbee-*
        path: bins/
        merge-multiple: true

    # The lilbee wheel is pure Python: one platform-independent wheel, also
    # published to PyPI, so it keeps its canonical filename here.
    - name: Download the lilbee wheel
      uses: actions/download-artifact@v4
      with:
        name: wheel-default
        path: lilbee-wheel/

    - name: List release assets
      shell: bash
      run: |
        ls -lh bins/ lilbee-wheel/

    - name: Create GH pre-release with binaries and the lilbee wheel
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag }}
        files: |
          bins/*
          lilbee-wheel/*
        generate_release_notes: true
        prerelease: ${{ contains(inputs.version, 'a') || contains(inputs.version, 'b') || contains(inputs.version, 'rc') }}
