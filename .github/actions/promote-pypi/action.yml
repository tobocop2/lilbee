name: Publish wheels + sdist to PyPI
description: "Download the default-backend wheels + sdist built earlier in this run and publish them to PyPI via Trusted Publishing; caller needs environment:pypi + id-token:write."

runs:
  using: composite
  steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: wheel-default-*
        path: dist/
        merge-multiple: true

    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist/

    - name: Stage wheels + sdist
      shell: bash
      run: |
        set -euxo pipefail
        ls -lh dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
