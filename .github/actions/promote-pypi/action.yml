name: Publish to PyPI and fan out downstream packaging
description: |
  Download wheel + sdist artifacts from the current run, publish them to
  PyPI via Trusted Publishing, then dispatch publish-docker.yml and
  publish-packages.yml against the same tag. Caller's job needs
  `permissions.id-token: write` and `permissions.actions: write`, and
  must declare `environment: pypi` for the OIDC binding.

inputs:
  tag:
    description: "Tag whose binaries are already on the GH release; passed to downstream packaging."
    required: true

runs:
  using: composite
  steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: wheel-default-*
        path: dist/
        merge-multiple: true

    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist/

    - name: Stage wheels + sdist
      shell: bash
      run: |
        set -euxo pipefail
        ls -lh dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    # Dispatch downstream packaging directly. The workflow_run trigger on
    # publish-docker.yml + publish-packages.yml is gated to event=='release',
    # so workflow_call invocations of build-wheels.yml / release.yml above
    # do not auto-fire them; this step is the equivalent kick-off after PyPI
    # is live.
    - name: Trigger Publish Docker Image
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run publish-docker.yml \
          --repo ${{ github.repository }} \
          -f tag=${{ inputs.tag }}

    - name: Trigger Publish Packages
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run publish-packages.yml \
          --repo ${{ github.repository }} \
          -f tag=${{ inputs.tag }}
