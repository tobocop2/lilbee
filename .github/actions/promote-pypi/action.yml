name: Publish wheels + sdist to PyPI
description: "Download the default-backend wheels + sdist from a prior run and publish them to PyPI via Trusted Publishing; caller needs environment:pypi + id-token:write + actions:read."

inputs:
  run_id:
    description: "Run that holds the wheel-default-* + sdist artifacts (the release-candidate.yml run for the tag)."
    required: true
  github_token:
    description: "Token with actions:read for the cross-run artifact download."
    required: true

runs:
  using: composite
  steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: wheel-default-*
        path: dist/
        merge-multiple: true
        run-id: ${{ inputs.run_id }}
        github-token: ${{ inputs.github_token }}

    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist/
        run-id: ${{ inputs.run_id }}
        github-token: ${{ inputs.github_token }}

    - name: Stage wheels + sdist
      shell: bash
      run: |
        set -euxo pipefail
        ls -lh dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
