# Preregistration for one lilbee retrieval benchmark run.
# Freeze this with `python -m evals.benchmark preregister` before any data
# moves; the frozen copy carries a fingerprint so the run cannot be re-cut.
#
# Every arm is a lilbee configuration: the study grades lilbee against itself,
# so exactly one feature moves between the two arms and any metric gap is
# attributable to it. See manifest.ablation.yaml for a multi-arm example.
run_id: lilbee-parity-2026-07

# Both arms share one served embedder and one served generator; only the
# configuration under test differs. The judge must differ from the generator so
# answers are never graded by the model that wrote them (validated at load time).
models:
  embedder: qwen3-embedding
  generator: qwen2.5-72b-instruct
  generator_swap: mistral-large-2411
  judge: fable-5

arms:
  - name: lilbee-full
    system: lilbee
    description: every retrieval feature enabled
    config:
      title_search: true
      neighbor_expansion: 2
      table_extraction: true
      layout_detection: true
      intent_llm: true
  - name: lilbee-baseline
    system: lilbee
    description: dense retrieval only, the same server with the features above off
    config:
      title_search: false
      neighbor_expansion: 0
      table_extraction: false
      layout_detection: false
      intent_llm: false

# Passage sets carry native TREC qrels and load straight from ir_datasets,
# whose id names the corpus, the split, and the published copy. The
# document-structured QA sets have no retrieval labels upstream: theirs are
# derived from human gold-evidence annotations, marked label_kind: derived and
# disclosed here, and their loader is supplied by the harness rather than an id.
datasets:
  - name: scifact
    loader: beir/scifact/test
    label_kind: native
  - name: fiqa
    loader: beir/fiqa/test
    label_kind: native
  - name: nfcorpus
    loader: beir/nfcorpus/test
    label_kind: native
  - name: hotpotqa
    loader: beir/hotpotqa/test
    label_kind: native
  - name: trec-covid
    loader: beir/trec-covid
    label_kind: native
  - name: tat-dqa
    loader: tatdqa
    label_kind: derived
  - name: ott-qa
    loader: ottqa
    label_kind: derived

metrics:
  - nDCG@10
  - Recall@20
  - MRR@10

stats:
  bootstrap_resamples: 10000
  seed: 20260714
  alpha: 0.05

temperature: 0.0
