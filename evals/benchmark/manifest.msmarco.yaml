# Preregistration for the MS MARCO passage-ranking run.
#
# The corpus is msmarco-passage, 8,841,823 passages, scored on dev/small (6,980
# queries). That is the collection the published leaderboard uses, so the
# resulting MRR@10 sits beside the official BM25 baseline of 0.165 and Anserini's
# 0.184 in the same units, computed by the same trec_eval backend.
#
# Two disclosures belong with the numbers rather than in a footnote.
#
# First, dev/small carries 7,437 qrels over 6,980 queries, about 1.1 judged
# passages per query. A system that retrieves a genuinely relevant but unjudged
# passage is scored wrong. Every system on that leaderboard has the same
# handicap, so the comparison is fair, but the metric is a relative signal and
# not an absolute measure of quality.
#
# Second, Qwen3-Embedding is trained on MS MARCO: its own paper lists MS MARCO
# among the roughly seven million labelled pairs. So this is partly train-on-test
# and the number is comparable to other dense retrievers with the same exposure,
# not a clean generalisation claim. BM25 at 0.184 is the honest lexical floor
# because it trained on nothing. A held-out read belongs on BEIR, in a separate
# run, and is not what this manifest measures.
run_id: msmarco-passage-2026-07

# One index, two retrieval configurations. The comparison is what the harness is
# built for, and both arms come from the same ingest, so the only variable is
# the fusion weight.
arms:
  - name: dense
    system: lilbee
    description: vector-only retrieval; the lexical arm silenced
    config:
      lexical_fusion_weight: 0.0
  - name: hybrid
    system: lilbee
    description: dense and BM25 fused at equal weight
    config:
      lexical_fusion_weight: 0.5

models:
  # Qwen3-Embedding-8B at Q8_0: 4096 dimensions, which is a 67 GiB index at f16
  # over 8.8M passages. Q8_0 rather than f16 because it is near-lossless for
  # embedding and meaningfully faster across nine million passages; the quant is
  # recorded here so the choice is on the record rather than assumed.
  embedder: Qwen/Qwen3-Embedding-8B-GGUF/Qwen3-Embedding-8B-Q8_0.gguf
  # Declared for the answer tier, which is a separate run. Tier 1 involves no
  # generation at all: retrieval is scored against human judgments with no model
  # in the loop, which is why this run provisions an embedder and nothing else.
  generator: Mistral-Large-Instruct-2411-Q4_K_M
  judge: fable-5

datasets:
  - name: msmarco
    loader: msmarco-passage/dev/small
    label_kind: native

metrics:
  - nDCG@10
  - Recall@20
  - MRR@10

stats:
  bootstrap_resamples: 10000
  seed: 20260714
  alpha: 0.05
