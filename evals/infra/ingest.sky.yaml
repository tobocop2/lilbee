# MS MARCO ingest into one lilbee index.
#
# Adopts the proven lilbeekreuzbergstein pattern (millions of files ingested):
# config.toml in the data root selects the embedder, `lilbee sync` indexes
# documents/ in place (no copy), retry-to-zero, reconcile from LanceDB.
#
# Local-only, no network volume: on-demand A100s are stable, and everything
# lives on container NVMe. SMOKE_N proves the path on a subset before the full
# 8.8M is committed -- launch the smoke, read docs/sec, then relaunch SMOKE_N=0.
#
#   sky launch -c mm evals/infra/ingest.sky.yaml --env SMOKE_N=50000 \
#       --idle-minutes-to-autostop 20 --down -y
name: msmarco-ingest
resources:
  cloud: runpod
  # Ubuntu 24.04 (glibc 2.39): xberg's wheel needs __isoc23_strtoll (glibc 2.38).
  # A real, registry-verified runpod/pytorch tag -- a guessed tag makes RunPod
  # grab a box, fail the image pull, and release it (endless provisioning churn).
  image_id: docker:runpod/pytorch:1.0.7-rc.138-cu1281-torch271-ubuntu2404
  # ~144GB of 4096-dim FP32 vectors + documents + ir_datasets cache on local
  # NVMe (the index tar goes to the volume, not local). 350 is enough and a
  # smaller disk qualifies more instances in a scarce single datacentre.
  disk_size: 350
  # Embedding is data-parallel: one embed replica per card, so throughput scales
  # ~linearly with cards. The 50k smoke measured ~30 docs/sec on one A100. Eight
  # H100s cut the full 8.8M from ~20h to a few hours: 8x the cards, and H100's
  # ~3.35 TB/s HBM beats A100's ~2 TB/s on this bandwidth-bound Q8 embedder.
  # B200 is deliberately absent: it is Blackwell (sm_100) and the cu124 engine
  # ships kernels only for sm_70..90, so it would have none for a B200. The
  # ladder falls to A100 and to four cards rather than fail to provision.
  # H100-first in CA-MTL-3: the msmarco-index volume is pinned there, and CA-MTL-3
  # offers H100 (PCIe) + A100 (PCIe) + volume support -- a 4x H100 landed here in
  # seconds earlier. So the pod gets H100 speed AND the persistent volume that
  # makes the index survive power-off. Try H100 (8 then 4), fall to A100.
  ordered:
    - accelerators: H100:8
    - accelerators: H100:4
    - accelerators: A100-80GB:4
    - accelerators: H100:2
    - accelerators: A100-80GB:2
# The index volume (300Gi, CA-MTL-3). The index builds on local NVMe -- MooseFS is
# ~1000x slower per-file and a LanceDB build on it once cost hours with idle GPUs
# -- then finalize tars it to the volume as one sequential file (which MooseFS
# handles fine), so the 144GB index survives teardown for later grading.
volumes:
  /workspace: msmarco-index
# The local harness, synced straight to the pod (.skyignore drops .venv/caches),
# so edits deploy without a git round-trip.
file_mounts:
  /opt/evals: ./evals
envs:
  BRANCH: feat/kreuzberg-5
  BACKEND: cu124
  EMBED_MODEL: Qwen/Qwen3-Embedding-8B-GGUF/Qwen3-Embedding-8B-Q8_0.gguf
  DATASET_ID: msmarco-passage
  # 0 = full 8.8M corpus. A smoke run overrides this (--env SMOKE_N=50000).
  SMOKE_N: "0"
  LILBEE_POD_HOURLY_USD: "3.20"
setup: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"

  # uv supplies python 3.12: the pod's system python is < 3.11 and every lilbee
  # release requires >= 3.11. --clear + --seed: setup re-runs on every reclaim so
  # it must be re-entrant, and uv venv omits pip without --seed.
  uv venv --clear --seed --python 3.12 /root/lilbee_venv
  VPY=/root/lilbee_venv/bin/python

  # lilbee from PyPI. Its engine installs separately below: resolving the engine
  # through an index yields a 0.0.0 stub with an empty bin/.
  uv pip install -q --python "$VPY" --prerelease=allow lilbee

  # The PREBUILT engine, from the exact release asset. Never compiled: a git
  # checkout's packaging/engine-wheel is a 32K stub, so a source install falls
  # back to an eight-hour llama.cpp build on the GPU box. The wheel bundles its
  # own cudart, so the image's CUDA 12.8 does not conflict with the cu124 engine.
  TAG=v0.6.90b420.dev724
  WHEEL="lilbee_engine-0.6.90b420.dev724-1.${BACKEND}-py3-none-manylinux_2_17_x86_64.whl"
  curl -fsSL -o "/tmp/$WHEEL" "https://github.com/tobocop2/lilbee/releases/download/${TAG}/${WHEEL}"
  uv pip install -q --python "$VPY" --reinstall "/tmp/$WHEEL"

  # The branch's python for trace.py, deps kept from the release so the engine
  # survives, then xberg (extraction) and ir_datasets (the corpus source).
  uv pip install -q --python "$VPY" --no-deps --reinstall \
    "git+https://github.com/tobocop2/lilbee@${BRANCH}"
  uv pip install -q --python "$VPY" --prerelease=allow "xberg>=1.0.0rc30"
  uv pip install -q --python "$VPY" ir_datasets pyarrow

  ENGINE_BIN="$($VPY -c 'import lilbee_engine; print(lilbee_engine.get_llama_server_path())')"
  test -x "$ENGINE_BIN" || { echo "FATAL: no engine at $ENGINE_BIN (stub wheel?)"; exit 1; }
  $VPY -c 'import xberg'        || { echo "FATAL: xberg import failed (glibc too old?)"; exit 1; }
  $VPY -c 'import ir_datasets'  || { echo "FATAL: ir_datasets missing"; exit 1; }
  $VPY -c 'import lancedb'      || { echo "FATAL: lancedb missing"; exit 1; }
  echo "engine OK: $ENGINE_BIN ; xberg + ir_datasets + lancedb OK"

  # A shallow lilbee checkout for provenance (the exact SHA the run used).
  rm -rf /opt/lilbee-src
  git clone -q --depth 1 --branch "$BRANCH" https://github.com/tobocop2/lilbee.git /opt/lilbee-src
  mkdir -p /root/bench
  echo "lilbee_branch=$BRANCH lilbee_sha=$(git -C /opt/lilbee-src rev-parse HEAD) engine=$TAG" \
    > /root/bench/commits.txt
  cat /root/bench/commits.txt
run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  export LILBEE_DATA=/root/msmarco/data
  export WORKSPACE=/workspace
  export LOG_DIR=/root/bench/logs
  mkdir -p "$LILBEE_DATA" "$LOG_DIR"
  export LILBEE_INGEST_TRACE=1
  export LILBEE_INGEST_TRACE_FILE="$LOG_DIR/ingest_trace.log"
  export LILBEE_LOG_LEVEL=INFO
  export WORK_DIR=/root MIN_DISK_GB=120
  export LILBEE_BIN=/root/lilbee_venv/bin/lilbee PYBIN=/root/lilbee_venv/bin/python
  export EMBED_MODEL DATASET_ID SMOKE_N BACKEND
  # One embed server per detected card. Pinned to the real count (not lilbee's
  # VRAM auto-guess, which reserves room for a query fleet this run never calls).
  export LILBEE_EMBED_REPLICAS="$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l)"
  # Let the ingest hill-climb its admission limit to this box's real throughput
  # knee instead of the static cpu_quota cap, backing off only on a genuine
  # saturation signal. Falls back to static safely on an unrecognized value.
  export LILBEE_INGEST_CONCURRENCY=adaptive-aggressive
  echo "embed replicas: $LILBEE_EMBED_REPLICAS ; SMOKE_N=$SMOKE_N ; concurrency=$LILBEE_INGEST_CONCURRENCY"
  # Fails before the GPU hours start, not during them.
  bash /opt/evals/infra/preflight.sh 2>&1 | tee "$LOG_DIR/preflight.log"
  bash /opt/evals/infra/ingest.sh
