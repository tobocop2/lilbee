# Stage 2: embed and index 8,841,823 passages.
#
# 4x A100-80GB. Embedding is data-parallel -- each card takes a different shard
# and there is no all-reduce -- so more GPUs is close to linear here. That is a
# different situation from tensor-split generation, which a previous run found
# all-reduce-bound on PCIe; the earlier warning does not apply to this workload.
#
# disk_size holds the working set on local NVMe. The volume is for sequential
# files only: it is MooseFS, where per-file operations measured ~1000x slower
# than local disk, and building a LanceDB index there cost a previous run four
# hours with the GPUs idle.
#
#   sky launch -c msmarco-ingest evals/infra/ingest.sky.yaml --retry-until-up -y
name: msmarco-ingest
resources:
  cloud: runpod
  disk_size: 600
  # A100 only. The volume lives in US-WA-1 and a RunPod volume cannot change
  # datacentre; US-WA-1 has A100-SXM4-80GB and no H100, so switching GPU family
  # would mean rebuilding the volume and re-fetching the corpus.
  #
  # Widest A100 ladder rather than a single shape, because stock is Low: four
  # cards is the fast path, but a single card still ingests, just slower. The
  # embedding is data-parallel, so cards trade directly against wall time.
  ordered:
    - accelerators: A100-80GB-SXM:4
    - accelerators: A100-80GB:4
    - accelerators: A100-80GB-SXM:2
    - accelerators: A100-80GB:2
    - accelerators: A100-80GB-SXM:1
    - accelerators: A100-80GB:1
volumes:
  /workspace: msmarco-bench
envs:
  # Two branches, because neither has everything. lilbee comes from
  # feat/kreuzberg-5, which carries data/ingest/trace.py -- the per-document
  # timing that the whole run exists to capture and that never merged to main.
  # The harness comes from its own branch. Both SHAs are recorded on the pod so
  # the run is reproducible from the record rather than from memory.
  BRANCH: feat/kreuzberg-5
  HARNESS_BRANCH: feat/rag-eval-harness
  BACKEND: cu124
  EMBED_MODEL: Qwen/Qwen3-Embedding-8B-GGUF/Qwen3-Embedding-8B-Q8_0.gguf
  LILBEE_POD_HOURLY_USD: "6.40"
  # MS MARCO passages are plain text. OCR would reserve vision VRAM, compete for
  # the same cards, and never fire on a single document.
  LILBEE_ENABLE_OCR: "false"
  # Only the embedder is loaded, so there is no second model to leave room for.
  LILBEE_GPU_MEMORY_FRACTION: "0.90"
  HF_TOKEN: ""
setup: |
  set -euo pipefail
  curl -fsSL "https://raw.githubusercontent.com/tobocop2/lilbee/${BRANCH}/tools/qa/opencode/pod_bootstrap.sh" -o /tmp/pod_bootstrap.sh
  BRANCH="${BRANCH}" BACKEND="${BACKEND}" bash /tmp/pod_bootstrap.sh
  # Overlay the harness onto the lilbee checkout. Idempotent, because setup
  # re-runs on every relaunch and on every pod reclaim.
  rm -rf /tmp/harness
  git clone --depth 1 --branch "$HARNESS_BRANCH" https://github.com/tobocop2/lilbee.git /tmp/harness
  cp -r /tmp/harness/evals /opt/lilbee-src/
  test -f /opt/lilbee-src/evals/infra/ingest.sh || { echo "FATAL: harness overlay missing"; exit 1; }
  test -f /opt/lilbee-src/src/lilbee/data/ingest/trace.py || { echo "FATAL: no trace.py; wrong lilbee branch"; exit 1; }
  # The record of what actually ran, written where the provenance can find it.
  mkdir -p /workspace/logs
  { echo "lilbee_branch=$BRANCH lilbee_sha=$(git -C /opt/lilbee-src rev-parse HEAD)";
    echo "harness_branch=$HARNESS_BRANCH harness_sha=$(git -C /tmp/harness rev-parse HEAD)"; } \
    | tee /workspace/logs/commits.txt
run: |
  set -euo pipefail
  cd /opt/lilbee-src
  export WORKSPACE=/workspace LOCAL=/root/msmarco
  export LILBEE_INGEST_TRACE=1
  export LILBEE_INGEST_TRACE_FILE=/workspace/logs/ingest_trace.log
  export WORK_DIR=/root MIN_DISK_GB=400
  export LILBEE_BASE_URL=http://127.0.0.1:8080
  # One embed server per card that actually provisioned. lilbee's auto setting
  # is one-per-GPU but caps itself by the VRAM left after reserving a persistent
  # query fleet (chat, rerank, vision) this run never calls, so it is pinned --
  # to the real count, not a guess. The resource ladder can land on four cards,
  # two, or one, and four embed servers on a single card would contend for the
  # same SMs while quadrupling the weights held in its memory.
  export LILBEE_EMBED_REPLICAS="$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l)"
  echo "embed replicas: $LILBEE_EMBED_REPLICAS (one per detected GPU)"
  mkdir -p /workspace/logs
  # Fails before the hours start, not during them.
  bash evals/infra/preflight.sh 2>&1 | tee /workspace/logs/preflight.log
  bash evals/infra/ingest.sh    2>&1 | tee -a /workspace/logs/ingest.log
