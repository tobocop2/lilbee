# Persistent volume for the MS MARCO run: the corpus going in, the index tarball
# coming out. Both survive pod teardown, which matters because a secure pod can
# be reclaimed mid-ingest and the alternative is re-downloading 8.8M passages.
#
# Pinned to CA-MTL-3, which has A100 and offers network volumes.
#
# The volume has moved twice, and both moves were forced by the same property: a
# RunPod volume cannot change datacentre, so it pins the GPU search to one
# region. US-MD-1 had the best A100 stock and does not offer volumes at all.
# US-WA-1 had both, and then its A100 stock went to zero mid-run, at which point
# sky churned silently against a region with no capacity rather than failing.
#
# The corpus is cheap to regenerate -- seven minutes and about ten cents -- so
# the volume is treated as disposable and follows the GPUs, rather than the GPU
# search being held hostage by where the data happens to sit.
#
# A RunPod volume cannot change datacentre, so the intersection of "has the GPU"
# and "offers volumes" has to be resolved before anything else exists.
#
# A100 rather than H100 deliberately: the prebuilt cu124 engine ships no sm_90
# kernels and dies on H100 with a misleading "no CUDA-capable device". A100 is
# sm_80 and known-good.
#
#   sky volumes apply evals/infra/volume.sky.yaml
name: msmarco-eu
type: runpod-network-volume
infra: runpod/EU/EU-RO-1
# Corpus 3G + 8.8M passage files ~35G + index ~135G at f32 + tarball ~135G,
# with headroom for the tar to exist beside the thing it archives.
size: 600Gi
