# Separate distribution: a per-platform wheel bundling the compiled llama.cpp
# llama-server binary. Pulled by `lilbee[multi-gpu]`. CI sets the version to match
# the llama-cpp-python pin and fills lilbee_llama_server/bin/ before building.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilbee-llama-server"
version = "0.0.0"
description = "Bundled llama.cpp llama-server binary for lilbee[multi-gpu]"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["lilbee_llama_server"]

[tool.setuptools.package-data]
lilbee_llama_server = ["bin/*"]
