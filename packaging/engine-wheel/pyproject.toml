# Separate distribution: a per-platform, self-contained wheel bundling lilbee's
# three engine binaries (llama.cpp llama-server + its ggml/llama/mtmd libs,
# llama-swap, gguf-parser). lilbee's core dependency (the local engine). CI sets
# the version to match lilbee and fills lilbee_engine/bin/ before building.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilbee-engine"
version = "0.0.0"
description = "Self-contained local inference engine for lilbee (llama-server + llama-swap + gguf-parser)"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["lilbee_engine"]

[tool.setuptools.package-data]
lilbee_engine = ["bin/*"]
