[project]
name = "lilbee"
version = "0.6.66b484"
description = "A batteries-included terminal app for local AI: a browsable model catalog, a search engine over your own files and code, and a chat that cites its sources. Per-project libraries, semantic and hybrid search, vision OCR, auto-built wiki. CLI, TUI, MCP server, REST API, and Python library in one process; no model server, no database server."
readme = "README.md"
license = "Elastic-2.0"
authors = [{ name = "tobocop2", email = "5562156+tobocop2@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = [
    "rag", "local-llm", "local-ai",
    "mcp", "mcp-server",
    "semantic-search", "vector-search", "retrieval",
    "embeddings", "knowledge-base",
    "huggingface", "ocr", "web-crawler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "lancedb",
    "kreuzberg>=4.9.1",
    "filelock",
    "tree-sitter-language-pack>=1.8.0,<2.0",
    "typer>=0.12",
    "tiktoken",
    "textual>=0.75",
    "mcp>=1.26.0",
    "pillow>=11.3.0",
    "litestar>=2.0",
    "uvicorn>=0.30",
    "httpx",
    "lilbee-llama-server",
    "diskcache>=5.6.1",
    "jinja2>=2.11.3",
    "typing-extensions>=4.5.0",
    "gguf>=0.18",
    "huggingface_hub>=1.11.0",
    "psutil>=5.9",
    "pydantic-settings>=2.13.1",
    "numpy",
]

[project.optional-dependencies]
remote = ["litellm>=1.50"]
graph = ["spacy>=3.8", "graspologic-native>=1.2"]
crawler = ["crawl4ai>=0.8.6"]
release = ["lilbee[crawler,remote,graph]"]

[project.urls]
Homepage = "https://lilbee.sh/"
Repository = "https://github.com/tobocop2/lilbee"
Issues = "https://github.com/tobocop2/lilbee/issues"

[project.scripts]
lilbee = "lilbee.runtime.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lilbee"]

# Dev resolves the bundled engine from the in-repo wheel package; CI fills its
# bin/ with the compiled, self-contained llama-server before building. Release
# installs (`pip install lilbee`) resolve `lilbee-llama-server` from the index
# instead -- this source override is workspace metadata, not published deps.
[tool.uv.sources]
lilbee-llama-server = { path = "packaging/llama-server-wheel" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "reportlab",
    "ruff>=0.15.4",
    "httpx>=0.27",
    "pytest-httpserver",
    "types-pyyaml>=6.0.12.20250915",
    "pytest-xdist>=3.8.0",
    "pytest-forked>=1.6.0",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--ignore=tests/integration"
timeout = 60
markers = [
    "slow: integration tests that download models or take >10s",
    "real_model_classify: opt out of the global _classify_installed_models mock",
    "real_litellm_probe: opt out of the global litellm_available True override",
    "xdist_group: pin grouped tests to a single xdist worker for serial execution",
    "no_health_default: opt out of the launch tests' default-healthy fixture",
]

[tool.coverage.run]
source = ["lilbee"]
omit = ["src/lilbee/__main__.py", "src/lilbee/runtime/launcher.py"]
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if sys.platform",
    "class.*Protocol",
]
omit = [
    "src/lilbee/__main__.py",
    "src/lilbee/runtime/launcher.py",
    "src/lilbee/core/system.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "S",     # flake8-bandit: security antipatterns (eval, exec, pickle, unsafe subprocess, etc.)
    "C90",   # mccabe complexity
    "N",     # pep8-naming
    "RET",   # flake8-return: consistent return semantics
    "TID",   # flake8-tidy-imports: forbid relative imports
    "PLR0911", # too many returns
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
]
# DeepSeek V3.1's tool-call markers are intentionally fullwidth (｜ U+FF5C,
# ▁ U+2581). These are the exact characters the model emits; substituting
# the ASCII look-alikes would break extraction.
allowed-confusables = ["｜", "▁"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test-context S-rule noise. Each of these is either a test fixture
# (hardcoded token/password literals, fake /tmp paths, 0.0.0.0 bind
# assertions), or an intentional subprocess spawn for an e2e test:
# - S101 assert (tests are built on it)
# - S104 bind-all-interfaces (testing host parsing)
# - S105/S106 hardcoded password string/arg (test fixtures)
# - S108 /tmp paths (mocked, not actual temp-file usage)
# - S603/S607 subprocess (e2e tests spawning sys.executable)
# Test files also ignore PLR2004 (test fixtures use literal expected
# values inline; extracting them to constants hurts readability) and
# the pep8-naming rules (test helpers frequently shadow PascalCase
# class names from the system under test).
"tests/**/*.py" = [
    "S101", "S104", "S105", "S106", "S108", "S603", "S607",
    "PLR2004",
    "N802", "N806", "N818", "N817",
]
# QA matrix runner is a test framework just like tests/; same ignores apply.
"tools/qa/**/*.py" = [
    "S101", "S104", "S105", "S106", "S108", "S603", "S607",
    "PLR2004",
    "N802", "N806", "N818", "N817",
]
"conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
