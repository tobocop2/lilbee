# osv-scanner suppressions. Keep this list short and each entry justified.
# OSV scans against the OSV.dev database, which covers more ecosystems than
# pip-audit (GHSA, OSV, Alpine SecDB, and others). When a finding maps to
# something already triaged in .github/workflows/security-scan.yml, mirror
# the suppression here so osv-scanner and pip-audit stay in sync.

[[IgnoredVulns]]
id = "CVE-2025-69872"
reason = "diskcache 5.6.3 pulled in transitively by llama-cpp-python. No upstream fix published. Exploitation requires write access to the user's own cache directory, which is already a post-compromise scenario. Revisit when llama-cpp-python drops or patches diskcache."

[[IgnoredVulns]]
id = "PYSEC-2022-42969"
reason = "py 1.11.0 (unmaintained) pulled in transitively by pytest-forked>=1.6.0, which the `make test-ci-forked` target uses. The advisory is a ReDoS in py.path.svnwc that requires attacker-controlled Subversion repository paths; lilbee and pytest-forked never call py.path.svnwc, and it is not exposed to untrusted input. No upstream fix will ship. Revisit if pytest-forked drops the py dependency."

[[IgnoredVulns]]
id = "GHSA-vfmq-68hx-4jfw"
reason = "lxml 5.4.0 pinned transitively by crawl4ai 0.8.6 (latest release), which requires `lxml~=5.3`. The fix lands in lxml 6.1.0 (defaults `resolve_entities` to 'internal' for iterparse/ETCompatXMLParser). lxml is only installed when users opt into the `crawler` extra, and crawl4ai uses lxml primarily for HTML scraping, not untrusted XML parsing with iterparse. Revisit when crawl4ai loosens its lxml pin."

[[IgnoredVulns]]
id = "GHSA-xqmj-j6mv-4862"
reason = "Server-side template injection in the LiteLLM Proxy server's `POST /prompts/test` endpoint. lilbee uses litellm only as an SDK (litellm.completion in src/lilbee/providers/litellm_sdk.py) and never runs the proxy server, so the affected endpoint is not exposed. Bumping to the patched 1.83.7 is currently blocked: litellm 1.83.7+ hard-pins click==8.1.8, but typer (a direct dependency) requires click>=8.2.1. Revisit when litellm loosens its click pin or typer relaxes its click floor."

[[IgnoredVulns]]
id = "GHSA-r75f-5x8p-qvmc"
reason = "SQL injection in the LiteLLM Proxy server's API-key verification path. Reachable only via proxy HTTP endpoints (e.g. POST /chat/completions through the proxy). lilbee uses litellm only as an SDK (litellm.completion in src/lilbee/providers/litellm_sdk.py) and never starts the proxy, so the affected code path is not exposed. Patched in 1.83.7; bump is blocked by the same click==8.1.8 vs typer click>=8.2.1 conflict noted on GHSA-xqmj-j6mv-4862."

[[IgnoredVulns]]
id = "GHSA-v4p8-mg3p-g94g"
reason = "Authenticated command execution via the LiteLLM Proxy MCP stdio test endpoints (POST /mcp-rest/test/connection and /mcp-rest/test/tools/list). Requires a valid proxy API key and only triggers when the proxy is running. lilbee uses litellm only as an SDK (litellm.completion in src/lilbee/providers/litellm_sdk.py) and never starts the proxy, so neither endpoint is exposed. Patched in 1.83.7; bump is blocked by the same click==8.1.8 vs typer click>=8.2.1 conflict noted on GHSA-xqmj-j6mv-4862."

# pygments is never a runtime or dev dependency; it is only resolved
# transitively under tools/qa/requirements.txt (the QA-matrix runner venv,
# pulled in via pytest). That harness is not published to PyPI or shipped to
# users, and uv.lock pins pygments 2.20.0 (patched) for everything else.
# pip-audit scans uv.lock and so does not flag these; osv-scanner resolves the
# QA requirements file and does. Revisit if the QA runner is ever distributed.
[[IgnoredVulns]]
id = "PYSEC-2023-117"
reason = "ReDoS in pygments lexers (CVE-2022-40896 / GHSA-mrwq-x4v8-fh7p). pygments is only resolved transitively under tools/qa/requirements.txt, the QA-matrix runner venv, which is never shipped. The dev and runtime environments pin pygments 2.20.0 (patched) via uv.lock."

[[IgnoredVulns]]
id = "GHSA-5239-wwwm-4pmq"
reason = "ReDoS in pygments GUID matching (CVE-2026-4539). pygments is only resolved transitively under tools/qa/requirements.txt, the QA-matrix runner venv, which is never shipped. The dev and runtime environments pin pygments 2.20.0 (patched) via uv.lock."
